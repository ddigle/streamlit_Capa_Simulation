[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "capa-simulation"
version = "0.1.0"
description = "HBM PKG line capacity simulation"
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
    # 화면 2곳이 직접 import 한다. streamlit 이 전이 의존으로 끌고 와서 지금은 동작하지만,
    # streamlit 이 그 의존을 끊으면 가용설비·Space 화면이 ImportError 로 죽는다.
    "altair>=5,<7",
    "duckdb==1.5.5",
    "pandas>=2.2,<3",
    "plotly>=5.24,<7",
    # 코드가 아직 import 하지 않는다. docs/TODO.md 의 domain/schemas.py 구현에 쓴다.
    "pydantic>=2.9,<3",
    "streamlit>=1.60,<2",
    "xlwings>=0.33,<1",
]

# PEP 735 의존성 그룹. `[project.optional-dependencies]` 의 extra 와 달리 배포 메타데이터에
# 들어가지 않아 개발 도구를 소비자에게 노출하지 않는다. 그룹 이름이 `dev` 여야
# `uv sync` 가 기본으로 함께 설치한다(uv 의 default-groups 가 `["dev"]` 다).
[dependency-groups]
dev = [
    "mypy>=1.12,<2",
    "pandas-stubs",
    "pytest>=8.3,<9",
    "pytest-cov>=5,<7",
    "ruff>=0.7,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [".venv*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["app.py", "app_pages", "src/capa_simulation"]

[[tool.mypy.overrides]]
module = ["duckdb", "duckdb.*", "plotly", "plotly.*"]
ignore_missing_imports = true

[tool.setuptools.package-data]
# 이게 없으면 tests·scripts 에서 mypy 를 돌릴 때 실제 타입 오류 대신
# "missing library stubs or py.typed marker" 만 42건 나온다.
"capa_simulation" = ["py.typed"]
"capa_simulation.persistence.migrations" = ["*.sql"]
"capa_simulation.persistence.equipment_migrations" = ["*.sql"]
