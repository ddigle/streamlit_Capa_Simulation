[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "capa-simulation"
version = "0.1.0"
description = "HBM PKG line capacity simulation"
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
    "duckdb==1.5.5",
    "openpyxl>=3.1,<4",
    "pandas>=2.2,<3",
    "plotly>=5.24,<7",
    "pydantic>=2.9,<3",
    "python-dotenv>=1.0,<2",
    "streamlit>=1.60,<2",
    "xlwings>=0.33,<1",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.12,<2",
    "pandas-stubs",
    "pytest>=8.3,<9",
    "pytest-cov>=5,<7",
    "ruff>=0.7,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [".venv*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["app.py", "app_pages", "src/capa_simulation"]

[[tool.mypy.overrides]]
module = ["duckdb", "duckdb.*", "plotly", "plotly.*"]
ignore_missing_imports = true

[tool.setuptools.package-data]
"capa_simulation.persistence.migrations" = ["*.sql"]
"capa_simulation.persistence.equipment_migrations" = ["*.sql"]
