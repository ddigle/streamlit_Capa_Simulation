[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "capa-simulation"
version = "0.1.0"
description = "HBM PKG line capacity simulation"
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
    # 화면 2곳이 직접 import 한다. streamlit 이 전이 의존으로 끌고 와서 지금은 동작하지만,
    # streamlit 이 그 의존을 끊으면 가용설비·Space 화면이 ImportError 로 죽는다.
    "altair>=5,<7",
    # 통합인증 서명 인증서(X.509 · RSA 공개키)를 `auth/config.py` 가 직접 읽는다. `pyjwt[crypto]` 가 끌어오는
    # 판(락 그대로)이지만 코어 import 는 직접 적는다 — 끌어오는 쪽이 바뀌어도 빠지지 않게.
    "cryptography>=42,<51",
    "duckdb==1.5.5",
    # `src` 의 계산·설비 서비스가 직접 import 한다. pandas·streamlit 이 끌어와 지금도 깔리지만, 직접 적어야
    # 그 둘이 의존을 바꿔도 빠지지 않는다. 사내 모듈 점검(M09)도 이 줄로 numpy 를 「직접 의존」 으로 본다.
    # 판은 락 그대로다(Python 3.10 을 받는 마지막 마이너 2.2).
    "numpy>=2.2,<3",
    "pandas>=2.2,<3",
    "plotly>=5.24,<7",
    # 코드가 아직 import 하지 않는다. docs/TODO.md 의 domain/schemas.py 구현에 쓴다.
    "pydantic>=2.9,<3",
    # 통합인증(`capa_simulation.auth`)의 ID 토큰(RS256) · 세션 토큰(HS256) 검증. RS256 에
    # cryptography 가 필요해 `[crypto]` 로 받는다. 하한 2.10.1 은 2.10.0 의 iss 부분 일치
    # 결함(issuer 문자열 일부만 맞아도 통과)을 피한다. 통합인증이 꺼진 서버는 import 하지 않는다.
    "pyjwt[crypto]>=2.10.1,<3",
    # 통합인증 문지기(`auth/gate.py`) · 경로(`auth/web.py`)가 직접 import 한다. Streamlit 1.63 의 서버가 이미 쓰는
    # 판(락 그대로)이지만 코어 import 는 직접 적는다.
    "starlette>=1.6,<2",
    # 마이너 하나에 묶는다. 화면이 `persist_state`·`st.container(horizontal=)`·fragment 같은
    # 최신 위젯 API 에 기대고 있어 마이너가 오르면 배치가 바뀔 수 있다. 락(`uv.lock`)과 그 그림자
    # `requirements.txt` 도 배포 ZIP 에 실려 사내에 그대로 가지만(`build_deploy_package` 의
    # `EXCLUDED_FILES` 는 비어 있다), `uv lock --upgrade` 한 번에 마이너가 넘어가지 않게 범위로도 묶는다.
    "streamlit>=1.63,<1.64",
    "xlwings>=0.33,<1",
]

# PEP 735 의존성 그룹. `[project.optional-dependencies]` 의 extra 와 달리 배포 메타데이터에
# 들어가지 않아 개발 도구를 소비자에게 노출하지 않는다. 그룹 이름이 `dev` 여야
# `uv sync` 가 기본으로 함께 설치한다(uv 의 default-groups 가 `["dev"]` 다).
[dependency-groups]
dev = [
    "mypy>=1.12,<2",
    "pandas-stubs",
    "pytest>=8.3,<9",
    "pytest-cov>=5,<7",
    "ruff>=0.7,<1",
]

# 사내 전용 `bigdataquery` 는 여기에 적지 않고 `requirements-company.txt` 에 둔다. uv 락은
# universal 이라 extra·group 을 가리지 않고 전부 해석하므로, `[project.optional-dependencies]`
# 에 두면 `--extra` 를 고르지 않아도 사내 인덱스를 찾다가 개발 PC 의 `uv lock` 이 죽는다.
#
# 파일로 뺀 덕분에 **이 선언과 `uv.lock` 이 사내·사외에서 같다.** 그래서 배포 ZIP 에서 빼야
# 할 파일이 없다. 설치 절차는 `README.md` 의 「초기 설정」에 있다.

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
# `review/` 는 사내가 쓰는 리뷰 문서 자리다. ruff 0.16 은 Markdown 의 ```python 블록까지 포맷 검사해서
# 사내 리뷰 문서 하나가 4대 관문을 떨어뜨렸다(202610061748 리뷰). 코드가 아니므로 검사에서 뺀다.
# `./modules` 는 사내에만 있는 사내 모듈 자리(`modules/<id>/`)다. 코어 관문 수가 사내·사외에서 같게
# 빼고, 모듈은 `scripts/check_module.py` 가 경로를 직접 주어 같은 규칙으로 따로 본다. 반드시 `./` 를
# 붙인다 — 맨 `modules` 는 모든 깊이를 빼서 `tests/fixtures/modules/` 견본까지 검사 밖으로 나간다
# (`tests/test_repository_hygiene.py` 가 고정한다).
extend-exclude = [".venv*", "review", "./modules"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
strict = true
# `tests`·`scripts` 도 같은 strict 로 본다. 두 폴더에는 `__init__.py` 가 없어(`tests/` 에 넣으면
# pytest 가 저장소 루트를 sys.path 에 넣어 테스트끼리의 맨이름 import 가 죽는다) 모듈 이름이
# `test_dashboard`·`compact_duckdb` 같은 맨이름이다. 아래 overrides 도 그 이름으로 적는다
# (`tests.*` 는 아무것도 잡지 않고, `test_*` 같은 접두 와일드카드는 mypy 가 거절한다).
files = ["app.py", "capa_server.py", "app_pages", "src/capa_simulation", "tests", "scripts"]
# `tests/test_deploy_package.py` 처럼 테스트가 `scripts/` 모듈을 맨이름으로 부르는 것을 찾는
# 경로. 위 `files` 전체를 돌릴 때는 없어도 찾지만, 파일 하나만 넘길 때(`mypy tests/x.py`,
# 편집기)는 이것이 있어야 찾는다. 상대경로라 저장소 루트에서 돌린다.
mypy_path = "tests, scripts"

[[tool.mypy.overrides]]
module = ["duckdb", "duckdb.*", "plotly", "plotly.*"]
ignore_missing_imports = true

# pandas-stubs 는 `df.loc[행, 열]` 한 칸을 str·bytes·date·complex 등 열두 갈래 합집합으로
# 돌려준다. 문자열 칸에 `in`, 숫자 칸에 `*` 를 걸면 갈래마다 operator 오류가 나서 cast 를 덧대야
# 한다. 그 자리가 있는 모듈에서만 이 코드 하나를 끈다. `arg-type`·`typeddict-item`·`index` 는
# 끄지 않는다 — 테스트가 계약을 어긴 값(빈 `ActiveScenario` 등)을 굳히던 결손이 그 코드로 잡혔다.
# 모듈을 더할 때는 그 모듈의 operator 오류가 전부 이 마찰인지 먼저 본다.
[[tool.mypy.overrides]]
module = ["test_dashboard", "test_e2e_equipment_import", "test_equipment_csv"]
disable_error_code = ["operator"]

[tool.setuptools.package-data]
# 이게 없으면 tests·scripts 에서 mypy 를 돌릴 때 실제 타입 오류 대신
# "missing library stubs or py.typed marker" 만 42건 나온다.
"capa_simulation" = ["py.typed"]
"capa_simulation.persistence.migrations" = ["*.sql"]
"capa_simulation.persistence.equipment_migrations" = ["*.sql"]
# Space 배치 편집기·첫 접속 입장 화면·화면 탭 줄·설비 마스터 표의 HTML·CSS·JS(입장 화면은 부분 글꼴과 그
# 라이선스도). 모듈이 읽을 때 파일에서 읽어 컴포넌트로 등록한다.
"capa_simulation.components" = [
    "space_layout_editor_assets/*",
    "intro_overlay_assets/*",
    "page_tabs_assets/*",
    "equipment_master_grid_assets/*",
]
