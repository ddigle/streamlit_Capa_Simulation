# 검증 4종을 PR 과 main 에서 돌린다. 개발 PC 의 네 명령과 같은 순서·같은 도구다. 둘째 작업
# `windows-pytest` 는 사내와 같은 Windows 에서 pytest 만 돌리고 막지 않는다(아래 그 작업 머리).
#
# 병행 개발에서 이 파일이 하는 일은 하나다 — 두 후보 브랜치 중 **무엇이 진짜 통과했는지**를
# 사람이 아니라 기계가 말하게 하는 것. `main` 에 브랜치 보호를 걸지 않아 「통과해야만 병합」을
# 강제하지 않으므로, 초록·빨강을 보여 주는 데까지가 이 파일의 몫이다.
name: verify

on:
  pull_request:
  push:
    # 후보 브랜치도 **올리는 즉시** 돈다. 병행 개발에서 이 파일의 쓸모가 거기 있다 —
    # PR 을 열기 전에도 「내 후보가 진짜 통과했는지」를 기계가 말해 준다.
    branches: [main, "cand/**"]

# 같은 브랜치에 연달아 올리면 앞의 실행을 취소한다. 같은 일을 두 번 돌리지 않는 곳이 여기다.
#
# **브랜치 이름으로 묶는다.** `github.ref` 로 묶으면 후보 브랜치에 PR 이 열려 있을 때
# push 와 pull_request 가 서로 다른 ref 를 갖게 되어 **같은 커밋을 두 번** 돌린다.
# `head_ref` 는 PR 에서만, `ref_name` 은 push 에서만 차므로 둘이 한 칸을 나눠 쓴다.
concurrency:
  group: verify-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    # **사외(github.com)에서만 돈다.** 배포 세트는 `git ls-files` 전부라 이 파일도 사내 ZIP 에
    # 실린다(`build_deploy_package.py` 의 `EXCLUDED_FILES` 는 일부러 비어 있다 — 선언과 잠금이
    # 양쪽에서 같다는 계약을 지키는 자리다). 사내 GitHub 에서 Actions 가 켜져 있으면 인터넷이
    # 없어 uv 설치 단계에서 죽고, 사내는 소스를 고칠 수 없어 그 빨간 X 를 지울 방법이 없다.
    # 이 한 줄이 거짓이 되면 실행은 빨간 X 가 아니라 회색 skipped 로 남는다.
    # **사외 저장소 이름을 바꾸면 이 줄도 같이 고친다.**
    if: github.repository == 'ddigle/streamlit_Capa_Simulation'
    runs-on: ubuntu-latest
    # 사외 WSL 에서 pytest 한 판이 약 12분이다(2026-10-13). 러너는 2코어 공용이라 더 걸린다.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          # **얕은 복제면 안 된다.** `tests/test_migration_parity.py` 가 후보 브랜치의 새
          # 마이그레이션을 가리려고 `main` 과의 merge-base 를 본다. 기본값(depth 1)에서는
          # 갈림점까지의 이력이 없어 그 검사가 아무것도 가리지 못한다.
          #
          # **그러나 이 한 줄로는 부족하다.** `fetch-depth: 0` 은 이력을 전부 받지만
          # **로컬 `main` 브랜치를 만들지 않는다** — 로컬 브랜치는 체크아웃한 것 하나뿐이라
          # `git merge-base main HEAD` 는 `fatal: Not a valid object name main` 로 실패한다.
          # 그래서 검사 쪽이 `origin/main` 폴백을 갖고, CI 안에서 기준을 못 찾으면 skip 이
          # 아니라 fail 한다. 둘이 짝이다 — 한쪽만 있으면 초록인데 아무것도 안 본 상태가 된다.
          fetch-depth: 0

      # `setup-python` 을 쓰지 않는다. 파이썬 버전의 근거가 `uv.lock` 하나여야 CI 와 개발 PC 가
      # 어긋나지 않는다 — 저장소에 `.python-version` 이 없다.
      - name: uv 설치
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Python 3.10.11 고정
        run: uv python install 3.10.11

      # `--frozen` 은 락을 다시 풀지 않는다. CI 가 개발 PC 와 다른 버전을 끌어올 수 없다.
      - name: 의존성 설치
        run: uv sync --frozen --python 3.10.11

      # 단계 이름에 번호를 붙인 것은 개발자가 아닌 사람이 Checks 탭만 보고 「어디서
      # 멈췄나」를 읽게 하려는 것이다.
      - name: 1/4 포맷
        run: uv run --no-sync python -m ruff format --check .

      - name: 2/4 린트
        run: uv run --no-sync python -m ruff check .

      - name: 3/4 타입
        run: uv run --no-sync python -m mypy

      - name: 4/4 테스트
        env:
          PYTHONIOENCODING: utf-8
        run: uv run --no-sync python -m pytest -q

      - name: 결과 한 줄
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "## 검증 4종 전부 통과" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## 검증에서 멈췄습니다 — 위 단계 중 빨간 것을 엽니다" >> "$GITHUB_STEP_SUMMARY"
          fi

  # **Windows 에서도 pytest 를 돌린다 — 막지 않는다**(2026-11-01 사용자 결정 A7). 사내는 Windows 에서 4관문을
  # 도는데 사외 CI 가 Linux 뿐이라, 경로 구분자 · 명령줄 길이 · 권한 비트처럼 Windows 에서만 깨지는 시험이 사내
  # 리뷰 한 바퀴 뒤에야 보였다(리뷰 202610271800 발견 2 — 16개). 처음에는 DuckDB 잠금 · 임시 경로 같은 차이가
  # 더 보일 수 있어 **작업 단위 `continue-on-error`** 로 둔다 — 이 작업이 빨개도 워크플로는 초록이고 위
  # `verify` 가 판정이다. 두어 판 본 뒤 굳힐 때 그 한 줄을 뺀다.
  #
  # 설치는 위 작업과 **같은 세 줄**이다(`setup-uv` · `uv python install 3.10.11` · `uv sync --frozen`) — 다른
  # 길로 깔면 Windows 차이와 설치 차이를 가를 수 없다(`tests/test_ci_workflow.py` 가 두 작업의 그 줄을 견준다).
  # 포맷 · 린트 · 타입은 OS 와 상관없어 Linux 쪽에서만 본다. 셸은 기본(pwsh)이다 — 사내도 PowerShell 이다.
  windows-pytest:
    if: github.repository == 'ddigle/streamlit_Capa_Simulation'
    runs-on: windows-latest
    continue-on-error: true
    # Windows 러너는 같은 시험이 Linux 보다 느리다(파일 열기 · 프로세스 띄우기).
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          # 위 작업과 같은 까닭 — `tests/test_migration_parity.py` 가 `main` 과의 merge-base 를 본다.
          fetch-depth: 0

      - name: uv 설치
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Python 3.10.11 고정
        run: uv python install 3.10.11

      - name: 의존성 설치
        run: uv sync --frozen --python 3.10.11

      - name: 테스트 (Windows — 막지 않음)
        env:
          PYTHONIOENCODING: utf-8
        run: uv run --no-sync python -m pytest -q

      - name: 결과 한 줄
        if: always()
        run: |
          if ("${{ job.status }}" -eq "success") {
            "## Windows pytest 통과" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          } else {
            "## Windows pytest 에서 멈췄습니다 — 막지 않는 작업이라 병합 판정은 verify 입니다" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          }
