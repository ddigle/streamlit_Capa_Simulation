<div class="sle" lang="ko">

    <div class="sle-zoom" role="group" aria-label="확대·축소">
      <span class="sle-tiphost" aria-describedby="sle-tip"><button type="button" class="sle-zoom-out" aria-label="축소" title="축소 (−, Ctrl+휠)">−</button></span>
      <span class="sle-zoom-label" aria-live="polite">100%</span>
      <span class="sle-tiphost" aria-describedby="sle-tip"><button type="button" class="sle-zoom-in" aria-label="확대" title="확대 (+, Ctrl+휠)">+</button></span>

      <span class="sle-tiphost" aria-describedby="sle-tip"><button type="button" class="sle-zoom-sel">고른 곳 보기</button></span>
    </div>
    <span class="sle-tiphost sle-edit-only" aria-describedby="sle-tip"><button type="button" class="sle-undo" title="Ctrl+Z">실행 취소</button></span>
    <span class="sle-tiphost sle-edit-only" aria-describedby="sle-tip"><button type="button" class="sle-reset" title="적용 안 한 변경을 모두 버립니다 — 실행 취소로 돌아오지 않습니다">처음 상태로</button></span>
    <span class="sle-tiphost sle-edit-only" aria-describedby="sle-tip"><button type="button" class="sle-unplace" title="Delete — 호기는 미배치 칸으로, 도면 요소는 지웁니다">빼기·지우기</button></span>
    <span class="sle-pick sle-view-only" aria-live="polite"></span>
    <span class="sle-spacer"></span>
    <span class="sle-asof sle-fab-only sle-view-only" hidden><span class="sle-asof-label">기준일 </span><span

    <button type="button" class="sle-totoday sle-fab-only sle-view-only" hidden aria-label="기준일을 오늘로"
            title="기준일을 오늘로 되돌립니다">오늘<span class="sle-totoday-tail">로</span></button>
    <span class="sle-flagnote sle-fab-only sle-view-only" hidden><span
          class="sle-flagnote-dot" aria-hidden="true">!</span><span class="sle-flagnote-text"><span
          class="sle-flagnote-word">미확인 </span><span class="sle-flagnote-count"></span></span></span>
    <span class="sle-summary sle-view-only"></span>
    <button type="button" class="sle-sheet-toggle sle-floor-only" aria-pressed="false" aria-controls="sle-sheet"
            title="호기 정보 — 고른 호기의 칸과, 칸마다 걸러 찾은 호기 목록을 도면 위 창에 보입니다(필터에 맞는 호기는 도면에서 강조). 호기를 두 번 눌러도 열립니다 · 다시 누르면 닫습니다"><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="1.5" y="2.5" width="13" height="11" rx="1.5" class="ico-line"/><path d="M1.5 6.2h13M6 6.2v7.3" class="ico-line"/></svg><span class="sle-sheet-toggle-word">호기 정보</span></button>
    <button type="button" class="sle-keys-toggle" aria-expanded="false" aria-haspopup="dialog" aria-controls="sle-keys"
            title="이 화면에서 쓸 수 있는 단축키"><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="1.5" y="4" width="13" height="8.5" rx="1.5" class="ico-line"/><path d="M4 6.8h.01M6.7 6.8h.01M9.3 6.8h.01M12 6.8h.01M5.2 9.8h5.6" class="ico-line"/></svg><span class="sle-keys-toggle-word">단축키</span></button>
    <button type="button" class="sle-lock" aria-pressed="false"

    <span class="sle-tiphost sle-apply-host sle-edit-only" aria-describedby="sle-tip"><button type="button" class="sle-apply">적용</button></span>
  </div>
  <div class="sle-body">
    <aside class="sle-side is-left" aria-label="도구 칸">
      <button type="button" class="sle-side-strip" aria-expanded="false"><span class="sle-side-strip-text">도구</span></button>
      <div class="sle-side-box">
        <div class="sle-side-head">
          <span class="sle-side-title">도구</span>
          <button type="button" class="sle-side-fold" aria-label="왼쪽 칸 접기" title="칸 접기">‹</button>
        </div>
        <div class="sle-side-scroll">
          <section class="sle-sec" data-sec="legend">
            <button type="button" class="sle-sec-head" aria-expanded="true">범례</button>
            <div class="sle-sec-body sle-legend"></div>
          </section>
          <section class="sle-sec sle-edit-only" data-sec="palette">
            <button type="button" class="sle-sec-head" aria-expanded="true">도면 요소</button>
            <div class="sle-sec-body sle-palette" role="group" aria-label="도면 요소 넣기">
            <button type="button" data-kind="zone" title="눌러서 넣거나 도면으로 끌어 놓기">
              <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="3" width="12" height="10" rx="1" class="ico-dash"/></svg>영역</button>
            <button type="button" class="sle-floor-only" data-kind="shutter" title="반입구(셔터) — 앞 공간에 호기가 서면 경고">
              <svg viewBox="0 0 16 16" aria-hidden="true"><line x1="1" y1="14" x2="15" y2="14" class="ico-bold"/><line x1="8" y1="12" x2="8" y2="4" class="ico-line"/><polyline points="5,7 8,3 11,7" class="ico-line"/></svg>반입구</button>
            <button type="button" class="sle-floor-only" data-kind="door" title="여닫이문 — 열리는 자리에 호기가 서면 경고">
              <svg viewBox="0 0 16 16" aria-hidden="true"><line x1="3" y1="14" x2="3" y2="3" class="ico-bold"/><path d="M3 3 A11 11 0 0 1 14 14" class="ico-dash"/></svg>문</button>
            <button type="button" class="sle-floor-only" data-kind="column" title="기둥 — 호기가 겹치면 경고">
              <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="4" y="4" width="8" height="8" class="ico-fill"/></svg>기둥</button>
            <button type="button" data-kind="text">
              <svg viewBox="0 0 16 16" aria-hidden="true"><text x="8" y="12.5" text-anchor="middle" class="ico-text">T</text></svg>글자</button>
            <button type="button" data-kind="arrow" title="동선 화살표">
              <svg viewBox="0 0 16 16" aria-hidden="true"><line x1="2" y1="8" x2="12" y2="8" class="ico-dash"/><polyline points="10,5 14,8 10,11" class="ico-line"/></svg>동선</button>
            <button type="button" class="sle-floor-only" data-kind="bay" title="베이 화살표(U자) — 가운데에 「B<번호>」, 머리는 아래 팔 끝에서 왼쪽">
              <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 4.5H10.5A3.5 3.5 0 0 1 10.5 11.5H5.5" class="ico-line"/><polyline points="6.5,9.5 3.5,11.5 6.5,13.5" class="ico-line"/></svg>베이</button>
            <button type="button" class="sle-fab-only" data-kind="block" title="층 블록 — 연결 층(필수)을 가리키고, 보기 화면에서 누르면 그 층이 열립니다">
              <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="3" y="2" width="10" height="5" rx="1" class="ico-line"/><rect x="3" y="9" width="10" height="5" rx="1" class="ico-fill"/></svg>층 블록</button>
            <button type="button" class="sle-shape-toggle" aria-expanded="false" aria-controls="sle-shape-palette"
                    title="도형 — 사각형·원·ㄴ자 박스 등 프리셋 아홉. 펼친 칸에서 눌러서 넣거나 도면으로 끌어 놓습니다">
              <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="1.5" y="2" width="7" height="6" class="ico-line"/><circle cx="10.5" cy="10.5" r="4" class="ico-fill"/></svg>도형 ▾</button>
            <span class="sle-shape-palette" id="sle-shape-palette" role="group" aria-label="도형 넣기 — 눌러서 넣거나 끌어 놓기" hidden></span>
            </div>

                <label class="sle-field"><span>X</span><input type="number" data-field="x" inputmode="decimal"></label>

                <label class="sle-field"><span>폭</span><input type="number" data-field="w" inputmode="decimal"></label>
                <label class="sle-field"><span>높이</span><input type="number" data-field="h" inputmode="decimal"></label>
              </div>
              <span class="sle-inspector-ext">
                <span class="sle-field sle-sendto">
                  <label class="sle-field sle-unit-name"><span>이름</span><input class="sle-unit-label" type="text" maxlength="40" autocomplete="off" spellcheck="false" aria-label="호기 이름"></label>
                  <select class="sle-move-floor" aria-label="보낼 층"></select>
                  <button type="button" class="sle-move" title="모듈 묶음은 함께 갑니다. 놓여 있던 호기는 같은 좌표·크기로 그 층에 섭니다.">다른 층으로 보내기</button>
                  <button type="button" class="sle-module-tile" hidden title="바둑판이 아닌 Main 설비 모듈 묶음을 지금 바깥 상자(범위) 안에 똑같이 나눠 다시 놓습니다 — 옮기거나 크기를 바꿀 때도 이렇게 놓입니다">범위에 맞춰 4등분</button>
                  <label class="sle-field sle-group-name" hidden title="모듈 묶음 범위에 그리는 Main 설비 이름의 자리 — 가운데는 범위 정가운데, 위·아래는 범위 바깥 바로 위·아래. 고르지 않은 묶음은 한 줄(모듈 2·3)이면 위, 그 밖은 가운데에 섭니다"><span>Main 설비명</span><select class="sle-group-label-pos" aria-label="Main 설비명 위치"><option value="center">가운데</option><option value="top">위</option><option value="bottom">아래</option></select></label>
                </span>
                <span class="sle-markprops" hidden>
                  <label class="sle-field sle-mark-name"><span class="sle-mark-name-word">이름</span><span class="sle-bay-prefix" aria-hidden="true" hidden>B</span><input class="sle-mark-label" type="text" maxlength="40" autocomplete="off"></label>
                  <label class="sle-field" title="이름표 글자의 기준 크기 — 도면 1칸이 화면 8px 일 때의 크기입니다. 확대·축소를 따라 0~2배로 바뀌고 화면 6px 아래면 숨깁니다. 자동 — 글자는 상자에 맞추고 나머지는 11"><span>글자 크기</span><select class="sle-mark-font-size" aria-label="글자 크기"></select></label>
                  <label class="sle-field" title="이름표 글자 색. 기본 — 도면 글자색"><span>글자 색</span><select class="sle-mark-font-color" aria-label="글자 색"></select></label>
                  <span class="sle-markprops-kind">
                    <span class="sle-zone-props">
                      <label class="sle-field sle-zone-only"><span>색</span><select class="sle-mark-color"></select></label>
                      <label class="sle-field sle-zone-only" title="영역 테두리 모양 — 고른 영역은 테두리와 따로 바깥 강조 테로 보입니다"><span>테두리</span><select class="sle-mark-border" aria-label="테두리 모양"><option value="dashed">점선</option><option value="solid">실선</option></select></label>

                      <label class="sle-field sle-zone-only"><input class="sle-mark-hatch" type="checkbox"><span>빗금</span></label>
                      <label class="sle-field sle-zone-only sle-floor-only" title="이 영역에 호기가 서면 경고합니다"><input class="sle-mark-keepout" type="checkbox"><span>설비 금지</span></label>
                    </span>
                    <span class="sle-block-props sle-fab-only" hidden>
                      <label class="sle-field"><span>연결</span><select class="sle-block-link" aria-label="연결 층"></select></label>
                      <label class="sle-field"><span>색</span><select class="sle-block-color" aria-label="블록 색"></select></label>
                      <button type="button" class="sle-block-open">열기</button>
                    </span>
                  </span>
                </span>
                <span class="sle-turns" hidden role="group" aria-label="돌리기·뒤집기">

                  <button type="button" class="sle-flip" data-flip="h" aria-keyshortcuts="Shift+H"

                  <button type="button" class="sle-flip" data-flip="v" aria-keyshortcuts="Shift+V"

                </span>
