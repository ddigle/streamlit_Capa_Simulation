<div class="capa-proc-root" lang="ko">
  <div class="capa-proc-head">
    <span class="capa-proc-count" aria-live="polite"></span>
    <input class="capa-proc-search" type="search" placeholder="찾기" aria-label="공정 찾기" autocomplete="off" spellcheck="false">
  </div>
  <div class="capa-proc-actions">
    <button type="button" class="capa-proc-all"><span class="capa-proc-icon" aria-hidden="true">filter_alt_off</span>전체</button>
    <button type="button" class="capa-proc-apply"><span class="capa-proc-icon" aria-hidden="true">check</span>적용</button>
  </div>
  <div class="capa-proc-grid" role="listbox" aria-label="공정"></div>
  <p class="capa-proc-empty" hidden>찾는 공정이 없습니다</p>
</div>
