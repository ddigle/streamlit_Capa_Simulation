<div class="capa-date-root" lang="ko">
  <div class="capa-date-labelrow">
    <span class="capa-date-label"></span>
    <button type="button" class="capa-date-help" hidden>
      <svg class="capa-date-help-mark" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="9"/><path d="M9.6 9.4a2.5 2.5 0 1 1 3.7 2.2c-.8.5-1.3 1-1.3 1.9"/><path d="M12 16.8v.1"/></svg>
    </button>
  </div>
  <div class="capa-date-bubble" popover="manual" role="tooltip"></div>
  <button type="button" class="capa-date-field" aria-haspopup="dialog">
    <svg class="capa-date-field-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="4" y="5.5" width="16" height="14.5" rx="2"/><path d="M4 10h16M8.5 3.5v4M15.5 3.5v4"/></svg>
    <span class="capa-date-field-text"></span>
    <svg class="capa-date-field-mark" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m8 9.5 4-4 4 4M8 14.5l4 4 4-4"/></svg>
  </button>
  <dialog class="capa-date-dialog">
    <div class="capa-date-sheet">
      <div class="capa-date-title">
        <svg class="capa-date-title-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="4" y="5.5" width="16" height="14.5" rx="2"/><path d="M4 10h16M8.5 3.5v4M15.5 3.5v4"/></svg>
        <span class="capa-date-title-text"></span>
        <button type="button" class="capa-date-close" aria-label="닫기">
          <svg class="capa-date-step-mark" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m6.5 6.5 11 11M17.5 6.5l-11 11"/></svg>
        </button>
      </div>
      <div class="capa-date-head">
        <button type="button" class="capa-date-step" data-step="-12" aria-label="이전 해">
          <svg class="capa-date-step-mark" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M11.5 6 5.5 12l6 6M18.5 6l-6 6 6 6"/></svg>
        </button>
        <button type="button" class="capa-date-step" data-step="-1" aria-label="이전 달">
          <svg class="capa-date-step-mark" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M14.5 6 8.5 12l6 6"/></svg>
        </button>
        <span class="capa-date-year" aria-live="polite"></span>
        <button type="button" class="capa-date-step" data-step="1" aria-label="다음 달">
          <svg class="capa-date-step-mark" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m9.5 6 6 6-6 6"/></svg>
        </button>
        <button type="button" class="capa-date-step" data-step="12" aria-label="다음 해">
          <svg class="capa-date-step-mark" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m5.5 6 6 6-6 6M12.5 6l6 6-6 6"/></svg>
        </button>
      </div>
      <div class="capa-date-weekdays" aria-hidden="true">
        <span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span>
      </div>
      <div class="capa-date-days" role="group" aria-label="날"></div>
      <div class="capa-date-quick" data-mode="range" role="group" aria-label="빠른 선택">
        <span class="capa-date-quick-name" aria-hidden="true">오늘부터</span>
        <button type="button" class="capa-date-chip" data-quick="ahead" data-length="4" aria-label="오늘부터 4주">4주</button>
        <button type="button" class="capa-date-chip" data-quick="ahead" data-length="12" aria-label="오늘부터 12주">12주</button>
        <button type="button" class="capa-date-chip" data-quick="ahead" data-length="26" aria-label="오늘부터 26주">26주</button>
        <span class="capa-date-quick-name" aria-hidden="true">오늘까지</span>
        <button type="button" class="capa-date-chip" data-quick="back" data-length="4" aria-label="오늘까지 4주">4주</button>
        <button type="button" class="capa-date-chip" data-quick="back" data-length="12" aria-label="오늘까지 12주">12주</button>
        <button type="button" class="capa-date-chip" data-quick="month">이번 달</button>
        <button type="button" class="capa-date-chip" data-quick="all">전체</button>
        <button type="button" class="capa-date-chip" data-quick="clear">비움</button>
      </div>
      <div class="capa-date-quick" data-mode="single" role="group" aria-label="빠른 선택">
        <button type="button" class="capa-date-chip" data-quick="today">오늘</button>
        <button type="button" class="capa-date-chip" data-quick="yesterday">어제</button>
        <button type="button" class="capa-date-chip" data-quick="month_first">이번 달 1일</button>
        <button type="button" class="capa-date-chip" data-quick="next_month_first">다음 달 1일</button>
        <button type="button" class="capa-date-chip" data-quick="clear">비움</button>
      </div>
      <div class="capa-date-foot">
        <div class="capa-date-draft" aria-live="polite">
          <span class="capa-date-draft-range"></span>
          <span class="capa-date-draft-now"></span>
        </div>
        <button type="button" class="capa-date-apply">적용</button>
      </div>
    </div>
  </dialog>
</div>
