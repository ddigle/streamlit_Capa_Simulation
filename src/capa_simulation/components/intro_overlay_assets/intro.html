<div class="stage" role="dialog" aria-modal="true" aria-labelledby="capa-intro-title">
  <div class="intro-bg"></div>
  <div class="entry">
    <canvas class="map" aria-hidden="true"></canvas>
    <div class="veil" aria-hidden="true"></div>
    <header class="head"><span class="logo" data-slot="logo"></span><span class="brand" data-slot="brand"></span></header>
    <section class="main">
      <h1 class="title" id="capa-intro-title" data-slot="title"></h1>
      <div class="gap" aria-hidden="true"></div>
      <div class="load">
        <ol class="steps" data-slot="steps"></ol>
        <p class="status" role="status" aria-live="polite"></p>
      </div>
      <button type="button" class="enter" disabled><span class="spin" aria-hidden="true"></span><span class="txt"></span></button>
      <p class="hint" hidden></p>
    </section>
  </div>
  <div class="intro" aria-hidden="true">
    <div class="mark"><span class="symbol" data-slot="symbol"></span><div class="word" data-slot="word"></div></div>
  </div>
</div>
