    dur = dur == null ? .25 : dur;
    const prev = c.cur;
    if (!prev) {
      if (dur > 0) {
        tl.set(c.el, { width: c.widths[s] }, t);
        tl.fromTo(c.el, { opacity: 0, y: -6 }, { opacity: 1, y: 0, duration: dur, ease: E().out, immediateRender: false }, t);
        tl.fromTo(c.layers[s], { opacity: 0 }, { opacity: 1, duration: dur, immediateRender: false }, t);
      } else {
        tl.set(c.el, { opacity: 1, y: 0, width: c.widths[s] }, t);
        tl.set(c.layers[s], { opacity: 1 }, t);
      }
    } else if (prev !== s) {
      go(tl, c.layers[prev], { opacity: 0 }, t, dur * .6);
      go(tl, c.layers[s], { opacity: 1 }, t + (dur > 0 ? dur * .3 : 0), dur * .7);
      go(tl, c.el, { width: c.widths[s] }, t, dur, E().out);
    }
    if (s === "공식버전" && dur > 0) {
      const acc = tokv("--accent");
      tl.to(c.el, { borderColor: acc, boxShadow: "0 0 0 5px rgba(95,184,172,.22)", duration: .15 }, t + dur * .4);
      tl.to(c.el, { borderColor: tokv("--built-line"), boxShadow: "0 0 0 0px rgba(95,184,172,0)", duration: .5, ease: "power1.out" }, t + dur * .4 + .3);
    }
    c.cur = s;
  }

  // ---------------------------------------------------------------- 버전이 바뀐다(r1 → r2) — 바뀐 칸과 그 달 막대만
  function setRev(tl, lob, rev, t, pace) {
    pace = pace == null ? 1 : pace;
    const from = lob.st.rev;
    if (from === rev) return t;
    const d = lob.drawer;
    const i = d ? d.i : thread(lob.D).i;
    const k = (x) => t + x * pace;
    // 서랍의 바뀐 칸 — 판정색이 바뀐다(색은 실제 값으로 트윈)
    if (d) {
      const c0 = monthCells(lob, i, from), c1 = monthCells(lob, i, rev);
      c1.forEach((c, r) => {
        if (c.judge === c0[r].judge) return;
        const a = tokv(JUDGE_TOK[c0[r].judge] || "--die-idle"), b = tokv(JUDGE_TOK[c.judge] || "--die-idle");
        if (pace > 0) tl.fromTo(d.cells[r], { backgroundColor: a }, { backgroundColor: b, duration: .3, ease: "power1.inOut", immediateRender: false }, k(0));
        else tl.set(d.cells[r], { backgroundColor: b }, k(0));
      });
      // 괄호가 건너뛴다
      if (d.bracketOn) {
        go(tl, d.brk[from], { opacity: 0 }, k(.3), pace > 0 ? .12 : 0);
        if (pace > 0) tl.fromTo(d.brk[rev], { opacity: 1, drawSVG: "0%" }, { opacity: 1, drawSVG: "100%", duration: .2, ease: "power1.out", immediateRender: false }, k(.36));
        else tl.set(d.brk[rev], { opacity: 1, drawSVG: "100%" }, k(.36));
      }
    }
    // 그 달 막대 — 색 · 높이(body 좌표)
    const bar = lob.bars[i];
    const b0 = (from === "r1" ? lob.bnR1 : lob.bnR2)[i] || {}, b1 = (rev === "r1" ? lob.bnR1 : lob.bnR2)[i] || {};
    if (bar) {
      const h0 = barH(b0.rate), h1 = barH(b1.rate);
      const STOK = { secure: "--ok", warning: "--warn", shortage: "--short" };
      const v0 = { top: Y.base - h0, height: h0, backgroundColor: tokv(STOK[b0.status] || "--die-idle") };
      const v1 = { top: Y.base - h1, height: h1, backgroundColor: tokv(STOK[b1.status] || "--die-idle") };
      if (pace > 0) tl.fromTo(bar.el, v0, Object.assign({ duration: .35, ease: "power2.inOut", immediateRender: false }, v1), k(.45));
      else tl.set(bar.el, v1, k(.45));
      bar.b = b1; bar.status = b1.status;
      bar.rect = { x: bar.rect.x, y: Y.base - h1, w: bar.rect.w, h: h1 };
    }
    // body 의 「최저」 ↔ 「부족 N대」 — 줄어 있으면(글자 걷힘) 보이지 않는 채로 바뀐 것만 적어 둔다
    lob.st.rev = rev;
    if (lob.st.pos.s >= .999) {
      const on = textsOn(lob);
      [lob.short, lob.lowest].filter(Boolean).forEach((e) => go(tl, e, { opacity: on.indexOf(e) >= 0 ? 1 : 0 }, k(.6), pace > 0 ? .3 : 0));
    }
    // 겹의 「부족 N대」 — 「12월」 밑
    if (d && (b1.short || 0) > 0) {
      if (pace > 0) tl.fromTo(d.stag, { opacity: 0, y: -6 }, { opacity: 1, y: 0, duration: .3, ease: E().out, immediateRender: false }, k(.75));
      else tl.set(d.stag, { opacity: 1, y: 0 }, k(.75));
    }
    return k(1.05);
  }

  // ---------------------------------------------------------------- 잉크 고리
  function ring(tl, lob, target, t, dur) {
    dur = dur == null ? .3 : dur;
    let r = target;
    if (target === "cell" && lob.drawer) r = lob.drawer.cellRect(lob.drawer.thread);
    if (target === "bar") {
      const i = lob.drawer ? lob.drawer.i : thread(lob.D).i;
      r = barRect(lob, i, lob.st.rev);
    }
    if (!r || r.x == null) return;
    if (!lob.ringO) {
      lob.ringO = Parts.Ring(lob.ctx, r, { pad: 5, parent: lob.ov });
      tl.set(lob.ringO.el, { autoAlpha: 0 }, 0);
      if (dur > 0) lob.ringO.draw(tl, t, dur);
      else tl.set(lob.ringO.el, { autoAlpha: 1, scale: 1 }, t);
      return lob.ringO;
    }
    if (dur > 0) lob.ringO.to(tl, r, t, dur);
    else { const pd = lob.ringO.pad; tl.set(lob.ringO.el, { left: r.x - pd, top: r.y - pd, width: r.w + pd * 2, height: r.h + pd * 2 }, t); }
    return lob.ringO;
  }

  // ---------------------------------------------------------------- 미니 카드 — 막대만 남긴다
  function mini(tl, lob, t, dur) {
    dur = dur == null ? .25 : dur;
    const out = texts(lob).concat(shapes(lob));
    if (lob.chip) out.push(lob.chip.el);
    if (lob.ringO) out.push(lob.ringO.el);
    if (lob.drawer) out.push(lob.drawer.mtag, lob.drawer.stag);
    go(tl, out, { opacity: 0 }, t, dur);
    go(tl, lob.bars.map((b) => b.el), { opacity: 1 }, t, dur);
    lob.st.mini = true;
  }
  function miniHead(tl, lob, t, dur) {
    dur = dur == null ? .3 : dur;
    if (dur > 0) {
      tl.fromTo(lob.mtag, { opacity: 0, y: -4 }, { opacity: 1, y: 0, duration: dur, ease: E().out, immediateRender: false }, t);
      tl.fromTo(lob.heads, { opacity: 0, scale: .6 }, { opacity: 1, scale: 1, duration: dur, stagger: .06, ease: E().out, immediateRender: false }, t + .05);
    } else tl.set([lob.mtag].concat(lob.heads), { opacity: 1, y: 0, scale: 1 }, t);
  }

  // ---------------------------------------------------------------- 앞 장면 끝과 같은 모양을 바로(시간 t)
  //   "s4"     = S4 끝: 가운데 열 · r2 · 공식 칩 · 서랍 열림(이야기의 줄 · 괄호 · 「12월」 · 「부족 N대」) · 고리는 그 칸
  //   "s5mini" = S5 끝: 미니(막대만) · 머리 · 테두리 강조(아래 레인의 다섯째 칸으로 켜진 채) · 소요대수 머리 강조(CAMP 대조)
  function state(tl, lob, name, t) {
    t = t || 0;
    const th = thread(lob.D);
    if (name === "s4") {
      move(tl, lob, "s4", t, 0);
      if (lob.st.rev !== "r2") setRev(tl, lob, "r2", t, 0);
      chip(lob.ctx, lob);
      setChip(tl, lob, "공식버전", t, 0);
      focusMonth(tl, lob, th.i, t, 0);
      openMonth(tl, lob, th.i, t, { dur: 0 });
      bracket(tl, lob, t, 0);
      monthTag(tl, lob, t, 0);
      tl.set(lob.drawer.stag, { opacity: 1 }, t);
      ring(tl, lob, "cell", t, 0);
    } else if (name === "s5mini") {
      move(tl, lob, "s5mini", t, 0);
      mini(tl, lob, t, 0);
      miniHead(tl, lob, t, 0);
      tl.set(lob.frame, { borderColor: tokv("--accent") }, t);
      if (lob.heads[0]) tl.set(lob.heads[0], { borderColor: tokv("--accent") }, t);   // CAMP 와 대조한 소요대수 머리(S5 b2)
    }
  }

  window.LOB = {
    box, PITCH, colX, LABEL_X, Y, GRID, cellRect, rowY, STATUS, JUDGE, POS, DRAWER, HEAD,
    rectAt, at, thread,
    draw, stand, reveal, move, focusMonth, openMonth, bracket, monthTag, closeMonth, chip, setChip, setRev, ring, mini, miniHead, state,
  };
})();

</script>
<script>
// 긴 명단 — CAMP 가 주던 「기준값과 결과가 한 줄에 섞여 줄마다 되풀이되는 명단」(window.LONG).
// 개선 전 S1 b0(CAMP 판 안 작은 그림) · S5 위 띠(그 복제) 와 개선 후 S3 b2~b3(크게 세운 명단 → 칸별 세로 띠 → 16종 기준정보 표)가
// 같은 물체로 읽히게 한 곳에서 그린다(연출 문법 5). 칸 차례 · 칸 폭 비율 · 막대 길이 규칙이 작은 그림과 큰 명단에서 같다.
// 값은 sample_world.json 「long_list」 한 곳에서만 읽는다(합성). 색은 :root 토큰만 — 명단은 입력이라 무채색이다(강조색을 쓰지 않는다).
// 글자는 22px 아래로 쓰지 않는다. tl.call · 무작위 · 시계를 쓰지 않는다(되감기 · 인쇄 · 점프 안전). fromTo 는 from 의 속성을 to 에도 둔다.
//
// ── API(window.LONG) ─────────────────────────────────────────────────────────────────────────────────────────────
//   LONG.data(src) → long_list                     src = ctx 또는 SAMPLE. { cols[], rows[], fold{}, split, tables16[] } (없으면 빈 명단 + 경고 한 번)
//   LONG.fmt(col, v) → 글자                        숫자는 col.dp 자리(90 → "90.00"), 글자는 그대로
//   LONG.tables16(src) → [{name, rq, edit, stage, app}] ×16   앞 여섯(stage)이 S3 타일 이름 — 생산계획 · 수율 · UPEH · 효율 · 여유율 · 설비대수
//   LONG.glyphSvg(src, {rows?, rep?, chrome?}) → svg 문자열(viewBox 168×112)
//        S1 · S5 의 G_CAMP 자리에 그대로 넣는다(지금 G_CAMP 와 같은 틀 · 같은 비율). 막대뿐이고 글자는 없다.
//        rows = 보일 원천 줄 번호(기본 [0,1,2,3,7,8,9] — Pre B/D 넷 + Mold 셋), rep = 밝게 둘 칸 key(기본 없음 — 전부 회색), chrome = 창 머리(기본 true)
//   LONG.glyph(ctx, {x, y, w=168, h=112, parent?, rows?, rep?, chrome?}) → div(svg 를 든 상자 — 위 그림을 무대에 바로 세울 때)
//   LONG.list(ctx, {x, y, w=1080, rowH=40, headH=46, chrome=true, chromeH=36, rows?, text?, parent?}) → L   큰 명단(DOM)
//        rows = 보일 원천 줄 번호(기본 전부 12), text = 글자로 쓸 칸 key(기본 show 가 false 가 아닌 칸 — Pack · 여유율은 막대)
//        L = { el(감싸개 · 무대 좌표 x,y,w,h), frame(틀 — 처음엔 작은 그림 결 --muted 2px), chrome, lines:{head, rows[]}, rect,
//              cols[{key, head, kind, table, dp, x, w, band, hc(머리 칸), cells[](보이는 줄 차례)}],
//              col(key) · band(key) → 띠 div(머리 칸 + 그 칸의 모든 줄 — 통째로 옮기면 「세로 띠」) · cells(key) → [칸 el]
//              row(i) → [그 줄의 칸 el(칸 차례)] · cell(i, key) → el · slot(i) → 보이는 자리(없으면 −1) · rowY(k) → k 번째 자리 위 끝(감싸개 안)
//              bandRect(key) · cellRect(i, key) → 무대 좌표 사각형, data, split{table, key, values, rows[][], cells[][]} }
//        띠는 감싸개 안의 절대 자리라 띠마다 x · y · scale 을 따로 트윈해도 된다. 줄 선(lines)은 띠 밖에 있어 띠가 갈라질 때 따로 걷는다.
//   LONG.fold(src, key) → [{키, 값, rows[]}]        그 칸(수율 · UPEH · 효율 · 여유율)을 표로 접은 결과. rows[0] 이 남는 줄
//   LONG.foldBand(tl, L, key, at, {dur=.45, pack=.4, stagger=.03}) → {end, keep[{group, i, el, slot}], gone[el]}
//        그 띠 안에서 같은 키 · 같은 값의 줄이 남는 줄 위로 겹쳐 사라지고(dur), 남은 줄이 위에서부터 차곡차곡 붙는다(pack). 움직임마다 1.2초 아래
//   LONG.pulse(tl, L, key, at, {value?, stagger=.08, dur=.5, mark=false, markDur=.22}) → 끝 시각
//        그 칸에서 값이 같은 칸이 위에서부터 차례로 밝아졌다 돌아온다(기본 값 = 보이는 첫 줄의 값 — 효율이면 90.00). 색은 --muted ↔ --text
//        mark: true(10-18 P01 — S3 b2) = 켜진 칸이 꺼지지 않고 쌓인다. 칸마다 옅은 바탕 rgba(236,236,239,.10) + 2px --text 왼쪽 선(.ll-mk)이
//        stagger 간격 · markDur 길이로 서고, 글자도 --text 로 남는다(돌아오지 않는다). 강조색은 쓰지 않는다 — 명단은 입력이다.
//        이때 끝 시각 = 마지막 칸이 다 켜진 때(at + (n−1)·stagger + markDur). 걷기는 LONG.unmark 로(장면이 정한 때에).
//   LONG.unmark(tl, L, at, {dur=.3}) → 끝 시각      pulse(mark) 로 쌓인 표시를 함께 걷는다(바탕 · 선 → 0, 글자 --text → --muted). 표시가 없으면 at
//   LONG.marks(L) → [{cell, mk}]                    pulse(mark) 가 단 표시(장면이 따로 다룰 때)
//
// 예:
//   const G_CAMP = LONG.glyphSvg(ctx);                                    // S1 · S5 — 지금 G_CAMP 상수를 이것으로
//   const L = LONG.list(ctx, { x: 420, y: 300, w: 1080 });                // S3 b2 — 시간 0 에 tl.set(L.el, {autoAlpha: 0}, 0) 등으로 숨겨 두고 들인다
//   const tEnd = LONG.pulse(tl, L, "효율", T1 + .4);                        // 90.00 이 줄마다 차례로 빛난다
//   tl.to(L.lines.rows.concat([L.lines.head]), { opacity: 0, duration: .25 }, tEnd);   // 줄 선을 걷고
//   const f = LONG.foldBand(tl, L, "효율", tEnd + .3);                       // 12줄 → 2줄
//   tl.to(L.band("효율"), { x: 300, y: -40, duration: .8 }, f.end + .25);     // 접힌 상태가 한 박자 선 뒤 띠가 날아간다(장면이 자리를 정한다)
(function () {
  "use strict";

  // ---------------------------------------------------------------- 서식(ll- 접두, 색은 :root 토큰만)
  const CSS = [
    // 작은 그림(svg) — 장면 서식(.s01-glyph .bar 등)에 기대지 않는다. engine.css 의 .bar(DOM 막대 · height 14px)가 svg rect 높이를 덮지 않게 다른 이름을 쓴다.
    "svg.ll{overflow:visible}",
    "svg.ll .ll-ln{fill:none;stroke:var(--muted);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}",
    "svg.ll .ll-hr{fill:none;stroke:var(--line);stroke-width:1}",
    "svg.ll .ll-b{fill:var(--track)}",
    "svg.ll .ll-h{fill:var(--line)}",
    "svg.ll .ll-r{fill:var(--faint)}",
    ".ll-gl{position:absolute;pointer-events:none}",
    ".ll-gl svg{display:block;width:100%;height:100%}",
    // 큰 명단(DOM)
    ".ll-wrap{position:absolute;pointer-events:none}",
    // 틀 · 창 머리는 작은 그림(svg.ll — .ll-ln 2px --muted · 큰 점 셋)과 같은 결로 들어온다. 장면이 갈라지기 직전 borderColor 를 --panel-line 으로 낮춘다(S3).
    ".ll-frame{position:absolute;left:0;top:0;right:0;bottom:0;border:2px solid var(--muted);border-radius:12px;background:rgba(236,236,239,.025)}",
    ".ll-chrome{position:absolute;left:0;right:0;top:0;border-bottom:2px solid var(--muted)}",
    ".ll-chrome i{position:absolute;top:50%;width:15px;height:15px;margin-top:-7.5px;border-radius:50%;background:var(--line)}",
    ".ll-hl,.ll-rl{position:absolute;height:1px}",
    ".ll-hl{background:var(--line)}",
    ".ll-rl{background:rgba(236,236,239,.07)}",
    ".ll-band{position:absolute;top:0}",
    ".ll-hc,.ll-c{position:absolute;left:0;right:0;white-space:nowrap}",
    ".ll-hc{font-size:22px;font-weight:700;color:var(--muted)}",
    ".ll-c{font-size:24px;color:var(--muted)}",
    ".ll-c.n{font-family:var(--num);font-weight:500;font-variant-numeric:tabular-nums}",
    ".ll-hc .bar,.ll-c .bar{position:absolute;left:0;top:50%;margin-top:-7px}",
    // 되풀이 표시(pulse 의 mark — S3 b2). 칸 글자 밑(z −1 · 칸이 isolation 으로 층을 가둔다), 글자 앞 8px 에 왼쪽 선. 무채색만.
    // 위아래 2px 만 띄운다 — 줄 사이가 넓으면 일곱 칸의 왼쪽 선이 점선(= 다음 단계 문법)처럼 읽힌다.
    ".ll-mk{position:absolute;left:-10px;right:-2px;top:2px;bottom:2px;z-index:-1;border-radius:0 4px 4px 0;" +
      "background:rgba(236,236,239,.10);border-left:2px solid var(--text);opacity:0;pointer-events:none}",
  ].join("\n");
  (function inject() {
    if (document.getElementById("ll-css")) return;
    const s = document.createElement("style");
    s.id = "ll-css";
    s.textContent = CSS;
    document.head.appendChild(s);
  })();

  // ---------------------------------------------------------------- 데이터
  const EMPTY = { cols: [], rows: [], fold: {}, split: null, tables16: [] };
  let warned = false;
  function data(src) {
    const D = src && src.D ? src.D : (src || window.SAMPLE || {});
    const ll = D.long_list;
    if (ll && Array.isArray(ll.cols) && Array.isArray(ll.rows)) return ll;
    if (!warned) {
      warned = true;
      console.warn("LONG: SAMPLE.long_list 가 없다 — build/build.py 로 src/sample_world.js 를 다시 만든다(지금은 빈 명단)");
    }
    return EMPTY;
  }
  function fmt(col, v) {
    if (typeof v === "number") return col && col.dp != null ? v.toFixed(col.dp) : String(v);
    return v == null ? "" : String(v);
  }
  const tables16 = (src) => (data(src).tables16 || []).slice();
  function foldOf(ll, key) {
    const c = ll.cols.find((k) => k.key === key);
    const f = ll.fold && ll.fold[c && c.table ? c.table : key];
    return f ? f.groups : [];
  }
  const fold = (src, key) => foldOf(data(src), key);

  // ---------------------------------------------------------------- 칸 자리 — 작은 그림과 큰 명단이 같은 비율(cols[].w)을 쓴다
  function layout(cols, x0, innerW, gap) {
    const sum = cols.reduce((a, c) => a + (c.w || 1), 0) || 1;
    const free = innerW - gap * Math.max(0, cols.length - 1);
    let x = x0;
    return cols.map((c) => {
      const w = free * (c.w || 1) / sum;
      const r = { x, w };
      x += w + gap;
      return r;
    });
  }
  // 막대 길이(칸 폭에 대한 비) — 같은 값이면 같은 길이(되풀이가 모양으로 읽힌다). 숫자는 칸 안 범위로, 글자는 글자로 정한 고정 값.
  function fracs(ll) {
    const out = {};
    ll.cols.forEach((c) => {
      const vs = ll.rows.map((r) => r[c.key]);
      const nums = vs.filter((v) => typeof v === "number");
      const lo = Math.min.apply(null, nums), hi = Math.max.apply(null, nums);
      out[c.key] = (v) => {
        if (typeof v === "number") return hi > lo ? .5 + .45 * (v - lo) / (hi - lo) : .78;
        const s = String(v == null ? "" : v);
        let h = 0;
        for (let k = 0; k < s.length; k++) h = (h * 31 + s.charCodeAt(k)) % 997;
        return .52 + (h % 41) / 100;
      };
    });
    return out;
  }

  // ---------------------------------------------------------------- 작은 그림(svg 문자열) — S1 · S5 의 CAMP 판 안
  // 틀은 지금 G_CAMP 와 같다: 테두리(1,1,166,110 · rx10) + 창 머리 줄(y28)과 점 셋. 그 아래 칸 머리 막대 한 줄 + 가는 선 + 원천 줄 막대들.
  const GV = { w: 168, h: 112, pad: 10, gap: 3, headY: 33, headH: 5, hr: 43.5, rowY: 49, pitch: 8.5, barH: 4.5 };
  const DEF_ROWS = [0, 1, 2, 3, 7, 8, 9];
  function glyphSvg(src, o) {
    o = o || {};
    const ll = data(src);
    const chrome = o.chrome !== false;
    const rows = (o.rows || DEF_ROWS).filter((i) => ll.rows[i]);
    const L = layout(ll.cols, GV.pad, GV.w - GV.pad * 2, GV.gap);
    const F = fracs(ll);
    const r1 = (v) => Math.round(v * 10) / 10;
    let s = "<svg class=\"ll\" viewBox=\"0 0 " + GV.w + " " + GV.h + "\">";
    s += "<rect class=\"ll-ln\" x=\"1\" y=\"1\" width=\"166\" height=\"110\" rx=\"10\"/>";
    const top = chrome ? 0 : -10;
    if (chrome) {
      s += "<path class=\"ll-ln\" d=\"M1 28H167\"/>";
      [16, 30, 44].forEach((x) => { s += "<circle class=\"ll-b\" cx=\"" + x + "\" cy=\"14.5\" r=\"4\"/>"; });
    }
    // 칸 머리 — 이름이 있는 칸(여섯)은 조금 밝게, 나머지는 회색
    ll.cols.forEach((c, k) => {
      const w = L[k].w * (c.head ? .82 : .55);
      s += "<rect class=\"" + (c.head ? "ll-h" : "ll-b") + "\" x=\"" + r1(L[k].x) + "\" y=\"" + r1(GV.headY + top) + "\" width=\"" + r1(w) +
        "\" height=\"" + GV.headH + "\" rx=\"" + GV.headH / 2 + "\"/>";
    });
    s += "<path class=\"ll-hr\" d=\"M1 " + (GV.hr + top) + "H167\"/>";
    rows.forEach((i, n) => {
      const y = GV.rowY + top + n * GV.pitch;
      ll.cols.forEach((c, k) => {
        const w = Math.max(3, L[k].w * F[c.key](ll.rows[i][c.key]));
        s += "<rect class=\"" + (o.rep === c.key ? "ll-r" : "ll-b") + "\" x=\"" + r1(L[k].x) + "\" y=\"" + r1(y) + "\" width=\"" + r1(w) +
          "\" height=\"" + GV.barH + "\" rx=\"" + GV.barH / 2 + "\"/>";
      });
    });
    return s + "</svg>";
  }
  function glyph(ctx, o) {
    o = o || {};
    const el = ctx.el("div", "ll-gl", glyphSvg(ctx, o), o.parent);
    el.style.left = o.x + "px";
    el.style.top = o.y + "px";
    el.style.width = (o.w || GV.w) + "px";
    el.style.height = (o.h || GV.h) + "px";
    return el;
  }

  // ---------------------------------------------------------------- 큰 명단(DOM) — S3 b2
  function list(ctx, o) {
    o = o || {};
    const ll = data(ctx);
    const W = o.w || 1080, rowH = o.rowH || 40, headH = o.headH || 46;
    const chromeH = o.chrome === false ? 0 : (o.chromeH || 36);
    const rows = (o.rows || ll.rows.map((_, i) => i)).filter((i) => ll.rows[i]);
    const H = chromeH + headH + rows.length * rowH + 6;
    const PAD = 24, GAP = 16;
    const text = o.text || ll.cols.filter((c) => c.show !== false).map((c) => c.key);
    const el = ctx.el("div", "ll-wrap", null, o.parent);
    el.style.left = o.x + "px"; el.style.top = o.y + "px"; el.style.width = W + "px"; el.style.height = H + "px";
    const frame = ctx.el("div", "ll-frame", null, el);
    let chrome = null;
    if (chromeH) {
      chrome = ctx.el("div", "ll-chrome", null, el);
      chrome.style.height = chromeH + "px";
      [24, 48, 72].forEach((x) => { ctx.el("i", null, null, chrome).style.left = (x - 7.5) + "px"; });   // 점 가운데 — 지름 15
    }
    const y0 = chromeH + headH;                                    // 첫 줄 위 끝(감싸개 안)
    const rowY = (k) => y0 + k * rowH;
    const head = ctx.el("div", "ll-hl", null, el);
    head.style.left = "0px"; head.style.width = W + "px"; head.style.top = (y0 - 1) + "px";
    const rowLines = rows.slice(1).map((_, k) => {
      const l = ctx.el("div", "ll-rl", null, el);
      l.style.left = PAD / 2 + "px"; l.style.width = (W - PAD) + "px"; l.style.top = rowY(k + 1) + "px";
      return l;
    });
    const LA = layout(ll.cols, PAD, W - PAD * 2, GAP);
    const F = fracs(ll);
    const slotOf = {};
    rows.forEach((i, k) => { slotOf[i] = k; });
    const cols = ll.cols.map((c, k) => {
      const band = ctx.el("div", "ll-band", null, el);
      band.style.left = LA[k].x + "px"; band.style.width = LA[k].w + "px"; band.style.height = H + "px";
      const hc = ctx.el("div", "ll-hc", c.head ? c.head : "<span class=\"bar\"></span>", band);
      hc.style.top = chromeH + "px"; hc.style.height = headH + "px"; hc.style.lineHeight = headH + "px";
      if (!c.head) hc.firstChild.style.width = Math.round(LA[k].w * .55) + "px";
      const asText = text.indexOf(c.key) >= 0;
      const cells = rows.map((i, n) => {
        const v = ll.rows[i][c.key];
        const isNum = typeof v === "number";
        const ce = ctx.el("div", "ll-c" + (isNum ? " n" : ""), asText ? fmt(c, v) : "<span class=\"bar\"></span>", band);
        ce.style.top = rowY(n) + "px"; ce.style.height = rowH + "px"; ce.style.lineHeight = rowH + "px";
        if (!asText) ce.firstChild.style.width = Math.max(14, Math.round(LA[k].w * F[c.key](v))) + "px";
        ce.dataset.row = i;
        return ce;
      });
      return { key: c.key, head: c.head, kind: c.kind, table: c.table || null, dp: c.dp, x: LA[k].x, w: LA[k].w, band, hc, cells };
    });
    const byKey = {};
    cols.forEach((c) => { byKey[c.key] = c; });
    const rect = { x: o.x, y: o.y, w: W, h: H };
    const api = {
      el, frame, chrome, lines: { head, rows: rowLines }, rect, cols, data: ll, rowH, headH, chromeH,
      col: (key) => byKey[key],
      band: (key) => byKey[key] && byKey[key].band,
      cells: (key) => (byKey[key] ? byKey[key].cells.slice() : []),
      slot: (i) => (i in slotOf ? slotOf[i] : -1),
      row: (i) => (i in slotOf ? cols.map((c) => c.cells[slotOf[i]]) : []),
      cell: (i, key) => (i in slotOf && byKey[key] ? byKey[key].cells[slotOf[i]] : null),
      rowY,
      bandRect: (key) => { const c = byKey[key]; return c ? { x: o.x + c.x, y: o.y, w: c.w, h: H } : null; },
      cellRect: (i, key) => {
        const c = byKey[key];
        if (!c || !(i in slotOf)) return null;
        return { x: o.x + c.x, y: o.y + rowY(slotOf[i]), w: c.w, h: rowH };
      },
    };
    const sp = ll.split;
    api.split = sp ? {
      table: sp.table, key: sp["키"], values: sp["값"], rows: sp.rows,
      cells: sp.rows.map((rs) => rs.map((i) => api.cell(i, colKeyOf(ll, sp.table))).filter(Boolean)),
    } : null;
    return api;
  }
  const colKeyOf = (ll, table) => { const c = ll.cols.find((k) => k.table === table); return c ? c.key : table; };

  // ---------------------------------------------------------------- 접힘 — 같은 키 · 같은 값의 줄이 남는 줄로 겹치고, 남은 줄이 위로 붙는다
  function foldBand(tl, L, key, at, o) {
    o = o || {};
    const dur = o.dur == null ? .45 : o.dur, pack = o.pack == null ? .4 : o.pack, st = o.stagger == null ? .03 : o.stagger;
    const c = L.col(key);
    const groups = foldOf(L.data, key);
    const keep = [], gone = [];
    if (!c || !groups.length) return { end: at, keep, gone };
    let slot = 0, n = 0;
    groups.forEach((g, gi) => {
      const vis = g.rows.filter((i) => L.slot(i) >= 0);
      if (!vis.length) return;
      const i0 = vis[0], k0 = L.slot(i0), el0 = c.cells[k0];
      vis.slice(1).forEach((i) => {
        const k = L.slot(i), e = c.cells[k];
        const dy = L.rowY(k0) - L.rowY(k);
        tl.fromTo(e, { y: 0, opacity: 1 }, { y: dy, opacity: 0, duration: dur, ease: "power2.inOut", immediateRender: false }, at + n * st);
        gone.push(e);
        n++;
      });
      keep.push({ group: gi, i: i0, el: el0, slot });
      slot++;
    });
    const tp = at + dur + Math.max(0, n - 1) * st + .05;
    keep.forEach((kp) => {
      const dy = L.rowY(kp.slot) - L.rowY(L.slot(kp.i));
      if (dy) tl.fromTo(kp.el, { y: 0 }, { y: dy, duration: pack, ease: "power2.out", immediateRender: false }, tp);
    });
    return { end: tp + pack, keep, gone };
  }

  // ---------------------------------------------------------------- 되풀이 — 같은 값의 칸이 위에서부터 차례로 밝아졌다 돌아온다
  function pulse(tl, L, key, at, o) {
    o = o || {};
    const c = L.col(key);
    if (!c || !c.cells.length) return at;
    const st = o.stagger == null ? .08 : o.stagger, dur = o.dur == null ? .5 : o.dur;
    const ink = getComputedStyle(document.documentElement).getPropertyValue("--text").trim();
    const mut = getComputedStyle(document.documentElement).getPropertyValue("--muted").trim();
    const val = o.value != null ? o.value : L.data.rows[+c.cells[0].dataset.row][key];
    const hit = c.cells.filter((e) => L.data.rows[+e.dataset.row][key] === val);
    if (o.mark) {
      // 쌓기(P01): 칸이 켜진 채 남아 「같은 값이 줄마다 되풀이」가 한 장면으로 선다. 표시 요소는 짓는 때(시간 0 전)에 만들고 처음엔 보이지 않는다(CSS opacity 0).
      const md = o.markDur == null ? .22 : o.markDur;
      const ms = marksOf(L);
      hit.forEach((e, k) => {
        let mk = e.querySelector(":scope > .ll-mk");
        if (!mk) {
          mk = document.createElement("span");
          mk.className = "ll-mk";
          e.insertBefore(mk, e.firstChild);
          e.style.isolation = "isolate";                         // 표시(z −1)가 칸 글자 밑 · 판 바탕 위에 머물게 칸 안에 층을 가둔다
          ms.push({ cell: e, mk });
        }
        const t = at + k * st;
        tl.fromTo(mk, { opacity: 0 }, { opacity: 1, duration: md, ease: "power1.out", immediateRender: false }, t);
        tl.fromTo(e, { color: mut }, { color: ink, duration: md, ease: "power1.out", immediateRender: false }, t);
      });
      return at + Math.max(0, hit.length - 1) * st + md;
    }
    hit.forEach((e, k) => {
      const t = at + k * st;
      tl.fromTo(e, { color: mut }, { color: ink, duration: dur * .4, ease: "power1.out", immediateRender: false }, t);
      tl.fromTo(e, { color: ink }, { color: mut, duration: dur * .6, ease: "power1.in", immediateRender: false }, t + dur * .4);
    });
    return at + Math.max(0, hit.length - 1) * st + dur;
  }
  // pulse(mark) 가 단 표시 목록 — 명단(L)마다 따로. L 에 속성을 더하지 않으려고 WeakMap 에 둔다.
  const MARKS = new WeakMap();
  function marksOf(L) { let a = MARKS.get(L); if (!a) MARKS.set(L, (a = [])); return a; }
  const marks = (L) => marksOf(L).slice();
  // 쌓인 표시를 함께 걷는다 — 바탕 · 선은 0 으로, 글자는 --muted 로(명단 본래 색). 돌려주는 값 = 끝 시각.
  function unmark(tl, L, at, o) {
    o = o || {};
    const ms = marksOf(L);
    if (!ms.length) return at;
    const d = o.dur == null ? .3 : o.dur;
    const ink = getComputedStyle(document.documentElement).getPropertyValue("--text").trim();
    const mut = getComputedStyle(document.documentElement).getPropertyValue("--muted").trim();
    tl.fromTo(ms.map((m) => m.mk), { opacity: 1 }, { opacity: 0, duration: d, ease: "power1.in", immediateRender: false }, at);
    tl.fromTo(ms.map((m) => m.cell), { color: ink }, { color: mut, duration: d, ease: "power1.in", immediateRender: false }, at);
    return at + d;
  }

  window.LONG = { data, fmt, tables16, fold, layout, glyphSvg, glyph, list, foldBand, pulse, unmark, marks, GLYPH: GV, DEF_ROWS };
})();

</script>
<script>
// 1막(S0 · S1 · S2)의 자리 · 모양(window.WHY)과, S0 오프닝 · S12 클로징이 같은 자리에 다시 그리는 웨이퍼 심볼(WHY.wafer), 앱 로고(WHY.wafer.markSvg).
//
// WHY — 장면을 넘어 남는 요소(세 조각 · 엑셀 판)는 한 픽셀이라도 다르면 넘어갈 때 깜빡이므로 자리 · 크기 · 서식을 여기 한 곳에서만 정한다.
// WHY.wafer — 옛 앱 입장 화면 심볼(b61ea89 이전 intro.js drawSymbol · mapDies · look)을 SVG 로 다시 그린 것. 모양과 곡선만 참고했다(그 코드는 돌리지 않는다).
//   테두리 한 획(노치 6시) + 다이 81칸(배열은 식으로 고정 — 되감기 · 인쇄에서 같은 모양) + 한 칸만 대기색(질문 칸) + 잉크 고리,
//   그리고 다가가며 무채색으로 물러나는 전환(S0 b1)과 그 거꾸로(S12 b1), 칸이 다이 9칸으로 모이며 노치 테두리가 C 링이 되는 변신(S12 b1).
//   옛 앱 심볼은 69칸 · 부족 0칸이라 S12 의 「부족」이 설 칸이 없었다 — 그래서 81칸(부족 한 칸)을 그대로 쓴다.
//   지금 앱 심볼(10-07 「D · C 링」)은 C 링 + 다이 3 × 3 — 머리 로고(MARK · markSvg)와 S12 b1 의 끝 모습이 그 모양이다.
//
//   WHY.wafer.G                      기하 — K 5.6 · WX 680 · WY 260 · PX 560 · STEP 7.2 · SIZE 5.6 · LIM 40 · ASK (1, 0) · SHORT (−3, 2) · ZOOM 1.35 · PAN 50
//                                     · RIM(테두리 path) · origin(변환 원점 문자열) · ask / askZ(질문 칸 가운데, 1배 · 다가간 뒤) · die / dieZ(다이 한 변)
//                                     · center(960, 540) · app(앱 입장 화면 심볼 124px · 960 / 508 · 워드마크 36px · y 616)
//   WHY.wafer.MARK                   앱 메인 심볼 기하(뷰박스 100) — RING(C 링 path) · R 41 · OPEN 35도 · W 9 · DIES [28, 44, 60] · DIE 12 · RX 2
//   WHY.wafer.markSvg()              앱 로고 SVG 글자(C 링 + 3 × 3, 가운데 주황) — 표지 · S12 입장 화면 머리
//   WHY.wafer.DIES · ASKD            다이 81칸({gx, gy, cx, cy, order, fill, ask}) · 질문 칸
//   WHY.wafer.at(s, cx, cy)          상자 변환 값 {scale, x, y} — 심볼 가운데를 무대 (cx, cy) 에 s 배로(원점은 늘 질문 칸)
//   WHY.wafer.FLAT · ZOOMED          1배 제자리 {1, 0, 0} · 다가감 {1.35, 0, 50} (GSAP 에 넘길 때는 복사해서)
//   WHY.wafer.make(ctx, {answer?, mark?, askFaint?, parent?}) → w = { el, svg, rim, gIdle, gCol, gMono, cols[], others[], askDie, askFill?, ring, vig, marks?, askFaint }
//                                     mark: true 면 앱 다이 9칸(처음엔 보이지 않는다)과 81칸이 모일 자리를 함께 짓는다(S12)
//                                     askFaint: true(10-18 P09, 기본 꺼짐) 면 무채색 상태에서 질문 칸이 --faint 로 밝아 둘레의 무채색 칸(--muted 13%)과 갈린다 —
//                                       toMono 가 --die-idle → --faint(.6초, t + .15)로 바꾸고, set("mono") 는 그 값으로 바로 세우고, set("blank") · toColor 는 --die-idle 로 되돌린다.
//                                       S0 · S12 가 함께 켠다(같은 물체). 켜면 S0 b2 조각 처음 바탕 · S1 .s01-die · S12 b0 시작도 --faint 로 맞춘다(장면 몫).
//   WHY.wafer.set(tl, w, "blank" | "mono", t)   그 시각의 상태(처음 빈 심볼 · 다가간 무채색)
//   WHY.wafer.draw(tl, w, t)         S0 b0 — 테두리 한 획 → 칸이 각도 순서로 → 잉크 고리
//   WHY.wafer.toMono(tl, w, t)       S0 b1 — 다가가며 무채색(1.35배 · 막)        WHY.wafer.toColor(tl, w, t, {dur})  S12 b1 — 그 거꾸로
//   WHY.wafer.gather(tl, w, t)       S12 b1 — 81칸이 가장 가까운 앱 다이 자리로 모여 다이 9칸이 선다(make 의 mark 가 있어야 한다)
//   WHY.wafer.toSymbol(tl, w, t, {dur})  S12 b1 — 앱 심볼 크기로(노치 테두리 → C 링 · 고리 걷힘)
//   WHY.wafer.ringD(p)               테두리 모양 path(p 0 = RIM 노치 원 → 1 = MARK.RING C 링)
//   WHY.wafer.ringIn(tl, w, t) · answer(tl, w, t)   잉크 고리 긋기 · 답을 얻은 칸(판정색)이 차오름
//   모든 함수는 끝나는 시각을 돌려준다. tl.call · 무작위 · 시계를 쓰지 않는다(되감기 · 인쇄 · 점프 안전).
(function () {
  "use strict";

  // ---------------------------------------------------------------- 1막 판 · 조각의 자리
  // 판 셋(S1)의 자리. 다섯 칸 레일의 정거장(S1)이 판 가운데와 판 사이 틈에 서도록 맞췄다:
  // ① 300(CAMP 가운데) · ② 540(틈) · ③ 780 · ④ 1020(엑셀 안) · ⑤ 1260(틈) · 끝 1560(EDM 가운데).
  const P = {
    camp: { x: 120, y: 360, w: 360, h: 270, name: "CAMP" },
    excel: { x: 600, y: 360, w: 600, h: 270, name: "로컬 엑셀" },
    edm: { x: 1320, y: 360, w: 480, h: 270, name: "EDM" },
  };
  const KEYS = ["camp", "excel", "edm"];
  // S0 끝 = S1 처음: 판 가운데에 선 작은 조각(200 × 100)
  const TILE = { w: 200, h: 100 };
  const tileRect = (k) => ({ x: P[k].x + P[k].w / 2 - TILE.w / 2, y: P[k].y + P[k].h / 2 - TILE.h / 2, w: TILE.w, h: TILE.h });
  // 판 이름표: 위 테두리에 걸린다(왼쪽 18 · 글자 앞 여백 12 → 글자는 판 왼쪽에서 30, 세로 가운데가 테두리)
  const LAB = { left: 18, pad: 12, h: 38 };
  // 엑셀 판 안의 격자(7열 × 4줄, 첫 줄은 머리) — 판 크기를 따라 늘고 준다(S2 에서 판이 커질 때 그대로 따라간다)
  const GRID = { cols: 7, rows: 4, l: 24, r: 24, t: 40, b: 24 };
  const gridBox = (r) => ({ x: r.x + GRID.l, y: r.y + GRID.t, w: r.w - GRID.l - GRID.r, h: r.h - GRID.t - GRID.b });
  const gridCell = (r, c, row) => {
    const g = gridBox(r);
    return { x: g.x + (g.w / GRID.cols) * c, y: g.y + (g.h / GRID.rows) * row, w: g.w / GRID.cols, h: g.h / GRID.rows };
  };

  // ---------------------------------------------------------------- 웨이퍼 심볼 기하(뷰박스 100, 무대에서 560px → 1 단위 = 5.6px)
  const K = 5.6, WX = 680, WY = 260, PX = 560;    // 심볼 상자의 왼쪽 위 · 한 변(px)
  const STEP = 7.2, SIZE = 5.6, LIM = 40;          // 다이 81칸 = 테두리(반지름 44) 안쪽 반지름 40 에 든 7.2 간격 격자
  const ASK = { gx: 1, gy: 0 };                    // 질문 칸(대기색 + 고리) — 가운데 오른쪽 이웃
  const SHORT = { gx: -3, gy: 2 };                 // 부족 칸 하나(질문 칸과 멀리)
  // 다가갈 때 질문 칸을 축으로 1.35배, 그리고 50 아래로 — 위는 질문 글자에 닿지 않고(테두리 위 끝 ≈ 257), 아래는 y940 안(≈ 923)
  const ZOOM = 1.35, PAN = 50;
  const RIM = "M53,93.9 A44,44 0 1 0 47,93.9 L50,90.6 Z";   // 노치(6시)를 뺀 원호 + 노치 두 변(옛 앱 심볼 — b61ea89 이전 intro.js drawSymbol 과 같은 모양)
  const RING_R = 5.6;
  // 앱 메인 심볼(앱 b61ea89 · 10-07 「D · C 링」 — intro.js MARK_RING · MARK_DIES · drawSymbol). 뷰박스 100.
  // 반지름 41 링의 오른쪽 위아래 35도를 연 C(굵기 9 · 둥근 끝 · --text) + 다이 12 · 모서리 2 를 3 × 3 으로(28 · 44 · 60, 가운데 --warn · 나머지 --accent).
  const MARK = { RING: "M83.59 26.48 A41 41 0 1 0 83.59 73.52", R: 41, OPEN: 35, W: 9, DIES: [28, 44, 60], DIE: 12, RX: 2 };
  const NOTCH = { half: Math.asin(3 / 44) * 180 / Math.PI, depth: 3.4 };   // RIM 의 노치 — 반각 ≈ 3.91도 · 안으로 3.4(원 94 → 끝 90.6)
  // 다이 배열 — 식으로 정한다(되감기 · 인쇄에서 같은 모양). 순서 = 각도 70% + 반지름 30%(intro.js 의 차오르는 결).
  const DIES = [];
  (function () {
    let n = 0;
    for (let y = -6; y <= 6; y++) {
      for (let x = -6; x <= 6; x++) {
        const far = Math.hypot(Math.abs(x * STEP) + SIZE / 2, Math.abs(y * STEP) + SIZE / 2);
        if (far > LIM) continue;
        const order = ((Math.atan2(y, x) + Math.PI) / (Math.PI * 2)) * 0.7 + (Math.hypot(x, y) / 6) * 0.3;
        const ask = x === ASK.gx && y === ASK.gy;
        const fill = ask ? "var(--die-idle)"
          : x === SHORT.gx && y === SHORT.gy ? "var(--short)"
          : n % 13 === 7 ? "var(--warn)" : "var(--ok)";
        DIES.push({ gx: x, gy: y, cx: 50 + x * STEP, cy: 50 + y * STEP, order, fill, ask });
        n++;
      }
    }
  })();
  const ASKD = DIES.find((d) => d.ask);
  // 변환 원점 = 질문 칸 가운데(심볼 상자 안 px). 다가가기 · 물러나기 · 줄기 모두 이 원점 하나로 x · y 를 셈한다.
  const ORIGIN = { x: ASKD.cx * K, y: ASKD.cy * K };
  const G = {
    K, WX, WY, PX, STEP, SIZE, LIM, ASK, SHORT, ZOOM, PAN, RIM, RING_R,
    ORIGIN,
    origin: ORIGIN.x + "px " + ORIGIN.y + "px",
    // 질문 칸 가운데의 무대 좌표 — 1배(1000.3, 540) · 다가간 뒤(1000.3, 590). S0 의 세 조각과 S12 의 네모가 여기서 출발 · 도착한다.
    ask: { x: WX + ASKD.cx * K, y: WY + ASKD.cy * K },
    askZ: { x: WX + ASKD.cx * K, y: WY + ASKD.cy * K + PAN },
    die: SIZE * K,                                 // 1배 다이 한 변(px)
    dieZ: SIZE * K * ZOOM,                         // 다가간 뒤 다이 한 변(px) ≈ 42.3
    center: { x: WX + PX / 2, y: WY + PX / 2 },    // 심볼 가운데(960, 540)
    // 앱 입장 화면의 심볼(intro.js layout — 1920×1080 에서 S 124 · 가운데 960 / 508, 워드마크 36px 가운데 y 616)
    app: { px: 124, cx: 960, cy: 508, word: { size: 36, cy: 616 } },
  };
  // 상자 변환 값 — 심볼 가운데를 무대 (cx, cy) 에 s 배로 세운다(원점은 늘 질문 칸). 1배 제자리 = {1, 0, 0} · 다가감 = {1.35, 0, 50}.
  function at(s, cx, cy) {
    return {
      scale: s,
      x: cx - WX - ORIGIN.x - (PX / 2 - ORIGIN.x) * s,
      y: cy - WY - ORIGIN.y - (PX / 2 - ORIGIN.y) * s,
    };
  }
  const FLAT = { scale: 1, x: 0, y: 0 };
  const ZOOMED = { scale: ZOOM, x: 0, y: PAN };

  // 앱 로고(표지 왼쪽 위 · S12 입장 화면 머리) — 앱 brandMark 와 같은 모양을 SVG 한 장으로. 색은 :root 토큰.
  function markSvg() {
    let dies = "";
    MARK.DIES.forEach((y, r) => MARK.DIES.forEach((x, c) => {
      const f = r === 1 && c === 1 ? "var(--warn)" : "var(--accent)";
      dies += "<rect x=\"" + x + "\" y=\"" + y + "\" width=\"" + MARK.DIE + "\" height=\"" + MARK.DIE + "\" rx=\"" + MARK.RX + "\" style=\"fill:" + f + "\"/>";
    }));
    return "<svg viewBox=\"0 0 100 100\" aria-hidden=\"true\" style=\"overflow:visible\"><path d=\"" + MARK.RING +
      "\" style=\"fill:none;stroke:var(--text);stroke-width:" + MARK.W + ";stroke-linecap:round\"/>" + dies + "</svg>";
  }

  // ---------------------------------------------------------------- 서식(색은 :root 토큰만)
  const CSS = [
    // 조각 — 웨이퍼 바탕색 면 + 흐린 테두리, 이름은 가운데
    ".why-tile{position:absolute;border-radius:12px;background:var(--wafer);border:1.5px solid var(--line)}",
    ".why-tile .nm{position:absolute;left:0;top:0;height:38px;line-height:38px;font-size:28px;font-weight:700;color:var(--text);white-space:nowrap}",
    // 판 이름표 — 위 테두리를 바탕색으로 끊고 그 위에 이름
    ".why-lab{position:absolute;top:-19px;left:18px;height:38px;display:flex;align-items:center;gap:12px;padding:0 12px;white-space:nowrap;" +
      "background:linear-gradient(var(--surface) 0 52%,transparent 52%)}",
    ".why-lab b{font-size:28px;font-weight:700;line-height:38px;color:var(--text)}",
    ".why-lab.r{left:auto;right:18px}",
    ".why-grid{position:absolute;overflow:visible}",
    ".why-grid line{stroke:var(--track);stroke-width:1.5}",
    ".why-grid .hd{fill:var(--panel)}",
    // 웨이퍼 심볼 — 상자 · 테두리 · 잉크 고리 · 다가갈 때 바깥을 덮는 막
    ".wf-waf{position:absolute;left:" + WX + "px;top:" + WY + "px;width:" + PX + "px;height:" + PX + "px}",
    ".wf-waf svg{position:absolute;left:0;top:0;width:" + PX + "px;height:" + PX + "px;overflow:visible}",
    ".wf-rim{fill:none;stroke:var(--text);stroke-width:.45;stroke-linecap:round;stroke-linejoin:round}",
    ".wf-ring{fill:none;stroke:var(--text);stroke-width:.5;stroke-linecap:round}",
    ".wf-vig{position:absolute;left:0;top:0;width:1920px;height:1080px;pointer-events:none;z-index:1}",
  ].join("\n");
  if (!document.getElementById("why-css")) {
    const s = document.createElement("style");
    s.id = "why-css";
    s.textContent = CSS;
    document.head.appendChild(s);
  }

  function setRect(el, r) {
    el.style.position = "absolute";
    el.style.left = r.x + "px"; el.style.top = r.y + "px";
    el.style.width = r.w + "px"; el.style.height = r.h + "px";
    return el;
  }

  // 조각 하나(S0 끝 · S1 처음) — persist 열쇠 why-camp · why-excel · why-edm. 이름 자리는 글자 폭을 재서 px 로 둔다.
  function tile(ctx, k) {
    const el = setRect(ctx.el("div", "why-tile"), tileRect(k));
    const nm = ctx.el("span", "nm", P[k].name, el);
    const w = nm.offsetWidth;
    nm.style.left = Math.round((TILE.w - 3 - w) / 2) + "px";
    nm.style.top = Math.round((TILE.h - 3 - LAB.h) / 2) + "px";
    ctx.persist(el, "why-" + k);
    return { el, nm, w };
  }

  // 엑셀 판(S1 의 판 · S2 처음) — 판(기본: 업무 도식이라 실선 표기를 쓰지 않는다) + 위 테두리 이름표 + 격자.
  // persist 열쇠 why-xl. 격자는 viewBox 를 판 크기에 맞춰 늘리고(preserveAspectRatio none), 선 굵기는 그대로 둔다.
  function excelPanel(ctx, r) {
    r = r || P.excel;
    const el = ctx.panel(r.x, r.y, r.w, r.h);
    el.classList.add("why-xl");
    const lab = ctx.el("div", "why-lab", "<b>" + P.excel.name + "</b>", el);
    const svg = ctx.svg("svg", { class: "why-grid", viewBox: "0 0 700 400", preserveAspectRatio: "none" }, el);
    svg.style.left = GRID.l + "px"; svg.style.top = GRID.t + "px";
    svg.style.width = "calc(100% - " + (GRID.l + GRID.r) + "px)";
    svg.style.height = "calc(100% - " + (GRID.t + GRID.b) + "px)";
    ctx.svg("rect", { class: "hd", x: 0, y: 0, width: 700, height: 100 }, svg);
    for (let c = 0; c <= GRID.cols; c++) ctx.svg("line", { x1: c * 100, y1: 0, x2: c * 100, y2: 400, "vector-effect": "non-scaling-stroke" }, svg);
    for (let q = 0; q <= GRID.rows; q++) ctx.svg("line", { x1: 0, y1: q * 100, x2: 700, y2: q * 100, "vector-effect": "non-scaling-stroke" }, svg);
    ctx.persist(el, "why-xl");
    return { el, lab, grid: svg };
  }

  // 이야기의 한 칸(Pre B/D · 26.12) — 샘플 세계의 r1 → r2 에서 바뀐 칸 하나에서 읽는다.
  function thread(D) {
    const diff = (D.home_heatmap && D.home_heatmap["r1_차이"]) || {};
    const key = Object.keys(diff).find((k) => k.indexOf("|") > 0) || "|";
    const [name, month] = key.split("|");
    return { name, month, monthNo: month ? parseInt(month.split(".")[1], 10) : null };
  }
  // S0 의 질문(S12 가 같은 글자로 다시 세운다)
  function question(D) { return thread(D).monthNo + "월, 이 공정의 Capa는 충분한가?"; }

  // ---------------------------------------------------------------- 웨이퍼 심볼 — 그리기
  // 곡선은 intro.js 의 둘(EASE .6,0,0,1 · OUT .16,1,.3,1).
  let easesReady = false;
  const E = { io: "wfIO", out: "wfOut" };
  function eases() {
    if (easesReady) return;
    CustomEase.create(E.io, ".6,0,0,1");
    CustomEase.create(E.out, ".16,1,.3,1");
    easesReady = true;
  }

  // 심볼 상자(.wf-waf)와 막(.wf-vig)을 장면에 그린다. 층 순서: 대기색 바탕(모든 칸) → 판정색(차오른다) → 무채색(물러날 때) → 질문 칸 → 고리.
  // o.answer 가 있으면 질문 칸 위에 답을 얻은 칸(S12)을 하나 더 둔다(처음엔 보이지 않는다) — 판정색 토큰 이름(예: "var(--short)"), true 면 부족색.

precision highp float;
precision highp int;
uniform vec2 uOrigin;
uniform vec2 uPitch;
uniform float uDepth;
uniform vec3 uLight;
uniform float uShine;
uniform float uContrast;
uniform vec2 uDrop;
uniform float uDropR;
uniform float uDropK;
uniform float uDropW;
uniform float uFlash;
uniform float uFade;
out vec4 fragColor;

const float UNIT = 520.0;   // coverbg 의 물결 한 단위 — 빛 계산의 기울기 배율로만 남는다

float ring(float d, float R, float w) { float x = (d - R) / (0.5 * w); return exp(-x * x); }
// 물마루 + 뒤따르는 고리 둘
float crestAll(float d) {

  float e = max(uPitch.y, 4.0);

  float hy = (heightAt(css + vec2(0.0, e)) - heightAt(css - vec2(0.0, e))) / (2.0 * e);

  vec3 halfway = normalize(uLight + vec3(0.0, 0.0, 1.0));

  float emphasis = clamp(spec * 1.6, 0.0, 1.0);

  level = mix(level, 1.0, glow * 0.85);
  emphasis = max(emphasis, glow);
  float alpha = 0.96 * glow * 0.9 * uFade;
  alpha = max(alpha, 0.96 * flash * uFade);

  fragColor = vec4(level, alpha, emphasis, lift + 0.5);
}
`;

  const markFragment = `#version 300 es
precision highp float;
precision highp int;
uniform sampler2D tField;
uniform vec2 uOrigin;
uniform vec2 uPitch;
uniform vec2 uGrid;
uniform float uMarkSize;
uniform vec3 uColor;
uniform vec3 uAccent;
uniform vec3 uWhite;
uniform vec2 uDrop;
uniform float uDropR;
uniform float uDropK;
uniform float uDropW;
uniform float uFlash;
uniform vec4 uBackground;
out vec4 fragColor;

float box(vec2 p, vec2 b, float r) {
  vec2 q = abs(p) - b + r;
  return length(max(q, 0.0)) + min(max(q.x, q.y), 0.0) - r;
}

float coverage(vec2 local, float level) {
  float span = uPitch.y * uMarkSize;
  float area = max(sqrt(level), 0.14);
  float extent = 0.5 * span * area;
  return clamp(0.5 - box(local, vec2(extent), extent * 0.3), 0.0, 1.0);

void main() {
  vec2 rel = gl_FragCoord.xy - uOrigin;
  vec4 background = vec4(uBackground.rgb * uBackground.a, uBackground.a);

  float cx = floor(rel.x / uPitch.x);
  float row = floor(rel.y / uPitch.y);
  if (cx >= 0.0 && cx < uGrid.x) {
    for (int k = -1; k <= 1; k++) {
      float cy = row + float(k);
      if (cy < 0.0 || cy >= uGrid.y) continue;

      if (f.g < 0.002) continue;

      if (alpha <= ink.a) continue;

`;

    });
    // 칸 격자 — 무대 1920 × 1080, 간격 11px(coverbg 와 같은 계산, dpr 1)
    const pitch = S.spacing, w = STAGE_W, h = STAGE_H;
    const cols = Math.ceil(w / pitch) + 1, rows = Math.ceil(h / pitch) + 2;
    const origin = [Math.floor((w - cols * pitch) / 2), Math.floor((h - rows * pitch) / 2)];
    const fieldTarget = new O.RenderTarget(gl, { width: cols, height: rows, depth: false, minFilter: gl.NEAREST, magFilter: gl.NEAREST });
    const lightAngle = ((S.direction + 180 + S.light) * Math.PI) / 180;
    const fieldUniforms = {
      uOrigin: { value: origin }, uPitch: { value: [pitch, pitch] }, uDepth: { value: S.depth },
      uLight: { value: [Math.cos(lightAngle) * 0.78, Math.sin(lightAngle) * 0.78, 0.62] }, uShine: { value: S.shine },
      uContrast: { value: S.contrast },
      uDrop: { value: [w / 2, h / 2] }, uDropR: { value: -1 }, uDropK: { value: 0 }, uDropW: { value: CREST_W },
      uFlash: { value: 0 }, uFade: { value: 1 },

      tField: { value: fieldTarget.texture }, uOrigin: { value: origin }, uPitch: { value: [pitch, pitch] },
      uGrid: { value: [cols, rows] }, uMarkSize: { value: S.markSize },
      uColor: { value: BODY }, uAccent: { value: BODY.map((c, i) => c + (WHITE[i] - c) * 0.55) }, uWhite: { value: WHITE },

      uFlash: fieldUniforms.uFlash,
      uBackground: { value: [BASE[0], BASE[1], BASE[2], 1] },

    const markMesh = pass(markFragment, markUniforms);
    let alive = true;
    return {
      canvas,
      ok: true,
      // 한 장 그리기 — 값은 모두 P(타임라인이 트윈한 proxy)에서. 같은 P 면 같은 그림.
      draw(P) {
        if (!alive || gl.isContextLost()) return;
        fieldUniforms.uDrop.value = [P.x, h - P.y];
        fieldUniforms.uDropR.value = P.r;
        fieldUniforms.uDropK.value = P.k;
        fieldUniforms.uFlash.value = P.flash;
        fieldUniforms.uFade.value = P.fade == null ? 1 : P.fade;
        renderer.render({ scene: fieldMesh, target: fieldTarget });
        renderer.render({ scene: markMesh });
      },
      destroy() {
        if (!alive) return;
        alive = false;
        const x = gl.getExtension("WEBGL_lose_context");
        if (x) x.loseContext();
      },
    };
  }

  window.TZRipple = { mount };
})();

</script>

  const chain = (...n) => { for (let i = 0; i < n.length - 1; i++) n[i].connect(n[i + 1]); return n[n.length - 1]; };

  // ---------------------------------------------------------------- 효과음
  // 모든 함수는 (S, t, c) — S = {ac, sfx, N, reg}, t = 오디오 시각, c = 큐({t, k, f?, g?, d?}).
  const SYN = {
    // 펜 쉭 — 대역 노이즈가 위로 쓸린다
    pen(S, t, c) {
      const d = c.d || .75, n = noise(S, t, d, c.t * .37);
      const bp = filt(S, "bandpass", 900, 1.4);
      bp.frequency.setValueAtTime(700, t);
      bp.frequency.exponentialRampToValueAtTime(3600, t + d);
      const g = S.ac.createGain();
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime((c.g || .16), t + d * .35);
      g.gain.linearRampToValueAtTime(0, t + d);
      chain(n, bp, g, S.sfx);
    },
    // 톡 — 짧은 나무 소리(다이 · 막대 · 칩)
    tick(S, t, c) {
      const f = c.f || 1200, o = voice(S, "triangle", f, t, .12);
      o.frequency.exponentialRampToValueAtTime(f * .72, t + .08);
      chain(o, amp(S, t, .004, .09, c.g || .14));
      const o2 = voice(S, "sine", f * 2.01, t, .06);
      chain(o2, amp(S, t, .002, .04, (c.g || .14) * .35));
    },
    // 물방울(① 닿는 순간 — 덱 표지 전환) — 높은 사인이 짧게 떨어지며 톡, 배음 하나
    drop(S, t, c) {
      const f = c.f || 1500, o = voice(S, "sine", f, t, .3);
      o.frequency.exponentialRampToValueAtTime(f * .45, t + .16);
      chain(o, amp(S, t, .003, .26, c.g || .16));
      const o2 = voice(S, "sine", f * 2.4, t, .12);
      o2.frequency.exponentialRampToValueAtTime(f * 1.2, t + .08);
      chain(o2, amp(S, t, .002, .08, (c.g || .16) * .3));
    },
    // 꼭지 변신(④ 기존 → 개선) — 음절이 뒤집힐 때마다 오르는 톡 둘 + 짧은 쓸림, 끝에 밝은 종 둘(장3도 위로)
    flip(S, t, c) {
      const g = c.g || .12;
      [[.17, 1046.5], [.31, 1318.5]].forEach(([dt, f]) => {
        const tt = t + dt, o = voice(S, "triangle", f * .8, tt, .14);
        o.frequency.exponentialRampToValueAtTime(f, tt + .06);
        chain(o, amp(S, tt, .003, .1, g * .8));
      });
      const n = noise(S, t, .42, c.t * .41), bp = filt(S, "bandpass", 900, 1.2);
      bp.frequency.setValueAtTime(800, t);
      bp.frequency.exponentialRampToValueAtTime(4200, t + .4);
      const ng = S.ac.createGain();
      ng.gain.setValueAtTime(0, t);
      ng.gain.linearRampToValueAtTime(g * .35, t + .2);
      ng.gain.linearRampToValueAtTime(0, t + .42);
      chain(n, bp, ng, S.sfx);
      [[.42, 88], [.5, 92]].forEach(([dt, m]) => {
        const tt = t + dt;
        [[1, 1], [2.76, .25]].forEach(([k, gg]) => {
          const o = voice(S, "sine", mtof(m) * k, tt, 1.2);
          chain(o, amp(S, tt, .004, 1.0 / k, g * .7 * gg));
        });
      });
    },
    // 깊은 부풂(파동) — 낮은 사인이 부풀고 노이즈 숨결이 함께 퍼진다
    swell(S, t, c) {
      const d = c.d || 1.6;
      [55, 82.4, 110].forEach((f, i) => {
        const o = voice(S, "sine", f, t, d + .2);
        o.frequency.linearRampToValueAtTime(f * 1.06, t + d);
        const g = S.ac.createGain();
        g.gain.setValueAtTime(0, t);
        g.gain.linearRampToValueAtTime((c.g || .15) / (i + 1), t + d * .4);
        g.gain.exponentialRampToValueAtTime(.0001, t + d + .2);
        chain(o, g, S.sfx);
      });
      const n = noise(S, t, d, c.t * .53), lp = filt(S, "lowpass", 400, .7);
      lp.frequency.setValueAtTime(300, t);
      lp.frequency.exponentialRampToValueAtTime(2400, t + d * .5);
      lp.frequency.exponentialRampToValueAtTime(500, t + d);
      const g = S.ac.createGain();
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(.05, t + d * .45);
      g.gain.linearRampToValueAtTime(0, t + d);
      chain(n, lp, g, S.sfx);
    },
    // 차임 — 종(사인 셋, 비화성 배음)
    chime(S, t, c) {
      const f = c.f || 988;
      [[1, .14], [2.76, .05], [5.4, .02]].forEach(([m, g]) => {
        const o = voice(S, "sine", f * m, t, 1.6);
        chain(o, amp(S, t, .005, 1.4 / m + .2, g * (c.g ? c.g / .14 : 1)));
      });
    },
    // 밝은 차임(해소) — 장3화음이 차례로
    bright(S, t, c) {
      [84, 88, 91, 96].forEach((m, i) => {
        const tt = t + i * .07;
        const o = voice(S, "sine", mtof(m), tt, 1.4);
        chain(o, amp(S, tt, .005, 1.1, (c.g || .1)));
        const o2 = voice(S, "sine", mtof(m) * 2.76, tt, .6);
        chain(o2, amp(S, tt, .003, .4, (c.g || .1) * .25));
      });
    },
    // 뚜껑 덜컥 — 낮은 쿵 + 짧은 노이즈
    clunk(S, t, c) {
      const o = voice(S, "sine", 150, t, .3);
      o.frequency.exponentialRampToValueAtTime(70, t + .18);
      chain(o, amp(S, t, .003, .22, c.g || .3));
      const n = noise(S, t, .12, c.t * .71), lp = filt(S, "lowpass", 1400, .8);
      chain(n, lp, amp(S, t, .002, .09, .12));
      const t2 = t + .07, o2 = voice(S, "triangle", 420, t2, .1);
      chain(o2, amp(S, t2, .002, .06, .06));
    },
    // 솟음 — 위로 미끄러지는 음 + 숨결
    rise(S, t, c) {
      const d = c.d || .55, o = voice(S, "triangle", 220, t, d);
      o.frequency.exponentialRampToValueAtTime(520, t + d);
      const lp = filt(S, "lowpass", 1800, .7);
      const g = S.ac.createGain();
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(c.g || .1, t + d * .6);
      g.gain.exponentialRampToValueAtTime(.0001, t + d + .1);
      chain(o, lp, g, S.sfx);
      const n = noise(S, t, d, c.t * .29), bp = filt(S, "bandpass", 600, 1);
      bp.frequency.exponentialRampToValueAtTime(2200, t + d);
      chain(n, bp, amp(S, t, d * .6, d * .5, .035));
    },
    // UI 클릭 — 아주 짧은 딸깍
    click(S, t, c) {
      const n = noise(S, t, .03, c.t * .91), hp = filt(S, "highpass", 2500, .7);
      chain(n, hp, amp(S, t, .001, .025, c.g || .22));
      const o = voice(S, "square", 1800, t, .03), lp = filt(S, "lowpass", 3000, .7);
      chain(o, lp, amp(S, t, .001, .02, .04));
    },
    // 칸에 놓임(톡) — 더 둥근 나무 소리
    tok(S, t, c) {
      const f = c.f || 760, o = voice(S, "sine", f, t, .14);
      o.frequency.exponentialRampToValueAtTime(f * .62, t + .1);
      chain(o, amp(S, t, .003, .11, c.g || .2));
      const n = noise(S, t, .02, c.t * .43), bp = filt(S, "bandpass", 2200, 2);
      chain(n, bp, amp(S, t, .001, .015, .06));
    },
    // 경고 블립 — 두 번 짧게 내려간다
    blip(S, t, c) {
      [0, .13].forEach((dt) => {
        const tt = t + dt, o = voice(S, "square", 700, tt, .1), lp = filt(S, "lowpass", 1600, .9);
        o.frequency.exponentialRampToValueAtTime(520, tt + .08);
        chain(o, lp, amp(S, tt, .004, .08, c.g || .07));
      });
    },
    // 구김 — 노이즈 알갱이 여럿(시드 고정)
    crumple(S, t, c) {
      const r = rng(4242);
      for (let i = 0; i < 9; i++) {
        const tt = t + i * .042 + r() * .02, d = .03 + r() * .05;
        const n = noise(S, tt, d, i * .17), bp = filt(S, "bandpass", 1500 + r() * 2500, 1.6);
        chain(n, bp, amp(S, tt, .002, d, (c.g || .32) * (.5 + r() * .5)));
      }
    },
    // 쉭(장면 넘김) — 노이즈 대역이 올라갔다 내려온다. lo → hi → end 로 대역을 바꿀 수 있다(기본 350 → 1800 → 450)
    whoosh(S, t, c) {
      const d = c.d || .5, n = noise(S, t, d, c.t * .61), bp = filt(S, "bandpass", 400, 1.1);
      bp.frequency.setValueAtTime(c.lo || 350, t);
      bp.frequency.exponentialRampToValueAtTime(c.hi || 1800, t + d * .45);
      bp.frequency.exponentialRampToValueAtTime(c.end || 450, t + d);
      const g = S.ac.createGain();
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(c.g || .2, t + d * .4);
      g.gain.linearRampToValueAtTime(0, t + d);
      chain(n, bp, g, S.sfx);
    },
    // 펼침 — 짧게 올라가는 셋잇단
    spread(S, t, c) {
      [74, 79, 83].forEach((m, i) => {
        const tt = t + i * .05, o = voice(S, "triangle", mtof(m), tt, .25);
        chain(o, amp(S, tt, .004, .18, c.g || .07));
      });
    },
    // 반짝 갈라짐 — 높은 핑 여럿
    sparkle(S, t, c) {
      [91, 95, 98, 102, 96, 100].forEach((m, i) => {
        const tt = t + i * .045, o = voice(S, "sine", mtof(m), tt, .4);
        chain(o, amp(S, tt, .002, .32, c.g || .05));
      });
    },
    // 저장 확인음 — 두 음
    confirm(S, t, c) {
      [[81, 0], [88, .1]].forEach(([m, dt]) => {
        const tt = t + dt, o = voice(S, "sine", mtof(m), tt, .5);
        chain(o, amp(S, tt, .004, .4, c.g || .12));
        const o2 = voice(S, "triangle", mtof(m) * 2, tt, .2);
        chain(o2, amp(S, tt, .003, .12, (c.g || .12) * .2));
      });
    },
    // 타자
    type(S, t, c) {
      const n = noise(S, t, .03, c.t * .83), bp = filt(S, "bandpass", c.f || 3200, 2.2);
      chain(n, bp, amp(S, t, .001, .03, c.g || .28));
      const o = voice(S, "sine", 420, t, .04);
      chain(o, amp(S, t, .001, .03, (c.g || .28) * .3));
    },
    // 쌓임 툭 — 낮고 짧은 쿵
    thud(S, t, c) {
      const o = voice(S, "sine", 180, t, .2);
      o.frequency.exponentialRampToValueAtTime(85, t + .14);
      chain(o, amp(S, t, .003, .16, c.g || .3));
      const n = noise(S, t, .05, c.t * .47), lp = filt(S, "lowpass", 900, .7);
      chain(n, lp, amp(S, t, .001, .04, .08));
    },
    // 부족 낮은 경고 — 낮은 두 박
    lowwarn(S, t, c) {
      [0, .2].forEach((dt) => {
        const tt = t + dt, o = voice(S, "triangle", 146.8, tt, .3), lp = filt(S, "lowpass", 700, .8);
        o.frequency.exponentialRampToValueAtTime(130, tt + .22);
        chain(o, lp, amp(S, tt, .01, .24, c.g || .2));
      });
    },
    // 강조 툭 — 둥근 짧은 음
    pop(S, t, c) {
      const o = voice(S, "sine", c.f || 330, t, .16);
      o.frequency.exponentialRampToValueAtTime((c.f || 330) * .66, t + .12);
      chain(o, amp(S, t, .003, .13, c.g || .24));
      const n = noise(S, t, .015, c.t * .39), hp = filt(S, "highpass", 1500, .7);
      chain(n, hp, amp(S, t, .001, .012, .05));
    },
    // 내려가는 블립
    down(S, t, c) {
      const d = c.d || .4, o = voice(S, "triangle", 880, t, d);
      o.frequency.exponentialRampToValueAtTime(400, t + d);
      chain(o, amp(S, t, .006, d, c.g || .1));
    },
    // 화음(답) — 부드러운 장화음이 부푼다
    chord(S, t, c) {
      const d = c.d || 1.6;
      [62, 66, 69, 76].forEach((m, i) => {
        ["sine", "triangle"].forEach((ty, k) => {
          const o = voice(S, ty, mtof(m) * (k ? 1.003 : 1), t, d + .4);
          const g = S.ac.createGain();
          g.gain.setValueAtTime(0, t);
          g.gain.linearRampToValueAtTime((c.g || .05) * (k ? .5 : 1), t + .12 + i * .03);
          g.gain.exponentialRampToValueAtTime(.0001, t + d + .4);
          chain(o, g, S.sfx);
        });
      });
    },
    // 로크업이 드러날 때(①b, 10-17 2차) — 사인 둘(A5 · E6, Dm7 패드 안)이 조용히 열리고, 대역 노이즈 숨결이 위로 쓸린다
    title(S, t, c) {
      const g = c.g || .05;
      [[81, 0], [88, .04]].forEach(([m, dt]) => {
        const tt = t + dt, o = voice(S, "sine", mtof(m), tt, 1.05);
        chain(o, amp(S, tt, .08, .9, g));
      });
      const n = noise(S, t, .4, c.t * .67), bp = filt(S, "bandpass", 1800, 1.2);
      bp.frequency.setValueAtTime(1800, t);
      bp.frequency.exponentialRampToValueAtTime(3500, t + .4);
      const ng = S.ac.createGain();
      ng.gain.setValueAtTime(0, t);
      ng.gain.linearRampToValueAtTime(.02, t + .15);
      ng.gain.linearRampToValueAtTime(0, t + .4);
      chain(n, bp, ng, S.sfx);
    },
    // 자물쇠 철컥(③c 로컬에 갇힘) — 금속 딸깍(노이즈 6ms · 고역) + 짧은 사각파 2400 → 1800Hz + 0.025초 뒤 낮은 툭
    latch(S, t, c) {
      const n = noise(S, t, .006, c.t * .57), hp = filt(S, "highpass", 3000, .7);
      chain(n, hp, amp(S, t, .0005, .006, .18));
      const o = voice(S, "square", 2400, t, .012), lp = filt(S, "lowpass", 4000, .7);
      o.frequency.exponentialRampToValueAtTime(1800, t + .012);
      chain(o, lp, amp(S, t, .001, .012, .05));
      const t2 = t + .025, o2 = voice(S, "sine", 140, t2, .16);
      o2.frequency.exponentialRampToValueAtTime(70, t2 + .16);
      chain(o2, amp(S, t2, .003, .15, c.g || .22));
    },
    // 닫힌 문 두드림(③c 동료의 점선이 막힘) — 사인 210 → 150Hz 0.07초 + 저역 노이즈 0.02초
    knock(S, t, c) {
      const o = voice(S, "sine", 210, t, .09);
      o.frequency.exponentialRampToValueAtTime(150, t + .07);
      chain(o, amp(S, t, .002, .07, c.g || .18));
      const n = noise(S, t, .02, c.t * .49), lp = filt(S, "lowpass", 900, .7);
      chain(n, lp, amp(S, t, .001, .02, .05));
    },
    // 은은한 화음(⑩ 다리 문구 「AX 실행관리, 플랫폼 위에 모두 구현됩니다.」 가 설 때, 10-17 3차) — C 장화음 add9(C4 · G4 · C5 · D5 · E5, 배경 C add9 패드 안).
    // 사인 + 살짝 어긋난 삼각파가 음마다 0.02초 늦게 0.14초에 걸쳐 오르고 2.4초에 걸쳐 사라진다 — 문구가 다 서는 때(약 +0.2)에 화음도 다 차오른다
    // (3차 비평 T3 — 전에는 오름 0.35 · 음 사이 0.05 라 화음이 문구보다 0.5초쯤 늦게 들렸다)
    glow(S, t, c) {
      const g = c.g || .03, d = c.d || 2.4;
      [60, 67, 72, 74, 76].forEach((m, i) => {
        const tt = t + i * .02;
        ["sine", "triangle"].forEach((ty, k) => {
          const o = voice(S, ty, mtof(m) * (k ? 1.004 : 1), tt, d);
          const vg = S.ac.createGain();
          vg.gain.setValueAtTime(0, tt);
          vg.gain.linearRampToValueAtTime(g * (k ? .4 : 1) * (i ? .8 : 1), tt + .14);
          vg.gain.exponentialRampToValueAtTime(.0001, tt + d);
          chain(o, vg, S.sfx);
        });
      });
    },
    // 끝음 — 낮은 종 셋(F3 · F4 · C5 — 마지막 패드 Fmaj7(9) 위에서 으뜸음으로 닫는다. 10-18 P73, 전에는 D3 · D4 · A4)
    end(S, t, c) {
      [[53, .16], [65, .1], [72, .05]].forEach(([m, g]) => {
        const o = voice(S, "sine", mtof(m), t, 2.6);
        chain(o, amp(S, t, .01, 2.4, g * (c.g ? c.g / .16 : 1)));
        const o2 = voice(S, "sine", mtof(m) * 2.76, t, 1);
        chain(o2, amp(S, t, .005, .8, g * .15));
      });

  };
  const KINDS = Object.keys(SYN);

  // ---------------------------------------------------------------- 배경음
  // 패드 화음 하나 — 살짝 어긋난 톱니 둘 → 낮은 통과 필터(천천히 열린다) → 느린 엔벨로프
  function pad(S, notes, a, b, from, at, rate) {
    // 타임라인 [a, b) 구간의 화음을 오디오 시각에 맞춰 예약한다. from 이 구간 안이면 그 자리에서 짧게 페이드인한다.
    // 느린 속도에서는 화음이 그만큼 길게 머문다(오름 · 놓음 길이는 그대로).
    if (b <= from) return;
    const s = Math.max(a, from), t0 = at + (s - from) / rate, t1 = at + (b - from) / rate;
    const atk = s > a ? .08 : 1.4, rel = 1.6;
    const lp = filt(S, "lowpass", 760, .5);
    lp.frequency.setValueAtTime(620, t0);
    lp.frequency.linearRampToValueAtTime(1050, t0 + (t1 - t0) * .55);
    lp.frequency.linearRampToValueAtTime(700, t1 + rel);
    const g = S.ac.createGain();
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(1, t0 + atk);
    g.gain.setValueAtTime(1, t1);
    g.gain.linearRampToValueAtTime(0, t1 + rel);
    chain(lp, g, S.bgm);
    notes.forEach((m, i) => {
      [-6, 6].forEach((cents) => {
        const o = voice(S, "sawtooth", mtof(m), t0, t1 - t0 + rel);
        o.detune.value = cents + (i % 2 ? 2 : -2);
        const vg = S.ac.createGain();
        vg.gain.value = (i === 0 ? .03 : .019);
        // 좌우 폭 — 어긋난 두 톱니를 양쪽으로 벌린다(음마다 폭을 조금씩 달리)
        const pn = S.ac.createStereoPanner();
        pn.pan.value = (cents < 0 ? -1 : 1) * (.3 + .08 * (i % 3));
        chain(o, vg, pn, lp);
      });
    });
    // 아래 근음 사인(받침)
    const sub = voice(S, "sine", mtof(notes[0] - 12), t0, t1 - t0 + rel);
    const sg = S.ac.createGain();
    sg.gain.value = .05;
    chain(sub, sg, g);
  }
  // 숨 버퍼 — 시드 고정 노이즈의 1차 차분(높은 대역만) × 짧은 엔벨로프(4ms 오름 · 50ms 지수 내림), 피크 약 0.012
  const HAT = new WeakMap();
  function hatBuf(ac) {
    let b = HAT.get(ac);
    if (b) return b;
    const sr = ac.sampleRate, len = Math.round(sr * .06), r = rng(606);
    b = ac.createBuffer(1, len, sr);

      // (반복 노이즈 + 게인 자동화로 만들면 Chrome 이 소수 샘플 시각에서 한 샘플짜리 튐(−5 dBFS)을 낸다 — 10-17 측정)

    if (from < DUR - .5) {

      sfx.gain.linearRampToValueAtTime(0, at + (DUR - .05 - from) / rate);
    }
    sfx.connect(sess);
    if (bx) { bgm.connect(bx); bx.connect(sess); } else bgm.connect(sess);

      if (c.t < lo || !SYN[c.k]) continue;

      S.g = ts;
      SYN[c.k](S, ts, c);
      fired.push([c.t, ts]);
    }
    S.g = null;                                       // 여기부터 배경음
    for (let k = 0; k * BAR * 2 < DUR; k++) {

            else if (x.g >= t) x.n.stop(t);                            // 아직 소리 나지 않은 큐 — 새 세션이 낸다

          } catch (e) { /* 이미 멈춤 */ }

        nodes.push(...keep);                          // 남은 꼬리는 나중의 stop(멈춤 · 되감기)이 닫는다

      const gx = c - 1, gy = r - 1;

        el: svg("rect", { x, y, width: MK.DIE, height: MK.DIE, rx: MK.RX, style: "fill:" + (gx || gy ? "var(--accent)" : "var(--warn)") }, s),
        order: ((Math.atan2(gy, gx) + Math.PI) / (Math.PI * 2)) * .7 + (Math.hypot(gx, gy) / 6) * .3,   // 앱 drawSymbol 의 차례
        center: !gx && !gy,
      });
    }));
    return { el: box, ring, dies };

  // 사람 노드 — 원 + 사람 아이콘(덱 s01_why_manual.js PERSON_IC, 80 × 80 상자). ③c 동료 · 주인과 ⑤ 「모두가 본다」 동료가 같은 모양을 쓴다
  function personNode(isv, cx, cy, d, ic) {

  // 앱 입장 화면 오른쪽 웨이퍼 맵(intro.js mapDies · drawMap) — 다이를 반지름 띠 × 상태 × 밝기로 묶은 path 몇십 개.
  // front(0 → 1.06)가 검사 원의 반지름이다: 지난 띠는 판정색으로 차고(대기색이 걷힌다), 앞에는 강조색 검사 원이 지나간다.
  function WMap(parent, o) {
    const R = o.R, N = 24, sz = (R / N) * .8, NB = 18, LV = 3, EDGE = .07;
    const s = svg("svg", { class: "tz-map", width: R * 2, height: R * 2, viewBox: (-R) + " " + (-R) + " " + (R * 2) + " " + (R * 2) }, parent);
    place(s, o.cx - R, o.cy - R);
    svg("circle", { cx: 0, cy: 0, r: R, style: "fill:var(--wafer)" }, s);
    const rand = rng(o.seed || 20261004);
    const idle = [], col = [];
    for (let b = 0; b < NB; b++) { idle.push([]); col.push([[], [], []].map(() => Array.from({ length: LV }, () => []))); }
    for (let i = -N; i < N; i++) {
      for (let j = -N; j < N; j++) {
        const x = (i + .5) / N, y = (j + .5) / N, r = Math.hypot(x, y);
        if (r > .93) continue;
        const edge = r > .78, q = rand(), k = rand();
        const st = q < (edge ? .05 : .012) ? 2 : q < (edge ? .2 : .07) ? 1 : 0;
        const lv = Math.min(LV - 1, Math.floor((.5 + .5 * Math.sin(k * 30)) * LV));
        const b = Math.min(NB - 1, Math.floor(r / .93 * NB));
        const d = "M" + (x * R - sz / 2).toFixed(1) + " " + (y * R - sz / 2).toFixed(1) + "h" + sz.toFixed(1) + "v" + sz.toFixed(1) + "h" + (-sz).toFixed(1) + "z";
        idle[b].push(d);
        col[b][st][lv].push(d);
      }
    }
    const FILLS = ["var(--ok)", "var(--warn)", "var(--short)"];
    const gI = [], gC = [];
    for (let b = 0; b < NB; b++) {
      gI.push(svg("path", { d: idle[b].join("") || "M0 0", style: "fill:var(--die-idle)" }, s));
      const g = svg("g", { opacity: 0 }, s);
      col[b].forEach((lvs, st) => lvs.forEach((ds, lv) => {
        if (ds.length) svg("path", { d: ds.join(""), style: "fill:" + FILLS[st] + ";fill-opacity:" + (.58 + .3 * (lv + .5) / LV).toFixed(3) }, g);
      }));
      gC.push(g);
    }
    const scan = svg("circle", { cx: 0, cy: 0, r: 2, style: "fill:none;stroke:var(--accent);stroke-width:2.6", opacity: 0 }, s);
    const R2 = R * 1.02, n = .035;
    const sx = (-R2 * Math.sin(n)).toFixed(1), sy = (R2 * Math.cos(n)).toFixed(1), ex = (R2 * Math.sin(n)).toFixed(1);
    svg("path", {
      d: "M" + sx + " " + sy + "A" + R2 + " " + R2 + " 0 1 1 " + ex + " " + sy + "L0 " + (R * .985).toFixed(1) + "Z",
      style: "fill:none;stroke:var(--text);stroke-opacity:.24;stroke-width:1.5;stroke-linejoin:round",
    }, s);
    const front = prop(0, (f) => {
      for (let b = 0; b < NB; b++) {
        const rb = (b + .5) / NB * .93, cover = smooth((f - rb) / EDGE);
        gI[b].setAttribute("opacity", (1 - cover).toFixed(3));
        gC[b].setAttribute("opacity", cover.toFixed(3));
      }
      const ring = f <= .002 ? 0 : .75 * smooth((1.04 - f) / .14);
      scan.setAttribute("opacity", ring.toFixed(3));
      scan.setAttribute("r", Math.max(2, Math.min(f, 1) * R).toFixed(1));
    });
    return { svg: s, front };
  }

  // ---------------------------------------------------------------- ① 심볼과 물방울 (0.0–2.30, 고리는 4.25 까지)
  // 앱 입장 화면 첫머리(intro.js — 링 260→1260ms · 다이 780 + order × 620 · 워드마크 1200 + 45ms)를 0.75배로 그은 뒤,
  // 덱 표지 → S0 전환의 물방울(s00_cover.js exit · lib/coverbg.js setDrop)로 넘긴다(10-17 사용자 — 앱의 원형 펼침 대신).
  // 10-17 2차 — 비단 물결 배경(곡선 띠 3줄 · 차오름 · 가운데 낮춤)은 뺐다(사용자). 남은 것: 심볼이 살짝 가라앉았다가 → 닿는 순간 가운데 번쩍(가운데 다이도 흰빛) →
  //   칸 격자 물마루 고리와 뒤따르는 옅은 고리 둘이 번지며 심볼 · 워드마크를 둥글게 지운다(teaser/ripple.js) → 그 뒤를 따라 ①b 로크업이 드러난다.
  //   값은 덱 그대로를 덱 속도(전역 0.75배 → 4/3배 길이)로: 가라앉기 0.6 · 번쩍 0.4 · 되오름 0.133 · 파장 2.8초 power1.out 반지름 0 → 1250 · 세기 1 → 0.75 sine.in.
  //   덱 곡선은 그대로 두고 화면 끝에서 fade 로 따로 꺼뜨린다(3.55–4.25).
  const APP = { cx: 960, cy: 508, px: 124 };
  const MAPO = { cx: 1344, cy: 540, R: 648 };
  const REV = { r0: Math.round(APP.px * .44), r1: Math.ceil(Math.hypot(Math.max(APP.cx, W - APP.cx), Math.max(APP.cy, H - APP.cy))) };
  const clipAt = (r) => "circle(" + r + "px at " + APP.cx + "px " + APP.cy + "px)";
  const DROP = { fall: .6, flash: .4, rise: .1333, ring: 2.8, end: 1250 };
  const T_HIT = 2.30;                                  // 닿는 순간 — 가라앉기는 T_HIT − fall 부터
  // 물방울 값 하나 — 타임라인이 트윈하고, 타임라인이 움직일 때마다 한 장을 그린다(FLUSH). ①b 로크업 마스크도 이 반지름을 읽는다.
  const RIP = { x: APP.cx, y: APP.cy, r: -1, k: 0, flash: 0, fade: 1 };
  let RIPPLE_OK = null;                                // WebGL2 로 그리면 true — false 면 SVG 원 셋 대체 그림(하프톤 · 번쩍 없음). 내보내기가 확인하고 멈춘다
  function sceneSymbol() {
    const S = .75;
    const T_END = 4.35;                                  // 고리가 다 꺼진 뒤(fade 끝 4.25) — 층을 끈다
    const L = layer(0, T_END);
    // 물방울 고리(칸 격자) — 바탕 칸은 그리지 않는다. 고리가 꺼진 뒤에도 WebGL 문맥은 두고(destroy 를 부르지 않는다) 되감기 · seek 에서 다시 그린다
    const bg = TZRipple.mount(L);
    RIPPLE_OK = !!bg.ok;
    const fg = el("div", "tz-layer", null, L);           // 심볼 · 워드마크 — 물마루가 둥글게 지운다(덱 cv-fg)
    const sym = Mark(fg, APP.cx, APP.cy, APP.px);
    const word = el("div", "tz-word", null, fg);
    word.style.top = (616 - 22) + "px";
    const chars = [...TX.brand].map((ch) => el("span", null, ch, word));
    const center = sym.dies.find((d) => d.center);

    // 링 — C 의 위 끝에서 왼쪽을 돌아 아래 끝까지 펜으로(drawSVG). 0% 의 둥근 끝 점이 보이지 않게 긋기 전에는 숨긴다.
    const tr = .26 * S;
    M.set(sym.ring, { drawSVG: "0%", opacity: 0 }, 0);
    M.set(sym.ring, { opacity: 1 }, tr);
    M.to(sym.ring, { drawSVG: "100%", duration: 1.0 * S, ease: IO }, tr);
    cue(tr, "pen", { d: .78 });
    sym.dies.forEach((d) => {
      M.set(d.el, { opacity: 0, scale: .3, transformOrigin: "50% 50%" }, 0);
      const t = (.78 + d.order * .62) * S;
      M.to(d.el, { opacity: 1, scale: 1, duration: .32 * S, ease: OUT }, t);
      cue(t, "tick", { f: d.center ? 1560 : 1100 + Math.round(d.order * 400), g: d.center ? .1 : .06 });
    });
    // 워드마크 — 벌어진 글자가 모여들며 흐림이 걷힌다
    const mid = (chars.length - 1) / 2, gap = .6 * 36;
    chars.forEach((ch, i) => {
      M.set(ch, { x: (i - mid) * gap, opacity: 0, filter: "blur(8px)" }, 0);
      M.to(ch, { x: 0, duration: 1.2 * S, ease: OUT }, 1.2 * S);
      M.to(ch, { opacity: 1, filter: "blur(0px)", duration: .7 * S, ease: OUT }, (1.2 + i * .045) * S);
    });

    const P = RIP;
    M.set(P, { r: -1, k: 0, flash: 0, fade: 1 }, 0);
    // 가라앉기 — 떨어지는 것은 그리지 않는다. 심볼이 살짝 가라앉는다
    const TD = T_HIT - DROP.fall;
    M.set(sym.el, { scale: 1, transformOrigin: "50% 50%" }, 0);
    M.to(sym.el, { scale: .94, duration: DROP.fall, ease: "power2.in" }, TD);
    // 닿는 순간 — 가운데가 한 번 번쩍(가운데 다이도 흰빛), 파장이 번진다(처음엔 빠르고 점점 느리게)
    M.set(P, { r: 0, k: 1, flash: 1 }, T_HIT);
    M.to(P, { flash: 0, duration: DROP.flash, ease: "power2.out" }, T_HIT);
    M.to(P, { r: DROP.end, duration: DROP.ring, ease: "power1.out" }, T_HIT);
    M.to(P, { k: .75, duration: DROP.ring, ease: "sine.in" }, T_HIT);
    M.to(P, { fade: 0, duration: .7, ease: "power1.in" }, 3.55);   // 물마루 R 867(3.55) → 좌우 끝 960(3.75) → 모서리 1101(4.13)
    M.to(sym.el, { scale: 1, duration: DROP.rise, ease: "sine.out" }, T_HIT);
    M.set(center.el, { fill: TOK("--warn") }, 0);
    M.set(center.el, { fill: TOK("--text") }, T_HIT);
    cue(T_HIT, "drop");
    cue(T_HIT + .02, "swell", { d: 1.9, g: .12 });
    // 글자 층 — 물마루 안쪽 R − 28 → R 을 부드럽게 지운다(덱 exit 의 cv-fg 마스크 — 0.75배 속도라 경계를 좁혔다)
    let mLast = null;
    FLUSH.push(() => {
      const t = M.time();
      if (t > T_END + .01) return;
      bg.draw(P);
      const m = P.r < 0 ? "" : "radial-gradient(circle at " + P.x + "px " + P.y + "px, transparent " +
        Math.max(0, P.r - 28).toFixed(1) + "px, #000 " + Math.max(0, P.r).toFixed(1) + "px)";
      if (m !== mLast) { fg.style.maskImage = m; fg.style.webkitMaskImage = m; mLast = m; }
    });
  }

  // ---------------------------------------------------------------- ①b 로크업 · 「왜 만들었나?」 → 「기존」 질문 (2.30–4.73, 질문은 6.30 에 걷힘)
  // 10-17 2차(사용자 구성) — 처음 보는 사람이 「갑자기 왜 저걸 묻지?」 하지 않게: 파동이 퍼진 뒤 → 위에 웹 이름 로크업(왼쪽에 심볼 —
  // 10-17 3차: 대표 라벨 「S.PKG CAPA」 + 부제 「AX Management」 두 줄, 덩어리 가운데 y 350) →
  // 그 아래 「왜 만들었나?」(「?」 가 떨어져 찌그러지고 물결이 퍼진다) → 「?」 만 남아 질문 「12월, Pre B/D 확보율은?」 의 끝으로 날아가 붙는다(매치컷).
  // 「기존」 꼭지는 질문보다 먼저(4.45 — sceneHeader, 로크업이 다 걷힌 뒤 · 첫 낱말 4.46 바로 앞) 서서 사용자 원문 「기존 - 12월 Pre B/D 확보율은?」 순서로 읽힌다.
  // 「?」 는 주황(--warn) — ① 심볼 가운데 다이 · 기존 구간의 문제 표지와 같은 색(강조색 청록은 「개선」 몫).
  function sceneTitle() {

    // 로크업 — 물마루가 지나간 자리에 40–110px 뒤처져 드러난다(마스크 = 물방울 반지름의 함수)
    const lockL = el("div", "tz-layer", null, L);
    const lock = el("div", "tz-lock", null, lockL);
    el("span", "mk", WF.markSvg(), lock);
    // 웹 이름 두 줄 — 대표 라벨 「S.PKG CAPA」(크게) 위 · 부제 「AX Management」(작게 · 가볍게 · 강조색) 아래, 왼쪽 맞춤(덱 표지 로크업 · S12 입장 화면과 같은 위계)
    const nm = el("span", "nm", null, lock);
    el("span", "lt", esc(TX.lockup.main), nm);
    el("span", "sb", esc(TX.lockup.sub), nm);
    // 질문(낱말 셋 + 주황 「?」) — 지금 자리(가운데 y 250)
    const q = el("div", "tz-q", null, L);
    q.style.top = (250 - 43) + "px";
    const qws = TX.qw.map((w, i) => { if (i) q.appendChild(document.createTextNode(" ")); return el("span", null, esc(w), q); });
    const qmQ = el("span", "qm", esc(TX.qm), q);
    const drip = svg("svg", { class: "tz-svg", viewBox: "0 0 1920 1080" }, L);
    // 「왜 만들었나?」 — 낱말 둘 + 큰 주황 「?」(날아가는 것)
    const why = el("div", "tz-why", null, L);
    const ww = TX.why.map((w, i) => { if (i) why.appendChild(document.createTextNode(" ")); return el("span", null, esc(w), why); });
    const qmW = el("span", "qm", esc(TX.qm), why);
    // 두 「?」 의 자리를 잰다(글꼴 예열 뒤 · 트랜스폼을 걸기 전). 배율로 나눠 무대 좌표로.
    const SR = stage.getBoundingClientRect(), SC = SR.width / W || 1;
    const box = (e) => { const r = e.getBoundingClientRect(); return { cx: (r.left + r.width / 2 - SR.left) / SC, cy: (r.top + r.height / 2 - SR.top) / SC, b: (r.bottom - SR.top) / SC }; };
    const A = box(qmW), B = box(qmQ);

    ww.forEach((w, i) => M.to(w, { opacity: 1, y: 0, duration: .36, ease: OUT }, [3.15, 3.23][i]));
    // 「?」 낙하 → 착지 찌그러짐(바닥 기준) · 빛 · 물결

    M.to(qmW, { scaleX: 1, scaleY: 1, duration: .32, ease: "elastic.out(1, .5)" }, TLD + .16);
