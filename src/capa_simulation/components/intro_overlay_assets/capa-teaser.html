/* 혁신대회 발표 무대 — 공용 서식.
   색은 앱 tokens.INTRO_PALETTE 와 같은 값이다(입장 화면·Summary 와 한 벌). 무대는 1920×1080 고정이고
   창 크기에 맞춰 통째로 줄이고 늘린다 — 장면 안의 좌표는 언제나 1920×1080 기준이다. */

:root{
  --surface:#0F1013;
  --wafer:#17191E;
  --text:#ECECEF;
  --muted:#9A9CA6;
  --faint:#5E616B;
  --accent:#5FB8AC;
  --line:rgba(236,236,239,.2);
  --track:rgba(236,236,239,.12);
  --panel:rgba(236,236,239,.035);
  --panel-line:rgba(236,236,239,.16);
  --tip:#1C1D22;
  --die-idle:#24272E;
  --ok:#4FA79C;
  --warn:#D29A3A;
  --short:#D0644F;
  /* 성숙도 — 앱에 화면이 있음(실선 — 데이터 대기 화면 포함, 꼬리표는 쓰지 않는다 10-06), 다음 단계(점선). 색이 아니라 선의 결로 가른다(S12 C7 「실선은 이미 앱에, 점선은 다음 단계」). */
  --built-line:rgba(236,236,239,.55);
  --pending-line:rgba(236,236,239,.55);
  --designed-line:rgba(236,236,239,.42);
  --sans:"CapaSans","Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  --display:"CapaDisplay","Archivo","CapaSans","Malgun Gothic",sans-serif;
  --num:"CapaNumber","Archivo","CapaSans","Malgun Gothic",sans-serif;
  --ease-out:cubic-bezier(.16,1,.3,1);
}

*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;color:var(--text);overflow:hidden}
body{font-family:var(--sans);-webkit-font-smoothing:antialiased;word-break:keep-all}

/* ---------------------------------------------------------------- 무대 */
#viewport{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000}
#stage{
  position:relative;width:1920px;height:1080px;flex:0 0 auto;
  background:var(--surface);overflow:hidden;transform-origin:50% 50%;
}
.scene{position:absolute;inset:0;visibility:hidden}
.scene.on{visibility:visible}

/* 장면 머리 — 꼭지(막 이름) · 제목 한 문장 · 쉬운 말 풀이 */
.hd{position:absolute;left:120px;top:84px;right:120px}
.hd .kicker{
  font-family:var(--display);font-weight:800;font-stretch:75%;font-size:24px;letter-spacing:.14em;
  color:var(--accent);text-transform:uppercase;display:flex;gap:18px;align-items:center;
}
.hd .kicker .sep{width:36px;height:2px;background:var(--accent);opacity:.6}
/* 웹 이름 꼭지(S0 · S12) — 대표 라벨 「S.PKG CAPA」 는 소스 글자 그대로 대문자, 부제 「AX Management」 는 대문자 변환 없이 가볍게 — 굵기 500 · 톤 .72 · 앞 간격 .3em 으로 대표 라벨과 떼어 부제로 읽히게(10-17 새 이름) */
.hd .kicker .sub{margin-left:.3em;font-family:var(--num);font-weight:500;font-stretch:normal;letter-spacing:.03em;text-transform:none;opacity:.72}
/* 꼭지 알약(10-17 영상판 양식) — 모양 · 색으로 막을 가른다. 기존 = 회색 테두리 · 각진 모서리 / 개선 = 강조색 채움 · 둥근 알약 /
   확산 · AX = 강조색 테두리 둥근 알약(.ax 점선 = 다음 단계 · .ax.made 실선 = 이미 한 것). 글은 engine.js Deck.kick() 이 만든다.
   .kp = 알약 + 보조 글자(.ksub — 꼭지 서체 그대로, 흐린 색). 낱자는 .sl 칸(높이 32 · 알약 안쪽 40 보다 낮게 자른다)에 하나씩 —
   칸 안 .st 를 위로 32 올리면 .b 글자로 바뀐다(S2 b2 「기존」 → 「개선」). .pt = 꼬리(「 · 표준화」), 장면이 폭을 늘이거나 바꿔 끼운다.
   영상판(teaser)이 이 파일을 직접 링크하므로 모두 .hd .kicker 아래에만 둔다(영상판은 .tz-* 만 쓴다). */
.hd .kicker .kp{display:inline-flex;align-items:center}
.hd .kicker .pill{position:relative;display:inline-flex;align-items:center;box-sizing:border-box;height:44px;padding:0 18px;border:2px solid;border-radius:8px;
  overflow:hidden;white-space:nowrap;font:700 26px/1 var(--sans);font-stretch:normal;letter-spacing:.02em;text-transform:none}
.hd .kicker .pill .pk{display:flex}
.hd .kicker .pill .sl{display:block;height:32px;overflow:hidden}
.hd .kicker .pill .st{display:block}
.hd .kicker .pill .st span{display:block;width:max-content;height:32px;line-height:32px}
.hd .kicker .pill .pt{display:block;height:32px;line-height:32px;overflow:hidden}
.hd .kicker .pill.old{border-color:var(--muted);color:var(--text);background:none}
.hd .kicker .pill.new{border-color:var(--accent);background:var(--accent);color:var(--surface);border-radius:22px}
.hd .kicker .pill.ax{border:2px dashed var(--accent);color:var(--accent);background:none;border-radius:22px}
.hd .kicker .pill.ax.made{border-style:solid}
.hd .kicker .ksub{margin-left:14px;color:var(--muted)}
.hd .kicker.is-old .sep{background:var(--muted)}
.hd h2{margin:18px 0 0;font-size:66px;line-height:1.18;font-weight:700;letter-spacing:-.01em}
/* 알약 꼭지(44px)는 글자 꼭지보다 약 15px 높다 — 제목 위 사이를 18 → 12 로 줄여 머리가 약 9px 만 내려간다. 웹 이름 꼭지(S0 · S12)는 그대로 18. */
.hd .kicker.has-pill + h2{margin-top:12px}
.hd .gloss{margin-top:16px;font-size:27px;line-height:1.5;color:var(--muted);max-width:1500px}
.line-mask{display:block;overflow:hidden;padding-bottom:.08em}

/* 공용 글자 크기 — 무대 뒤쪽 좌석 기준. 22px 아래로는 쓰지 않는다. */
.t-xl{font-size:44px;font-weight:700}
.t-lg{font-size:34px;font-weight:700}
.t-md{font-size:28px}
.t-sm{font-size:24px;color:var(--muted)}
.t-xs{font-size:22px;color:var(--muted)}
.num{font-family:var(--num);font-weight:700;font-variant-numeric:tabular-nums}

/* 판(블록) — 실제 화면을 블록으로 줄인 도식과 결합 묶음이 같은 판을 쓴다 */
.panel{position:absolute;background:var(--panel);border:1.5px solid var(--panel-line);border-radius:14px}
.panel.built{border-color:var(--built-line)}
.panel.designed{border:2px dashed var(--designed-line);background:rgba(236,236,239,.02)}
.bar{display:block;height:14px;border-radius:7px;background:var(--track)}
.bar.dim{background:rgba(236,236,239,.07)}

/* 배지 — 샘플 데이터 · 설계 · Data확보중 */
.badge{
  display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 15px;border-radius:18px;
  font-size:22px;font-weight:700;letter-spacing:.02em;white-space:nowrap;
  border:1.5px solid var(--line);color:var(--muted);background:rgba(15,16,19,.7)
}
.badge::before{content:"";width:9px;height:9px;border-radius:50%;background:currentColor;opacity:.9}
.badge.sample{color:#C9CBD3;border-style:dotted}
.badge.designed{color:#C9CBD3;border-style:dashed}
.badge.pending{color:var(--warn);border-color:rgba(210,154,58,.55)}
/* 구현됨 — 판정색(확보)을 쓰지 않는다. 판정색 면·글자는 판정에만. */
.badge.built{color:var(--text);border-color:var(--built-line)}
.badge.ai{color:var(--muted);border-style:solid}

/* 범례 — 3막 처음에 한 번 정의한다 */
.legend{display:flex;gap:34px;align-items:center;font-size:22px;color:var(--muted)}
.legend .k{display:flex;gap:12px;align-items:center}
.legend .sw{width:46px;height:26px;border-radius:6px;border:2px solid var(--built-line)}
.legend .sw.designed{border-style:dashed;border-color:var(--designed-line)}

/* 가상 커서 */
.cursor{position:absolute;left:0;top:0;width:34px;height:34px;pointer-events:none;z-index:50;opacity:0}
.cursor svg{width:34px;height:34px;filter:drop-shadow(0 3px 6px rgba(0,0,0,.6))}
.cursor .ring{
  position:absolute;left:-22px;top:-22px;width:44px;height:44px;border-radius:50%;
  border:3px solid var(--accent);opacity:0;transform:scale(.4)
}

/* 진행 레일 — 막 구간과 현재 위치 */
#rail{position:absolute;left:120px;right:120px;bottom:40px;height:22px;display:flex;gap:10px;z-index:40;pointer-events:none}
#rail .act{flex:1 1 0;position:relative}
#rail .act .tk{position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--track);border-radius:2px}
/* 넘길 때 채움 · 막 이름 색은 짧게 이어 바뀐다(뚝 끊기지 않게 — 10-18 P08). 레일은 덱 크롬이라 장면 타임라인 밖이다(영상판에는 #rail 이 없다). */
#rail .act .fill{position:absolute;left:0;bottom:0;height:3px;width:0;background:var(--accent);border-radius:2px;transition:width .35s cubic-bezier(.16,1,.3,1)}
#rail .act .nm{position:absolute;left:0;bottom:10px;font-size:17px;letter-spacing:.08em;color:var(--faint);font-family:var(--display);font-weight:800;font-stretch:75%;text-transform:uppercase;transition:color .3s}
#rail .act.cur .nm{color:var(--muted)}
#rail.hide,#rail.end-hide{opacity:0}
#rail{transition:opacity .4s}
#rail .dot{flex:0 0 8px;width:8px;height:8px;border-radius:50%;background:var(--faint);align-self:flex-end;margin-bottom:-2.5px;opacity:.5}
/* 재생 중 신호 — 강조색으로 가만히 켜 둔다. 깜빡임(.5초 steps)은 무대 움직임과 박자가 엇갈려 시선을 끌어 껐다(10-18 P08). */
#rail.playing .dot{background:var(--accent);opacity:.8}
.legend .tag{display:inline-flex;align-items:center;height:32px;padding:0 10px;margin-left:6px;border-radius:6px;font-size:22px;font-weight:700;color:var(--muted);border:1.5px solid var(--line)}

/* 대본 띠 — 무대 밖 아래. 무대는 띠 높이만큼 위로 비켜 선다(engine.js fit). */
#script{position:fixed;left:0;right:0;bottom:0;height:132px;z-index:95;display:grid;grid-template-columns:110px minmax(0,1fr) auto;
  grid-template-rows:auto auto;column-gap:22px;row-gap:6px;align-content:center;padding:14px 28px;
  background:#16181C;border-top:1px solid rgba(236,236,239,.14);font-family:var(--sans);color:var(--text)}
#script .sc-meta{grid-row:1/3;display:flex;flex-direction:column;gap:2px;font-family:var(--num);color:var(--muted)}
#script .sc-meta b{font-size:26px;color:var(--accent)}
#script .sc-meta span{font-size:15px;font-variant-numeric:tabular-nums}
#script .sc-say{font-size:20px;line-height:1.55;min-width:0;max-height:62px;overflow:auto}
#script .sc-next{grid-column:2;font-size:14px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
#script .sc-close{grid-column:3;grid-row:1/3;align-self:center;font:500 13px var(--sans);color:var(--muted);background:none;
  border:1px solid rgba(236,236,239,.2);border-radius:6px;padding:7px 12px;cursor:pointer}
#script[hidden]{display:none}

/* 암전 */
#black{position:absolute;inset:0;background:#000;z-index:90;opacity:0;pointer-events:none;transition:opacity .35s}
#black.on{opacity:1}

/* 출처·주석 줄(장면 아래) */
.foot{position:absolute;left:120px;right:120px;bottom:84px;font-size:22px;color:var(--faint);line-height:1.5}

/* 인쇄(사전 제출본) — 장면마다 한 쪽: 위 1080 은 마지막 beat 상태, 아래 280 띠는 beat 요약과 각주 */
@page{size:1920px 1360px;margin:0}
body.print{overflow:visible;background:var(--surface)}
body.print #viewport{position:static;display:block}
body.print #stage{transform:none!important;width:auto;height:auto;overflow:visible;background:none}
body.print .page{position:relative;width:1920px;height:1360px;overflow:hidden;background:var(--surface);break-after:page;page-break-after:always}
body.print .scene{position:relative;visibility:visible;width:1920px;height:1080px;overflow:hidden}
body.print .band{height:280px;padding:22px 120px;border-top:1.5px solid var(--panel-line);font-size:19px;line-height:1.55;color:var(--muted)}
body.print .band .bt{font-size:21px;font-weight:700;color:var(--text);margin-bottom:6px}
body.print .band ol{margin:0;padding-left:22px;columns:2;column-gap:60px}
body.print .band .bn{margin-top:6px;font-size:17px;color:var(--faint)}
body.print #rail,body.print #black{display:none}

@media (prefers-reduced-motion: reduce){
  .cursor{transition:none}
  #rail .act .fill,#rail .act .nm{transition:none}   /* 10-18 P08 레일 전환도 움직임 줄이기에서는 끈다 */
}

/* 40초 영상판 — 이 페이지 전용 서식(tz- 접두). 색은 ../src/engine.css 의 :root 토큰만 쓴다.
   CSS transition · animation 은 쓰지 않는다 — 모든 움직임은 teaser.js 의 GSAP 마스터 타임라인 하나에 있다(seek 결정성). */

.tz-layer{position:absolute;left:0;top:0;width:1920px;height:1080px}
.tz-abs{position:absolute}
.tz-svg{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:visible;pointer-events:none}

/* 가상 커서(engine.css .cursor 와 같은 모양 — transition 없음) */
.tz-cur{position:absolute;left:0;top:0;width:34px;height:34px;pointer-events:none;z-index:60;opacity:0}
.tz-cur svg{width:34px;height:34px;filter:drop-shadow(0 3px 6px rgba(0,0,0,.6))}
.tz-cur .ring{position:absolute;left:-22px;top:-22px;width:44px;height:44px;border-radius:50%;border:3px solid var(--accent);opacity:0}

/* ① 심볼 · 워드마크 · 원형 펼침 · 웨이퍼 맵 */
.tz-sym{position:absolute;width:124px;height:124px}
.tz-sym svg{position:absolute;left:0;top:0;width:124px;height:124px;overflow:visible}
.tz-word{position:absolute;left:0;width:1920px;height:44px;display:flex;justify-content:center;align-items:center;
  font-family:var(--display);font-weight:800;font-stretch:75%;font-size:36px;line-height:44px;color:var(--text);white-space:pre}
.tz-word span{display:inline-block}
.tz-reveal{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden}
.tz-map{position:absolute;overflow:visible}
.tz-veil{position:absolute;left:0;top:0;width:1920px;height:1080px;
  background:linear-gradient(90deg,var(--surface) 0%,color-mix(in srgb,var(--surface) 80%,transparent) 36%,transparent 68%)}

/* 질문 · 답 */
.tz-q{position:absolute;left:0;width:1920px;text-align:center;font-size:72px;font-weight:700;line-height:1.2;letter-spacing:-.01em;color:var(--text);white-space:nowrap}
.tz-q span{display:inline-block}
/* 질문 끝 「?」 는 「왜 만들었나?」 의 「?」(900)와 같은 굵기 — 날아온 「?」 를 바꿔 낄 때 굵기가 달라 이중 「?」 로 보이지 않게(10-17 비평 T3) */
.tz-q .qm{color:var(--warn);font-weight:900}

/* ①b 로크업 · 「왜 만들었나?」 — 로크업 덩어리 가운데 y 350, 「왜 만들었나?」 가운데 y 566. 「?」 는 주황으로 크게(날아가 질문 끝에 붙는다).
   로크업 = 웹 이름(10-17 3차): 심볼 + 대표 라벨 「S.PKG CAPA」(크게 · 소스 글자 그대로 대문자) 위 / 부제 「AX Management」(대표의 .37배 · 500 굵기 · 강조색 · 대소문자 그대로) 아래 —
   덱 표지 로크업(168/62) · S12 입장 화면(100/37)과 같은 위계 */
.tz-lock{position:absolute;left:0;top:300px;width:1920px;height:100px;display:flex;justify-content:center;align-items:center;gap:24px}
.tz-lock .mk{display:block;width:92px;height:92px;flex:0 0 auto}
.tz-lock .mk svg{display:block;width:92px;height:92px}
.tz-lock .nm{display:flex;flex-direction:column;align-items:flex-start}
.tz-lock .lt{font-family:var(--display);font-weight:800;font-stretch:75%;font-size:72px;line-height:.86;letter-spacing:.01em;color:var(--text);white-space:nowrap}
.tz-lock .sb{margin:8px 0 0 3px;font-family:var(--num);font-weight:500;font-size:27px;line-height:1.1;letter-spacing:.01em;color:var(--accent);text-transform:none;white-space:nowrap}
.tz-why{position:absolute;left:0;top:513px;width:1920px;text-align:center;font-size:96px;font-weight:900;line-height:106px;letter-spacing:-.01em;color:var(--text);white-space:nowrap}
.tz-why span{display:inline-block}
.tz-why .qm{font-size:1.12em;color:var(--warn);margin-left:.04em}
.tz-a{position:absolute;left:0;width:1920px;text-align:center;font-size:58px;font-weight:700;line-height:1.2;white-space:nowrap}
.tz-a .s{color:var(--short)}
.tz-a .o{color:var(--ok)}
.tz-a .m{color:var(--muted);font-weight:500;margin:0 .3em}

/* ② CAMP 상자 · DB 원통 */
.tz-camp{position:absolute;left:810px;top:560px;width:300px;height:200px;border-radius:0 0 16px 16px;border:2px solid var(--built-line);
  background:var(--wafer);display:flex;align-items:center;justify-content:center}
.tz-camp b{font-family:var(--display);font-weight:800;font-stretch:75%;font-size:48px;letter-spacing:.06em;color:var(--text)}
.tz-lid{position:absolute;left:798px;top:534px;width:324px;height:28px;border-radius:8px;border:2px solid var(--built-line);background:var(--die-idle)}
.tz-db{position:absolute;left:875px;top:560px;width:170px;height:190px;overflow:visible}
.tz-db path,.tz-db ellipse{fill:var(--wafer);stroke:var(--accent);stroke-width:3}
.tz-db .band{fill:none}
.tz-wk{position:absolute;height:44px;border-radius:22px;border:1.5px solid var(--line);background:var(--surface);overflow:hidden}
.tz-wk span{position:absolute;left:0;top:0;width:100%;height:41px;line-height:41px;text-align:center;font-family:var(--num);font-weight:700;
  font-size:26px;color:var(--text);font-variant-numeric:tabular-nums}
.tz-ring{position:absolute;border-radius:50%;border:3px solid var(--warn);pointer-events:none}

/* ③ 기준정보 칩 · 구김 · 케이스 카운터 */
.tz-chip{position:absolute;left:0;top:0;height:44px;padding:0 14px;border-radius:10px;border:1.5px solid var(--built-line);background:var(--tip);
  font-size:24px;font-weight:700;line-height:41px;color:var(--text);white-space:nowrap;z-index:5}
.tz-cell{position:absolute;height:14px;border-radius:7px;background:var(--track)}
.tz-ball{position:absolute;left:0;top:0;width:70px;height:70px;overflow:visible}
.tz-ball path{fill:var(--die-idle);stroke:var(--muted);stroke-width:2;stroke-linejoin:round}
.tz-case{position:absolute;height:44px;display:flex;align-items:center;gap:8px}
.tz-case .box{position:relative;width:118px;height:44px;border-radius:22px;border:1.5px solid var(--warn);overflow:hidden;background:var(--surface)}
.tz-case .box span{position:absolute;left:0;top:0;width:100%;height:41px;line-height:41px;text-align:center;font-family:var(--num);font-weight:700;font-size:24px;color:var(--text)}
.tz-case .dots{font-family:var(--num);font-weight:700;font-size:28px;color:var(--muted)}

/* ③c 로컬에 갇힘(10-17 2차) — 「내 PC」 · 자물쇠 배지 · 「?」 배지(가운데 자리에 place 하고 margin 으로 반을 당긴다). 기존 구간이라 강조색을 쓰지 않는다 */
.tz-pc{position:absolute;width:240px;margin-left:-120px;text-align:center;font-size:26px;font-weight:700;line-height:34px;color:var(--muted);white-space:nowrap}
/* 자물쇠 배지 — 1080p 를 작은 화면으로 봐도 「잠김」 으로 읽히게 72px(그림 32 × 36, 10-17 비평 V5) */
.tz-lockb{position:absolute;width:72px;height:72px;margin:-36px 0 0 -36px;border-radius:50%;border:3px solid var(--warn);background:var(--surface);
  display:flex;align-items:center;justify-content:center}
.tz-lockb svg{display:block;width:32px;height:36px;fill:none;stroke:var(--warn);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.tz-qb{position:absolute;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;border:2px solid var(--warn);background:var(--surface);
  display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:700;line-height:1;color:var(--warn)}

/* ④ 플랫폼(앱 창) */
.tz-win{position:absolute;border:1.5px solid var(--built-line);border-radius:14px;background:rgba(236,236,239,.025)}
.tz-dot{position:absolute;width:12px;height:12px;border-radius:50%;background:var(--track)}
.tz-hair{position:absolute;background:var(--panel-line)}
.tz-card{position:absolute;border:1.5px solid var(--panel-line);border-radius:12px;background:rgba(15,16,19,.6)}
.tz-ct{position:absolute;font-size:28px;font-weight:700;color:var(--text);white-space:nowrap;line-height:34px}
.tz-btn{position:absolute;display:flex;align-items:center;justify-content:center;gap:12px;border:1.5px solid var(--built-line);border-radius:10px;
  background:rgba(236,236,239,.06);font-size:26px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden}
.tz-btn svg{width:28px;height:28px;flex:0 0 auto;color:var(--muted)}
.tz-btn .pg{position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--accent);transform-origin:0 50%}
.tz-list{position:absolute;border:1.5px solid var(--panel-line);border-radius:10px;overflow:hidden;background:rgba(15,16,19,.55)}
.tz-row{position:absolute;left:0;right:0}
.tz-row .rl{position:absolute;left:12px;right:12px;bottom:0;height:1px;background:rgba(236,236,239,.07)}
.tz-hl{position:absolute;left:0;right:0;background:rgba(236,236,239,.08)}
.tz-hl::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--accent)}
.tz-in{position:absolute;border:1.5px solid var(--panel-line);border-radius:10px;background:rgba(15,16,19,.55);overflow:hidden}
.tz-cnt{position:absolute;display:flex;gap:16px}
.tz-cnt span{position:relative;width:44px;height:44px;border-radius:50%;border:2px solid var(--faint);display:flex;align-items:center;justify-content:center;
  font-family:var(--num);font-weight:700;font-size:24px;color:var(--faint)}
.tz-cnt span i{position:absolute;left:-2px;top:-2px;width:44px;height:44px;border-radius:50%;background:var(--accent);opacity:0}
.tz-cnt span b{position:relative;font-weight:700}
.tz-tb{position:absolute;border:1.5px solid var(--panel-line);border-radius:8px;background:var(--wafer)}
.tz-tb svg{position:absolute;left:11px;top:50%;width:24px;height:24px;margin-top:-12px;color:var(--muted)}
.tz-tb span{position:absolute;left:46px;top:0;font-size:24px;font-weight:700;color:var(--text);white-space:nowrap}
.tz-tb.dim svg{color:var(--faint)}
.tz-n16{position:absolute;display:flex;align-items:center;height:34px;padding:0 13px;border:1.5px solid var(--line);border-radius:17px;
  background:var(--surface);font-size:22px;font-weight:700;line-height:1;color:var(--muted);white-space:nowrap}
.tz-n16b{position:absolute;display:flex;align-items:center;height:64px;padding:0 28px;border:1.5px solid var(--accent);border-radius:32px;
  background:var(--surface);font-size:40px;font-weight:700;line-height:1;color:var(--text);white-space:nowrap;z-index:6}
.tz-rev{position:absolute;height:56px;border:1.5px solid var(--built-line);border-radius:10px;background:var(--tip);box-shadow:0 8px 22px rgba(0,0,0,.45)}
.tz-rev b{position:absolute;left:18px;top:0;line-height:53px;font-family:var(--num);font-size:28px;font-weight:700;color:var(--text)}
.tz-rev .bar{position:absolute;left:70px;top:20px;width:120px}
.tz-rev .ok{position:absolute;right:14px;top:13px;width:26px;height:26px;color:var(--text)}
.tz-rev .ok svg{display:block;width:26px;height:26px}
.tz-off{position:absolute;display:flex;align-items:center;height:36px;padding:0 14px;border-radius:18px;border:1.5px solid var(--accent);
  background:var(--surface);font-size:22px;font-weight:700;color:var(--text);white-space:nowrap}

/* ⑤ 효율 표 · 고치는 칸 */
.tz-tab{position:absolute;border:1.5px solid var(--built-line);border-radius:12px;background:var(--wafer);overflow:hidden}
.tz-tab .tt{position:absolute;left:24px;top:18px;font-size:30px;font-weight:700;color:var(--text);white-space:nowrap}
.tz-tab .rk{position:absolute;left:24px;font-size:24px;font-weight:700;color:var(--text);white-space:nowrap;line-height:56px}
.tz-val{position:absolute;border:1.5px solid var(--panel-line);border-radius:10px;background:rgba(15,16,19,.55)}
.tz-val span{position:absolute;right:20px;top:0;line-height:53px;font-family:var(--num);font-size:30px;font-weight:700;color:var(--text);
  font-variant-numeric:tabular-nums;white-space:nowrap}
.tz-val span em{font-style:normal;border-radius:4px;padding:0 2px}
.tz-val span em.sel{background:rgba(236,236,239,.28)}
.tz-val i{display:inline-block;width:3px;height:32px;margin-left:3px;vertical-align:middle;position:relative;top:-3px;background:var(--accent);border-radius:1px}

/* ⑥ LOB 위 확보율 글자 */
.tz-rate{position:absolute;width:160px;height:34px;line-height:34px;text-align:center;font-family:var(--num);font-weight:700;font-size:28px;color:var(--short)}

/* ⑦ 공정 Capa 상세 */
/* 앱 화면 이름 — 머리 줄 오른쪽 끝(왼쪽은 꼭지 · 부제목) */
.tz-h1{position:absolute;font-size:34px;font-weight:700;line-height:52px;color:var(--text);white-space:nowrap}
.tz-h1s{position:absolute;font-size:26px;font-weight:500;line-height:52px;color:var(--muted);white-space:nowrap}
.tz-kpi{position:absolute;border:1.5px solid var(--panel-line);border-radius:12px;background:rgba(236,236,239,.035)}
.tz-kpi .k{position:absolute;left:22px;top:14px;font-size:22px;color:var(--muted);white-space:nowrap}
.tz-kpi .v{position:absolute;left:22px;top:44px;font-size:40px;font-weight:700;line-height:48px;color:var(--text);white-space:nowrap}
.tz-kpi .v.n{font-family:var(--num);font-variant-numeric:tabular-nums}
.tz-kpi .v.s{color:var(--short)}
.tz-kpi .v.w{color:var(--warn)}
.tz-kpi .c{position:absolute;left:22px;top:94px;font-size:22px;line-height:28px;color:var(--muted);white-space:nowrap}
.tz-cv{position:absolute;border:1.5px solid var(--built-line);border-radius:14px;background:rgba(236,236,239,.02)}
.tz-mh{position:absolute;height:48px;line-height:48px;text-align:center;font-family:var(--num);font-weight:500;font-size:24px;color:var(--muted);font-variant-numeric:tabular-nums}
.tz-lab{position:absolute;font-size:22px;color:var(--muted);white-space:nowrap;line-height:30px}
.tz-rk{position:absolute;font-size:24px;font-weight:700;color:var(--text);white-space:nowrap;line-height:44px}
.tz-jc{position:absolute;height:44px;line-height:44px;border-radius:6px;text-align:center;font-family:var(--num);font-weight:700;font-size:26px;color:var(--surface)}
.tz-av{position:absolute;height:44px;line-height:44px;text-align:center;font-family:var(--num);font-weight:500;font-size:26px;color:var(--muted);font-variant-numeric:tabular-nums}
.tz-un{position:absolute;font-size:28px;font-weight:700;color:var(--text);white-space:nowrap;line-height:34px}
.tz-ud{position:absolute;font-family:var(--num);font-weight:500;font-size:22px;color:var(--muted);white-space:nowrap;line-height:28px}
.tz-dd{position:absolute;font-size:26px;font-weight:700;color:var(--text);white-space:nowrap;line-height:34px;padding:0 6px;border-radius:6px;background:var(--surface)}
.tz-dd.old{color:var(--faint)}
.tz-leg{position:absolute;font-size:22px;color:var(--muted);white-space:nowrap;line-height:30px}
.tz-pill{position:absolute;height:32px;line-height:32px;padding:0 12px;border-radius:16px;font-size:22px;font-weight:700;color:var(--surface);white-space:nowrap}
.tz-up{position:absolute;display:flex;align-items:center;gap:10px;height:48px;padding:0 18px;border-radius:24px;border:1.5px solid var(--accent);
  background:var(--surface);font-family:var(--num);font-size:26px;font-weight:700;color:var(--text);white-space:nowrap;font-variant-numeric:tabular-nums}
.tz-up svg{width:24px;height:24px;color:var(--accent)}
.tz-cut{position:absolute;height:40px;line-height:37px;padding:0 16px;border-radius:20px;border:1.5px solid var(--accent);background:var(--surface);
  font-size:24px;font-weight:700;color:var(--text);white-space:nowrap}
.tz-band{position:absolute;background:var(--short);opacity:.08}
.tz-scan{position:absolute;background:var(--accent);opacity:0;border-radius:6px}

/* ⑨ AI 층(점선 = 설계) */
.tz-layerai{position:absolute;border:2px dashed var(--designed-line);border-radius:18px;background:rgba(236,236,239,.015)}
.tz-ai{position:absolute;width:96px;height:96px;margin:-48px 0 0 -48px;border-radius:50%;border:2px dashed var(--designed-line);background:var(--surface);
  display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:800;font-stretch:75%;font-size:32px;letter-spacing:.06em;color:var(--muted)}
.tz-bub{position:absolute;height:60px;display:flex;align-items:center;padding:0 24px;border-radius:30px 30px 30px 8px;border:1.5px solid var(--line);
  background:var(--wafer);font-size:30px;font-weight:700;color:var(--text);white-space:nowrap}
.tz-bub i{display:inline-block;width:3px;height:32px;margin-left:4px;background:var(--accent);border-radius:1px}
.tz-ans{position:absolute;border:1.5px solid var(--built-line);border-radius:14px;background:var(--wafer)}
.tz-al{position:absolute;font-size:24px;font-weight:700;color:var(--muted);white-space:nowrap;line-height:40px}
.tz-at{position:absolute;font-size:34px;font-weight:700;color:var(--text);white-space:nowrap;line-height:44px}
.tz-at .s{color:var(--short)}
.tz-slot{position:absolute;height:48px;border-radius:24px;border:1.5px dashed var(--designed-line);opacity:.5}
.tz-ev{position:absolute;left:0;top:0;height:48px;padding:0 20px;border-radius:24px;border:1.5px dashed var(--designed-line);background:var(--surface);
  font-size:26px;font-weight:700;line-height:45px;color:var(--text);white-space:nowrap;font-variant-numeric:tabular-nums;z-index:4}

/* ⑩ 입장 화면(s12_close.js 의 .s12-* 와 같은 값) */
.tz-entry{position:absolute;left:0;top:0;width:1920px;height:1080px;z-index:4;pointer-events:none;color:var(--text)}
.tz-head{position:absolute;display:flex;align-items:center;gap:14px;height:40px}
.tz-head .lg{display:block;width:40px;height:40px;flex:0 0 auto}
.tz-head .lg svg{display:block;width:40px;height:40px}
.tz-head .br{font-family:var(--display);font-weight:800;font-stretch:75%;font-size:24px;letter-spacing:.03em;line-height:1;white-space:nowrap}
.tz-main{position:absolute;display:flex;flex-direction:column;gap:20px;width:700px}
/* 제목 = 웹 이름(10-17 3차, s12_close.js 와 같은 값) — 대표 라벨 「S.PKG CAPA」 는 소스 글자 그대로 대문자(text-transform 없음), 부제 「AX Management」 는 대소문자 그대로 */
.tz-main .tt{margin:0;font-family:var(--display);font-weight:800;font-stretch:75%;font-size:100px;line-height:.86;letter-spacing:0;white-space:nowrap}
.tz-main .sb{margin:-6px 0 0 3px;font-family:var(--num);font-weight:500;font-size:37px;line-height:1.1;letter-spacing:.01em;color:var(--accent);
  text-transform:none;white-space:nowrap}
.tz-main .gp{height:29px}
.tz-main .ld{display:flex;flex-direction:column;gap:10px;width:560px}
.tz-main .st{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;margin:0;padding:0;list-style:none}
.tz-main .tk{position:relative;display:block;height:4px;border-radius:2px;background:var(--track);overflow:hidden}
.tz-main .tk i{position:absolute;left:0;top:0;width:100%;height:100%;background:var(--accent)}
.tz-main .ok{margin:0;font-size:22px;font-weight:500;line-height:1.45;color:var(--text)}
.tz-main .ac{display:flex;align-items:center;gap:14px}
.tz-eb{display:inline-flex;align-items:center;justify-content:center;box-sizing:border-box;min-width:172px;height:60px;padding:0 34px;border-radius:999px;
  font-family:var(--display);font-weight:800;font-stretch:75%;font-size:24px;letter-spacing:.03em;line-height:1;white-space:nowrap}
.tz-eb.dt{background:var(--text);color:var(--surface)}
.tz-eb.sm{border:1.5px solid var(--built-line);color:var(--text)}

/* ⑩b 다리(10-17 3차) — 영상에서 본 화면 카드 여섯(축소 그림 + 이름표 24px) · ✓ 원 · 문구. 구현 = 실선 카드(바탕 --wafer), AI = 점선 카드(바탕 --surface, 이름표 흐리게) */
.tz-fc{position:absolute;box-sizing:border-box;border:1.5px solid var(--built-line);border-radius:14px;background:var(--wafer)}
.tz-fc.ai{border:2px dashed var(--designed-line);background:var(--surface)}
.tz-fc .pic{position:absolute;left:21px;top:16px;width:220px;height:132px;overflow:visible}
.tz-fc .nm{position:absolute;left:0;right:0;top:166px;height:36px;line-height:36px;text-align:center;font-size:24px;font-weight:700;color:var(--text);white-space:nowrap}
.tz-fc.ai .nm{color:var(--muted)}
/* ✓ 원 — 카드 오른쪽 위 모서리에 걸친다(바탕색 4px 테로 카드 테두리와 떼어 낸다). AI 카드는 체크 없는 빈 점선 원 */
.tz-ck{position:absolute;right:-12px;top:-12px;width:44px;height:44px;box-sizing:border-box;border-radius:50%;background:var(--accent);
  box-shadow:0 0 0 4px var(--surface);display:flex;align-items:center;justify-content:center}
.tz-ck svg{display:block;width:26px;height:26px;overflow:visible}
.tz-ck svg path{fill:none;stroke:var(--surface);stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
/* AI 카드의 「아직」 — ✓ 원과 같은 44px 자리에 --muted 3px 점선(바탕 대비 약 7:1 — 3차 비평 V1, 전에는 --designed-line 2px 로 3.6:1. Chrome 은 2.5px 를 2px 로 내린다) */
.tz-ck.ai{background:var(--surface);border:3px dashed var(--muted)}
.tz-fin{position:absolute;left:0;top:708px;width:1920px;text-align:center;font-size:60px;font-weight:700;line-height:72px;letter-spacing:-.01em;color:var(--text);white-space:nowrap}
.tz-fin .ax{color:var(--accent)}

/* ⑥ 결합 — 모인 점(→ LOB 상자로 펼쳐진다) */
.tz-seed{position:absolute;box-sizing:border-box;border:2px solid var(--built-line);background:var(--wafer);display:flex;align-items:center;justify-content:center;overflow:hidden}
.tz-seedtx{font-size:24px;font-weight:900;letter-spacing:.04em;line-height:1;color:var(--surface);white-space:nowrap}

/* 꼭지 · 부제목(머리 줄 — 덱 .hd 자리 120 · 84). 색 · 모양은 teaser.js 가 타임라인으로 바꾼다(기존 회색 각진 테두리 → 개선 강조색 채움 알약 → 확산 · AX 점선) */
.tz-hd{position:absolute;left:120px;top:84px;width:1680px;height:56px;z-index:20;pointer-events:none}
.tz-kp{position:absolute;left:0;top:0;height:56px;box-sizing:border-box;border:2px solid var(--muted);border-radius:8px;overflow:hidden;color:var(--text)}
.tz-kp .sy,.tz-kp .tx{position:absolute;left:20px;top:0;height:52px;display:flex;font-size:32px;font-weight:700;line-height:52px;letter-spacing:.04em;white-space:nowrap}
/* 음절 칸 — 알약 안쪽보다 낮게 잘라(높이 40 · 위 6) 넘어가는 글자가 둥근 테두리 밖으로 나오지 않게. 글자색은 음절마다 고정(나가는 .a 흰 · 들어오는 .b 어두운) */
.tz-kp .sl{position:relative;display:block;height:40px;margin-top:6px;overflow:hidden}
.tz-kp .sl .a{display:block;line-height:40px;color:var(--text)}
.tz-kp .sl .b{position:absolute;left:0;top:0;display:block;line-height:40px;color:var(--surface)}
.tz-st{position:absolute;left:0;top:0;height:56px}
.tz-st span{position:absolute;left:0;top:0;font-size:42px;font-weight:700;line-height:56px;letter-spacing:-.01em;color:var(--text);white-space:nowrap}

/* 전역 샘플 배지 자리 */
.tz-sample{position:absolute;top:36px;right:120px;z-index:30}

/* 재생 화면(무대 밖 덮개) — 버튼 · 안내. 캡처(?capture)에서는 쓰지 않는다 */
#tz-ui{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;
  background:rgba(0,0,0,.35);font-family:var(--sans);color:var(--text)}
#tz-ui[hidden]{display:none}
#tz-ui .lg{width:72px;height:72px}
#tz-ui .lg svg{display:block;width:72px;height:72px}
#tz-ui button{display:inline-flex;align-items:center;gap:14px;height:64px;padding:0 36px;border-radius:999px;border:0;cursor:pointer;
  background:var(--text);color:var(--surface);font:700 26px var(--sans)}
#tz-ui button svg{width:22px;height:22px}
/* 재생 속도(1 · 0.75 · 0.5) — 고른 것이 밝아진다. 재생 중에는 S 키로 돌린다 */
#tz-ui .sp{display:flex;align-items:center;gap:8px;font:500 16px var(--sans);color:var(--muted)}
#tz-ui .sp span{margin-right:6px}
#tz-ui .sp button{height:38px;min-width:76px;padding:0 16px;gap:0;justify-content:center;border-radius:999px;font:500 17px var(--sans);
  background:transparent;color:var(--muted);box-shadow:inset 0 0 0 1px rgba(236,236,239,.24)}
#tz-ui .sp button:hover{color:var(--text);box-shadow:inset 0 0 0 1px rgba(236,236,239,.5)}
#tz-ui .sp button.on{background:var(--text);color:var(--surface);font-weight:700;box-shadow:none}
#tz-ui p{margin:0;font-size:16px;color:var(--muted)}
#tz-hud{position:fixed;right:16px;bottom:14px;z-index:99;font:500 13px/1.4 var(--sans);color:var(--muted);background:rgba(15,16,19,.85);
  border:1px solid rgba(236,236,239,.16);border-radius:6px;padding:6px 10px;opacity:0;pointer-events:none}

</style>
</head>
<body>
<div id="viewport"><div id="stage"></div></div>
<div id="tz-ui" hidden><span class="lg"><svg viewBox="0 0 100 100" aria-hidden="true" style="overflow:visible"><path d="M83.59 26.48 A41 41 0 1 0 83.59 73.52" style="fill:none;stroke:var(--text);stroke-width:9;stroke-linecap:round"/><rect x="28" y="28" width="12" height="12" rx="2" style="fill:var(--accent)"/><rect x="44" y="28" width="12" height="12" rx="2" style="fill:var(--accent)"/><rect x="60" y="28" width="12" height="12" rx="2" style="fill:var(--accent)"/><rect x="28" y="44" width="12" height="12" rx="2" style="fill:var(--accent)"/><rect x="44" y="44" width="12" height="12" rx="2" style="fill:var(--warn)"/><rect x="60" y="44" width="12" height="12" rx="2" style="fill:var(--accent)"/><rect x="28" y="60" width="12" height="12" rx="2" style="fill:var(--accent)"/><rect x="44" y="60" width="12" height="12" rx="2" style="fill:var(--accent)"/><rect x="60" y="60" width="12" height="12" rx="2" style="fill:var(--accent)"/></svg></span><button type="button" class="go"><svg viewBox="0 0 24 24"><path d="M7 4.5v15l12-7.5z" style="fill:currentColor"/></svg>재생</button><div class="sp" role="group" aria-label="재생 속도"><span>속도</span><button type="button" data-rate="1">1×</button><button type="button" data-rate="0.75">0.75×</button><button type="button" data-rate="0.5">0.5×</button></div><p>Space 멈춤·이어 재생 · R 처음부터 · M 소리 끄기·켜기 · S 속도</p></div>

  const FLOW = [{ t: "소요대수", icon: ICON.equip }, { t: "확보율", icon: ICON.gauge }, { t: "B/N 공정", icon: ICON.neck }];

  // 계산 흐름 노드 하나(원 + 아이콘). S3 의 큰 노드(반지름 56)는 서식 그대로, 작은 노드는 아이콘을 지름의 54%로 줄인다.
  function flowNode(ctx, i, cx, cy, r, parent) {
    const n = pos(ctx.el("div", "pt-node", FLOW[i].icon, parent), cx - r, cy - r, r * 2, r * 2);
    if (r !== 56) {
      const s = n.firstChild;
      s.style.width = s.style.height = Math.round(r * 2 * .54) + "px";
      n.style.borderWidth = r < 30 ? "1.5px" : "2px";

  }

  // ---------------------------------------------------------------- S3 격자의 왼쪽(단 0–2) 자리
  // 「시나리오」 상자 492–684 · 이름 선택 상자 552–608(S3 목록에서 고른 줄 · 이름 칸과 같은 높이라 이름이 수평으로 날아간다)
  // · 리비전 선택 상자 620–668 · 드롭다운 614–826 · 카드 밑 단추 760–816(S4 「신규 리비전 저장」 — 글자는 장면이 btn 으로 준다)
  const R = {
    SB: { x: 140, y: 492, w: 362, h: 192 },
    SEL: { x: 154, y: 552, w: 334, h: 56 },
    RSEL: { x: 154, y: 620, w: 334, h: 48 },
    POP: { x: 154, y: 614, w: 334, row: 50, n: 4, pad: 6 },
    BTN: { x: 140, y: 760, w: 362, h: 56 },

  // ---------------------------------------------------------------- 고치는 칸(타자)
  // 타자는 미리 만든 글자 프레임 중 하나를 proxy 인덱스로 고른다(결정론적 · 되감기 안전).
  function Edit(ctx, o) {
    o = o || {};
    const h = o.h || 56;
    const box = pos(ctx.el("div", "pt-in", null, o.parent), o.x, o.y, o.w, h);
    const ph = pos(ctx.el("span", "ph", null, box), 18, null, o.ph == null ? 236 : o.ph);
    const v = ctx.el("span", "v n" + (o.num ? " num" : ""),
      "<span class=\"tx\"></span><span class=\"cw\"><i></i></span>" + (o.suffix ? "<span class=\"sfx\">" + o.suffix + "</span>" : ""), box);
    const tx = v.querySelector(".tx"), caret = v.querySelector(".cw"), caretI = caret.firstChild, sfx = v.querySelector(".sfx");
    tx.textContent = o.value || "";
    const pen = o.pen === false ? null : ctx.el("span", "pen", ICON.pen, box);
    // 단위(%)가 붙는 칸은 커서가 자리를 차지하지 않게 고칠 때만 세운다(「84%」 사이가 벌어지지 않게)
    if (sfx) caret.style.display = "none";
    const frames = [{ t: o.value || "", sel: false }];
    const typ = { i: 0 };
    const last = () => frames[frames.length - 1].t;
    function show() {
      const f = frames[Math.max(0, Math.min(frames.length - 1, Math.round(typ.i)))];
      if (tx.textContent !== f.t) tx.textContent = f.t;
      tx.classList.toggle("sel", f.sel);
      caret.style.visibility = f.sel ? "hidden" : "";          // 글자를 고른 동안은 커서를 감춘다
    }
    return {
      box, ph, v, tx, caret, caretI, pen, sfx, frames,
      // 전체 선택 · 지움 · 다른 부분만 지움 · 친다 — 마지막 프레임 번호를 돌려준다
      sel() { frames.push({ t: last(), sel: true }); return frames.length - 1; },
      clear() { frames.push({ t: "", sel: false }); return frames.length - 1; },
      back(text) {
        const cur = last();
        let c = 0;
        while (c < cur.length && c < text.length && cur[c] === text[c]) c++;
        for (let k = cur.length - 1; k >= c; k--) frames.push({ t: cur.slice(0, k), sel: false });
        return frames.length - 1;
      },
      type(text) {
        const cur = last();
        for (let k = cur.length + 1; k <= text.length; k++) frames.push({ t: text.slice(0, k), sel: false });
        return frames.length - 1;
      },
      play(tl, a, b, at, dur) {
        return tl.fromTo(typ, { i: a }, { i: b, duration: dur, ease: "none", immediateRender: false, lazy: false, onUpdate: show }, at);
      },
      // 고치는 칸이 된다 — 초점 테두리 · 빛 · 연필 · 글자 커서(치는 동안은 깜빡이지 않게 hold 로 멈춘다)
      focus(tl, at) {
        tl.to(box, { borderColor: tok("--accent"), boxShadow: GLOW.on, duration: .25, ease: "power2.out" }, at);
        if (pen) tl.to(pen, { color: tok("--accent"), duration: .25 }, at);
        if (sfx) tl.set(caret, { display: "inline-block" }, at);
        tl.fromTo(caret, { opacity: 0 }, { opacity: 1, duration: .1, immediateRender: false }, at + .05);
      },
      hold(tl, at, on) { tl.set(caretI, { animationName: on ? "none" : "pt-blink" }, at); },
      blur(tl, at, line) {
        tl.to(box, { borderColor: line || tok("--built-line"), boxShadow: GLOW.off, duration: .25 }, at);
        if (pen) tl.to(pen, { color: tok("--muted"), duration: .25 }, at);
        tl.to(caret, { opacity: 0, duration: .1 }, at);
        if (sfx) tl.set(caret, { display: "none" }, at + .1);
      },
    };
  }

  // ---------------------------------------------------------------- 왼쪽 「시나리오」 카드
  // 앱 사이드바 「시나리오·리비전」(scenario_status.py — 시나리오 · 리비전 선택 상자 둘)을 줄인 것. 이름은 sample_world scenario.name.
  function Side(ctx, o) {
    o = o || {};
    const P = o.parent;
    const box = pos(ctx.el("div", "pt-box", null, P), R.SB.x, R.SB.y, R.SB.w, R.SB.h);
    box.style.background = "rgba(236,236,239,.03)";
    const bar = pos(ctx.el("span", "bar dim", null, P), R.SB.x + 18, R.SB.y + 22, 128, 14);
    const title = pos(ctx.el("div", "pt-bt", ICON.layers + "<span>시나리오</span>", P), R.SB.x + 16, R.SB.y + 12);
    // 선택 상자 둘 — 저장 전에는 회색 막대, 저장하면 이름 · r1
    const sel = pos(ctx.el("div", "pt-sel", null, P), R.SEL.x, R.SEL.y, R.SEL.w, R.SEL.h);
    const selPh = pos(ctx.el("span", "ph", null, sel), 18, null, 168);
    const selName = ctx.el("span", "n", o.name || "", sel);
    const selChev = ctx.el("span", "chev", ICON.chev, sel);
    const rsel = pos(ctx.el("div", "pt-sel", null, P), R.RSEL.x, R.RSEL.y, R.RSEL.w, R.RSEL.h);
    const rselPh = pos(ctx.el("span", "ph", null, rsel), 18, null, 92);
    const rselTxt = ctx.el("span", "r", o.rev || "", rsel);
    const rselChev = ctx.el("span", "chev", ICON.chev, rsel);
    const check = pos(ctx.el("span", "pt-ok", ICON.check, P), R.SEL.x + R.SEL.w - 20, R.SEL.y - 18, 36, 36);
    const api = { box, bar, title, sel, selPh, selName, selChev, rsel, rselPh, rselTxt, rselChev, check, R };
    // 드롭다운 — 맨 위가 방금 만든 시나리오, 나머지는 약식(회색 막대)
    if (o.pop) {
      const PP = R.POP;
      const pop = pos(ctx.el("div", "pt-pop", null, P), PP.x, PP.y, PP.w, PP.pad * 2 + PP.n * PP.row + 3);
      const popHl = pos(ctx.el("span", "pt-ohl", null, pop), 6, PP.pad + 3, PP.w - 15, PP.row - 6);
      const OPT_W = [0, 172, 128, 204];
      for (let k = 0; k < PP.n; k++) {
        const op = pos(ctx.el("div", "pt-opt", null, pop), 0, PP.pad + k * PP.row, PP.w - 3, PP.row);
        if (k === 0) {
          ctx.el("span", "n", o.name || "", op);
          ctx.el("span", "ck", ICON.check, op);
        } else {
          pos(ctx.el("span", "bar", null, op), 18, 18, OPT_W[k], 14);
        }
      }
      api.pop = pop;
      api.popHl = popHl;
      api.optMid = (k) => PP.y + 1.5 + PP.pad + k * PP.row + PP.row / 2;
    }
    if (o.btn) api.btn = Button(ctx, Object.assign({ text: o.btn, parent: P }, R.BTN));
    return api;
  }
  // 저장 비행 — S3 「시나리오 저장」의 곡선(io). 준 값만 옮긴다(S3 는 왼쪽 · 폭만 — 수평 비행).
  Side.fly = function (tl, el, to, at, dur) {
    const v = { duration: dur, ease: eases().io };
    if (to.x != null) v.left = to.x;
    if (to.y != null) v.top = to.y;
    if (to.w != null) v.width = to.w;
    if (to.h != null) v.height = to.h;
    return tl.to(el, v, at);
  };
  Side.ghost = function (ctx, text, r, parent) {
    return pos(ctx.el("div", "pt-ghost", "<span class=\"n\">" + text + "</span>", parent), r.x, r.y, r.w, r.h);
  };

  // ---------------------------------------------------------------- 단추 · 눌림
  function Button(ctx, o) {
    const ico = o.icon === false ? "" : "<span class=\"ico\">" + (o.icon || ICON.cloud) + (o.spin === false ? "" : ICON.spin) + "</span>";
    const el = pos(ctx.el("div", "pt-btn", ico + (o.text ? "<span>" + o.text + "</span>" : "") + "<i class=\"pg\"></i>", o.parent), o.x, o.y, o.w, o.h);
    const svgs = el.querySelectorAll(".ico svg");
    return { el, cloud: svgs[0] || null, spin: svgs[1] || null, pg: el.querySelector(".pg") };
  }
  // 단추 눌림 — 테두리가 잠깐 청록이 됐다 돌아온다(fromTo 를 쓰면 시작 전에도 청록으로 그려진다)
  function press(tl, btn, at) {
    tl.to(btn, { borderColor: tok("--accent"), duration: .08 }, at);
    tl.to(btn, { scale: .97, duration: .09, yoyo: true, repeat: 1, ease: "power1.inOut" }, at);
    tl.to(btn, { borderColor: tok("--built-line"), duration: .45, ease: "power2.out" }, at + .14);
  }

  // ---------------------------------------------------------------- 레인 이름 두 벌(sample_world.json 「lanes」)
  // 데이터가 정본이다. src/sample_world.js 가 아직 다시 만들어지지 않았으면(build.py 전) 같은 글자의 대비값을 쓰고 한 번 알린다.
  const LANES_FALLBACK = {
    before: ["옮김", "표 나누기", "산출", "검증", "LOB 작성"],
    after: ["DB 선택", "표 분류", "산출", "결과", "LOB"],
  };
  let lanesWarned = false;
  function lanes(ctx) {
    const L = (ctx && ctx.D ? ctx.D : window.SAMPLE || {}).lanes;
    if (L && Array.isArray(L.before) && Array.isArray(L.after)) return { before: L.before.slice(), after: L.after.slice() };
    if (!lanesWarned) {
      lanesWarned = true;
      console.warn("Parts.lanes: SAMPLE.lanes 가 없다 — build/build.py 로 src/sample_world.js 를 다시 만든다(지금은 대비값)");
    }
    return { before: LANES_FALLBACK.before.slice(), after: LANES_FALLBACK.after.slice() };
  }

  // ---------------------------------------------------------------- 추적 표시
  function Track(ctx, o) {
    o = o || {};
    const names = o.names || lanes(ctx).after;
    const conns = [];
    let el, steps;
    if (o.layout === "lane") {
      const size = o.size || 30, dot = Math.round(size * .4);
      el = ctx.el("div", "pt-trk lane", null, o.parent);
      const xs = o.xs;
      const gap = size / 2 + 8;
      const ends = xs.map((x, i) => [x + gap, i < xs.length - 1 ? xs[i + 1] - gap : (o.end == null ? x + gap : o.end)]);
      ends.forEach(([a, b], i) => {
        if (b <= a) return;
        const c = pos(ctx.el("div", "pt-lconn", "<i></i>", el), a, o.y, b - a);
        conns[i] = c.firstChild;
      });
      steps = names.map((name, i) => {
        const st = pos(ctx.el("div", "pt-lstep", "<span class=\"pt-ring\"><i></i></span><span class=\"pt-sl\">" + name + "</span>", el), xs[i], o.y);
        const ring = st.querySelector(".pt-ring");
        pos(ring, -size / 2, -size / 2, size, size);
        const d = ring.firstChild;
        d.style.width = d.style.height = dot + "px";
        const label = st.querySelector(".pt-sl");
        label.style.top = (size / 2 + 6) + "px";
        return { el: st, ring, dot: d, label };
      });
      // lane 은 잇는 선이 고리 앞에 있다: conns[k-1] = 고리 k-1 → k, conns[n-1] = 마지막 고리 → end
      const light = (tl, k, at) => {
        const OUT = eases().out;
        if (k > 0 && conns[k - 1]) tl.fromTo(conns[k - 1], { scaleX: 0 }, { scaleX: 1, duration: .3, ease: OUT, immediateRender: false }, at - .12);
        if (!steps[k]) return;
        tl.to(steps[k].ring, { borderColor: tok("--accent"), duration: .25, ease: "power2.out" }, at);
        tl.fromTo(steps[k].dot, { opacity: 0, scale: .3 }, { opacity: 1, scale: 1, duration: .35, ease: OUT, immediateRender: false }, at);
        tl.to(steps[k].label, { color: tok("--text"), duration: .25 }, at);
      };
      return { el, steps, conns, light };
    }
    // row — S3 머리 오른쪽(배지 줄과 가운데를 맞춘다)
    el = ctx.el("div", "pt-trk", null, o.parent);
    if (o.right != null) el.style.right = o.right + "px";
    if (o.left != null) el.style.left = o.left + "px";
    if (o.top != null) el.style.top = o.top + "px";
    steps = names.map((name, i) => {
      if (i) conns.push(ctx.el("div", "pt-conn", "<i></i>", el).firstChild);
      const st = ctx.el("div", "pt-step", "<span class=\"pt-ring\"><i></i></span><span class=\"pt-sl\">" + name + "</span>", el);
      return { el: st, ring: st.querySelector(".pt-ring"), dot: st.querySelector(".pt-ring i"), label: st.querySelector(".pt-sl") };
    });
    // 한 칸에 불을 켠다 — 고리 선과 잇는 선만 청록, 가운데 점은 잉크
    const light = (tl, k, at) => {
      const OUT = eases().out;
      if (k > 0) tl.fromTo(conns[k - 1], { scaleX: 0 }, { scaleX: 1, duration: .4, ease: OUT }, at - .12);
      tl.to(steps[k].ring, { borderColor: tok("--accent"), duration: .3, ease: "power2.out" }, at);
      tl.fromTo(steps[k].dot, { opacity: 0, scale: .3 }, { opacity: 1, scale: 1, duration: .4, ease: OUT }, at);
      tl.to(steps[k].label, { color: tok("--text"), duration: .3 }, at);
    };
    return { el, steps, conns, light };
  }

  // ---------------------------------------------------------------- 레인(S1 다섯 칸 + 사본 더미) — 다 지나온 상태로 선다
  function Lane(ctx, o) {
    const el = ctx.el("div", "pt-lane", null, o.parent);
    const svg = ctx.svg("svg", { viewBox: "0 0 1920 1080" }, el);
    const base = ctx.svg("path", { class: "base", d: "M" + o.x0 + " " + o.y + "H" + o.x1 }, svg);
    const ink = ctx.svg("path", { class: "ink", d: "M" + o.x0 + " " + o.y + "H" + o.x1 }, svg);
    const dots = o.xs.map((x) => pos(ctx.el("div", "pt-dot", "<i></i>", el), x, o.y));
    const names = o.names || lanes(ctx).before;
    const labels = o.xs.map((x, i) => pos(ctx.el("div", "pt-dl", names[i] || "", el), x, o.y + 26));
    if (o.dim) labels.forEach((l) => { l.style.color = "var(--faint)"; });
    const P = o.pile || {};
    const files = (o.files || []).map((name, k) => {
      const c = pos(ctx.el("div", "pt-file", ICON.file + "<span>" + name + "</span>", el), P.x + (P.dx || 10) * k, P.y + (P.dy || 0) * k);
      c.style.zIndex = k + 1;
      return c;
    });
    return { el, svg, base, ink, dots, labels, files };
  }

  // ---------------------------------------------------------------- 관문
  function Gate(ctx, o) {
    const el = pos(ctx.el("div", "pt-gate" + (o.dash ? " dash" : ""), "<i class=\"cap t\"></i><i class=\"ln\"></i><i class=\"cap b\"></i>", o.parent), o.x - 12, o.y, 24, o.h);
    const ln = el.querySelector(".ln"), caps = el.querySelectorAll(".cap");
    const lineColor = o.dash ? tok("--designed-line") : tok("--built-line");
    return {
      el, ln, caps,
      // 선다 — 기둥이 벌어지고 선이 가운데서 위아래로 자란다
      stand(tl, at, dur) {
        dur = dur || .2;
        tl.fromTo(el, { autoAlpha: 0, x: 0 }, { autoAlpha: 1, x: 0, duration: dur * .6, immediateRender: false }, at);
        tl.fromTo(caps, { scaleX: 0 }, { scaleX: 1, duration: dur, ease: "power2.out", immediateRender: false }, at);
        tl.fromTo(ln, { scaleY: 0 }, { scaleY: 1, duration: dur, ease: "power2.out", immediateRender: false }, at);
        return at + dur;
      },
      // 통과 — 선이 강조색으로 켜지고 대상 위를 toX 까지 훑고 지나간다
      pass(tl, at, toX, dur) {
        dur = dur || .4;
        const acc = tok("--accent");
        tl.to([ln].concat([...caps]), o.dash ? { borderColor: acc, duration: .1 } : { backgroundColor: acc, duration: .1 }, at);
        tl.to(el, { x: toX - o.x, duration: dur, ease: "power2.inOut" }, at + .05);
        return at + .05 + dur;
      },
      // 막힘 — 부족색으로 번쩍이고 한 번 흔들린다(대상을 튕기는 것은 장면이 그린다)
      block(tl, at) {
        const sh = tok("--short");
        const prop = o.dash ? "borderColor" : "backgroundColor";
        tl.to([ln].concat([...caps]), { [prop]: sh, duration: .08 }, at);
        tl.to(el, { x: 6, duration: .06, yoyo: true, repeat: 3, ease: "power1.inOut" }, at);
        tl.to([ln].concat([...caps]), { [prop]: lineColor, duration: .4 }, at + .35);
        return at + .75;
      },
      out(tl, at, dur) { tl.to(el, { autoAlpha: 0, duration: dur || .25 }, at); },
    };
  }

  // ---------------------------------------------------------------- 도장
  function Stamp(ctx, o) {
    const el = ctx.el("div", "pt-stamp", null, o.parent);
    const nm = ctx.el("div", "nm", o.name || "", el);
    const face = ctx.el("div", "face", o.text || "", el);
    // 폭 · 높이를 재서 가운데를 (cx, cy) — 도장 면의 가운데 — 에 맞춘다
    const w = el.offsetWidth, fh = face.offsetHeight, nh = nm.offsetHeight + 14;
    pos(el, Math.round(o.cx - w / 2), Math.round(o.cy - fh / 2 - nh));
    gsap.set(face, { rotation: o.rot == null ? -3 : o.rot, transformOrigin: "50% 50%" });
    return {
      el, face, nm,
      hit(tl, at) {
        tl.fromTo(face, { opacity: 0, scale: 1.16 }, { opacity: 1, scale: 1, duration: .3, ease: "power3.in", immediateRender: false }, at);
        tl.fromTo(face, { y: 0 }, { y: 2, duration: .06, yoyo: true, repeat: 1, ease: "power1.out", immediateRender: false }, at + .3);
        tl.fromTo(nm, { opacity: 0, y: 6 }, { opacity: 1, y: 0, duration: .2, ease: "power2.out", immediateRender: false }, at + .32);
        return at + .52;
      },
    };
  }

  // ---------------------------------------------------------------- 잉크 고리
  function Ring(ctx, r, o) {
    o = o || {};
    const pad = o.pad == null ? 6 : o.pad;
    const el = pos(ctx.el("div", "pt-ink", null, o.parent), r.x - pad, r.y - pad, r.w + pad * 2, r.h + pad * 2);
    return {
      el, pad, rect: r,
      // 그어진다 — 조금 큰 고리가 칸에 내려앉는다(S6 모눈 고리와 같은 들임)
      draw(tl, at, dur) {
        tl.fromTo(el, { autoAlpha: 0, scale: 1.12 }, { autoAlpha: 1, scale: 1, duration: dur || .3, ease: eases().out, immediateRender: false }, at);
      },
      to(tl, r2, at, dur) {
        tl.to(el, { left: r2.x - pad, top: r2.y - pad, width: r2.w + pad * 2, height: r2.h + pad * 2, duration: dur, ease: "power2.inOut" }, at);
      },
    };
  }

  window.Parts = { E, eases, tok, GLOW, pos, ICON, FLOW, flowNode, R, Edit, Side, Button, press, lanes, Track, Lane, Gate, Stamp, Ring };
})();

</script>
<script>
// LOB Summary 도식 — 앱 입장 화면 Summary(공식버전 요약)의 구조만 그린 결정론적 블록 도식. 2막의 「한 판」이다:
// S3 끝(r1 · 전폭) → S4(가운데 열 · 서랍 · r2 · 공식버전) → S5(미니 카드) → S6(미니에서 box 로 커져 모눈)까지 persist 「lob」 하나로 이어진다.
//
//   ┌ LOB Summary ──────────────────────────── [샘플 데이터] ┐
//   │            26.10  26.11  26.12  27.01  27.02  27.03  │   월 6개(열)
//   │ 생산계획     ●──────●──────●──────●──────●──────●       │   선(Density) — 숫자 없이 모양만
//   │ B/N 확보율   ▇      ▇      ▆      ▇      ▇      ▇        │   달마다 B/N 공정(그 달 가장 낮은 칸)의 확보율 막대 · 판정색
//   │                           최저 | 부족 2대              │   r1 = 「최저」(부족한 달이 없다) · r2 = 「부족 N대」(숫자 글자는 이것 하나)
//   │ 제품 비중    ◯      ◯      ◯      ◯      ◯      ◯        │   월별 제품 비중 도넛 — 무채색
//   └───────────────────────────────────────────────────────┘
//
// 값은 sample_world.json summary(density_억Gb · bn · bn_r1 · lowest_r1 · mix_wafer기준 · months)와 home_heatmap(서랍 칸)에서만 읽는다.
// 자리는 이 파일의 상수로만 정한다 — 장면을 넘어 이어질 때 한 픽셀이라도 다르면 깜빡이므로 장면은 자리를 고치지 않는다.
// 구조: root(persist) ⊃ body(상자 · 글자 · 선 · 막대 · 도넛 — 무대 좌표, 한 변환으로 통째로 줄고 늘어난다) + ov(겹 — 줄지 않는 24px 글자 ·
// 서랍 · 칩 · 고리 · 미니 머리). body 가 변환 없음(s3)이면 모든 조각이 무대 좌표 그대로라 S6 가 막대 · 상자를 바로 모눈 칸으로 옮긴다.
//
// ── API ────────────────────────────────────────────────────────────────────────────────────────────────
//   LOB.POS = { s3:{x:420,y:330,s:1}, s4:{x:546,y:426,s:.635}, s5mini:{x:560,y:712,s:.222} }   변환 원점 = 상자 왼쪽 위
//   LOB.rectAt(pos) → 상자 사각형 · LOB.at(pos, x, y) → body 좌표의 무대 자리 · LOB.thread(D) → 이야기의 칸 {name, month, i, row}
//   LOB.draw(ctx, parent, {persist, sample, rev:"r1"|"r2"(기본 r2), label}) → lob
//   LOB.reveal(tl, lob, at) → 끝 시각                         S3 b7 — 상자 → 월 → 선 → 막대 → 「최저」/「부족 N대」 → 도넛
//   LOB.stand(ctx, tl, lob) → 선 시각                         S6 b0 — 앞 장면을 보고 이어받는다: S5 에서 왔으면 미니(시간 0 그대로) → box 로 0.6초
//                                                              (0.1~0.7, 글자 · 선 · 도넛은 1.0초까지 돌아온다). 앞 장면이 없으면 0.3초 안에 선다
//   LOB.move(tl, lob, pos, at, dur) → 끝 시각                   s<1 이면 글자 조각을 먼저 걷고(0.2) 도형만 줄인다. s=1 로 돌아오면 글자를 다시 들인다
//   LOB.focusMonth(tl, lob, i, at, dur)                       다른 달 막대 30% · 선 · 도넛 물러남(그 달 도넛은 걷는다 — 밑에 24px 글자가 선다)
//   LOB.openMonth(tl, lob, i, at, {label, dur}) → drawer       그 달 막대 오른쪽 8칸 서랍(줄 순서 = processes = S6 모눈, 칸 96×32 · 간격 40)
//        drawer.cellRect(r) · drawer.rowMid(r) · drawer.thread(이야기의 줄) · drawer.label(글자로 둔 줄 이름) · drawer.slab
//   LOB.bracket(tl, lob, at, dur)                            막대 → 그 달 가장 낮은 칸 괄호(rev 를 따라간다)
//   LOB.monthTag(tl, lob, at, dur)                           막대 밑 「12월」
//   LOB.closeMonth(tl, lob, at, dur)
//   LOB.chip(ctx, lob) · LOB.setChip(tl, lob, "r1"|"r1✎"|"r2"|"공식버전", at, dur)   위 테두리 이름표 칩(겹 교차 페이드, 「공식버전」은 테두리가 한 번 빛난다)
//        칩 폭은 글자마다 재서 따라간다. 옛 이름 "공식" 도 받는다(= "공식버전" — 무대 글자는 「공식버전」, 10-16 사내 용어)
//   LOB.setRev(tl, lob, "r2", at, pace) → 끝 시각                서랍 칸 → 괄호 → 막대(색 · 높이) → 「부족 N대」 차례로 바뀐다(pace 0 = 바로)
//   LOB.ring(tl, lob, "cell"|"bar"|{x,y,w,h}, at, dur)         잉크 고리(처음 부르면 그어지고, 다음부터는 옮겨 간다)
//   LOB.mini(tl, lob, at, dur)                               글자 · 선 · 도넛 · 서랍 · 칩 · 고리를 걷고 막대만 남긴다
//   LOB.miniHead(tl, lob, at, dur)                           미니 머리 — 이름표 「LOB」 + 계산 흐름 아이콘 셋(S3 b6 의 셋이 합쳐진 흔적)
//   LOB.state(tl, lob, "s4" | "s5mini", at)                   앞 장면 끝과 같은 모양을 바로 세운다(S5 · S6 시간 0)
//   lob.frame = 줄어든 상자의 테두리(1.5px 그대로) · lob.heads[0..2] = 미니 머리 아이콘(0 = 소요대수) · lob.mtag = 미니 이름표
// 색은 engine.css 토큰만 쓴다. 판정색 면 채움은 B/N 막대와 서랍 칸(판정)에만.
(function () {
  "use strict";

  // ---------------------------------------------------------------- 자리(무대 좌표)
  const box = { x: 420, y: 330, w: 1080, h: 530 };          // 상자 x420–1500 · y330–860(본문 가운데). 위 테두리 이름표는 y312 부터
  const PITCH = 142;                                         // 월 열 간격 = 무대 12열 격자 한 칸
  const COL0 = box.x + 268;                                  // 첫 달(26.10) 열 가운데 x688 → 마지막 달 x1398
  const colX = (i) => COL0 + PITCH * i;
  const LABEL_X = box.x + 28;                                // 줄 이름(왼쪽 열) x448
  const Y = {
    month: box.y + 44,                                       // 월 글자 가운데 y374
    sep: [box.y + 190, box.y + 414],                         // 줄 사이 가는 선 y520 · y744
    plan: { top: box.y + 86, bot: box.y + 166, lo: 58, hi: 72 },   // 생산계획 선 y416–496(Density 58~72억Gb)
    base: box.y + 360,                                       // B/N 막대 바닥 y690 — 130% 가 156px
    barMax: 156, rateMax: 130, barW: 56,
    short: box.y + 384,                                      // 「부족 N대」 · 「최저」 가운데 y714
    donut: box.y + 468, donutR: 34, donutW: 12,              // 도넛 가운데 y798
  };
  const rowMid = { plan: (Y.plan.top + Y.plan.bot) / 2, bn: (Y.base - Y.barMax * .85 + Y.base) / 2, mix: Y.donut };
  // 펼친 모눈(S6): 8공정 × 6월. 칸 112×40, 줄 간격 52 — 월 열 가운데는 요약과 같다(열이 옮겨 가지 않는다).
  const GRID = { top: box.y + 90, pitch: 52, cw: 112, ch: 40, rows: 8 };
  const cellRect = (r, c) => ({ x: colX(c) - GRID.cw / 2, y: GRID.top + GRID.pitch * r, w: GRID.cw, h: GRID.ch });
  const rowY = (r) => GRID.top + GRID.pitch * r + GRID.ch / 2;

  // 2막 한 판의 자리 — 상자 크기 = 1080·s × 530·s
  const POS = {
    s3: { x: 420, y: 330, s: 1 },          // 전폭 x420–1500 · y330–860(S3 끝 · S6 b0)
    s4: { x: 546, y: 426, s: .635 },       // 가운데 열(단 3–7) x546–1232 · y426–763(S4 · S5 시작)
    s5mini: { x: 560, y: 712, s: .222 },   // S5 아래 레인 다섯째 자리 x560–800 · y712–830(S5 끝 · S6 시작)
  };
  POS.box = POS.s3;
  const P = (p) => (typeof p === "string" ? POS[p] : p) || POS.s3;
  const rectAt = (p) => { p = P(p); return { x: p.x, y: p.y, w: box.w * p.s, h: box.h * p.s }; };
  const at = (p, x, y) => { p = P(p); return { x: p.x + (x - box.x) * p.s, y: p.y + (y - box.y) * p.s }; };
  const xf = (p) => { p = P(p); return { x: p.x - box.x * p.s, y: p.y - box.y * p.s, scale: p.s }; };
  // 서랍(S4) — 칸 96×32 · 줄 간격 40, 막대 오른쪽 52 에서 시작(막대 밑 「부족 N대」가 서랍 판에 닿지 않게). 줄 이름 하나만 글자(나머지는 회색 막대 — 시드 고정 길이)
  const DRAWER = { cw: 96, ch: 32, pitch: 40, gap: 52, slabPad: 14 };
  const DBAR = [70, 92, 0, 64, 84, 58, 76, 50];
  // 미니 머리(s5mini 기준) — 이름표는 위 테두리 왼쪽, 아이콘 셋은 상자 안 오른쪽 위(막대 위 빈 줄)
  const HEAD = { r: 17, dx: [130, 170, 210], dy: 24 };

  const STATUS = { secure: "var(--ok)", warning: "var(--warn)", shortage: "var(--short)" };
  const JUDGE = { "확보": "var(--ok)", "경고": "var(--warn)", "부족": "var(--short)" };
  const JUDGE_TOK = { "확보": "--ok", "경고": "--warn", "부족": "--short" };
  // 도넛 조각 — 제품 여섯을 잉크 농도로만 가른다(제품색 · 판정색을 쓰지 않는다)
  const INK = [.92, .66, .46, .32, .2, .12];

  const CSS = `
.lob-lab{position:absolute;height:36px;display:flex;align-items:center;gap:10px;padding:0 10px;white-space:nowrap;
  background:linear-gradient(var(--surface) 0 53%,transparent 53%)}
.lob-lab b{font-size:24px;font-weight:700;letter-spacing:-.005em}
.lob-mo{position:absolute;width:120px;height:30px;line-height:30px;text-align:center;font-family:var(--num);font-weight:500;font-size:24px;
  font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap}
.lob-rl{position:absolute;height:30px;line-height:30px;font-size:24px;color:var(--muted);white-space:nowrap}
.lob-rl.key{color:var(--text);font-weight:700}
.lob-bar{position:absolute;border-radius:6px 6px 0 0}
.lob-short{position:absolute;width:160px;height:30px;line-height:30px;text-align:center;font-size:24px;font-weight:700;color:var(--short);white-space:nowrap}
.lob-short.low{color:var(--text)}
.lob-svg{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.lob-body,.lob-ov{position:absolute;left:0;top:0;width:0;height:0}
.lob-frame{position:absolute;border:1.5px solid var(--built-line);border-radius:14px;pointer-events:none}
.lob-chip{position:absolute;height:36px;border-radius:18px;border:1.5px solid var(--built-line);background:var(--surface);overflow:hidden}
.lob-chip > span{position:absolute;left:0;top:0;height:33px;display:flex;align-items:center;gap:8px;padding:0 15px;font-size:24px;font-weight:700;
  color:var(--text);white-space:nowrap}
.lob-chip svg{width:22px;height:22px;flex:0 0 auto;color:var(--muted)}
.lob-dw{position:absolute;border-radius:12px;border:1.5px solid var(--panel-line);background:var(--wafer)}
.lob-dc{position:absolute;border-radius:4px}
.lob-dl{position:absolute;height:32px;line-height:32px;padding:0 8px;font-size:24px;font-weight:700;color:var(--text);white-space:nowrap;background:var(--wafer)}
.lob-db{position:absolute;height:12px;border-radius:6px;background:var(--track)}
.lob-dsvg{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:visible;pointer-events:none}
.lob-dsvg path{fill:none;stroke:var(--text);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.lob-tag{position:absolute;width:160px;height:30px;line-height:30px;text-align:center;font-size:24px;font-weight:700;color:var(--text);white-space:nowrap}
.lob-tag.short{color:var(--short)}
`;
  (function inject() {
    if (document.getElementById("lob-css")) return;
    const s = document.createElement("style");
    s.id = "lob-css";
    s.textContent = CSS;
    document.head.appendChild(s);
  })();

  function rect(el, r) {
    el.style.position = "absolute";
    el.style.left = r.x + "px"; el.style.top = r.y + "px";
    if (r.w != null) el.style.width = r.w + "px";
    if (r.h != null) el.style.height = r.h + "px";
    return el;
  }
  const barH = (rate) => Math.round(Math.min(rate, Y.rateMax) / Y.rateMax * Y.barMax);
  const planY = (v) => Y.plan.bot - (v - Y.plan.lo) / (Y.plan.hi - Y.plan.lo) * (Y.plan.bot - Y.plan.top);
  const tokv = (k) => getComputedStyle(document.documentElement).getPropertyValue(k).trim();
  const E = () => (window.Parts ? Parts.eases() : { io: "power2.inOut", out: "power3.out" });
  // dur 0 이면 set(되감기 · 인쇄 · 다음 장면 시간 0 에 같은 모양을 바로 세울 때)
  function go(tl, el, vars, t, dur, ease) {
    if (!el || (Array.isArray(el) && !el.length)) return;
    if (dur > 0) tl.to(el, Object.assign({ duration: dur, ease: ease || "power2.out" }, vars), t);
    else tl.set(el, vars, t);
  }

  // 도넛 조각 한 개(호) — 12시에서 시계 방향.
  function arc(cx, cy, r, a0, a1) {
    const p = (a) => { const t = (a - 90) * Math.PI / 180; return [cx + r * Math.cos(t), cy + r * Math.sin(t)]; };
    const [x0, y0] = p(a0), [x1, y1] = p(a1);
    return "M" + x0.toFixed(2) + " " + y0.toFixed(2) + "A" + r + " " + r + " 0 " + (a1 - a0 > 180 ? 1 : 0) + " 1 " + x1.toFixed(2) + " " + y1.toFixed(2);
  }

  // 이야기의 칸(Pre B/D · 26.12) — r1 → r2 에서 바뀐 칸 하나에서 읽는다
  function thread(D) {
    const diff = (D.home_heatmap && D.home_heatmap["r1_차이"]) || {};
    const key = Object.keys(diff).find((k) => k.indexOf("|") > 0) || "|";
    const [name, month] = key.split("|");
    const months = (D.summary && D.summary.months) || D.months || [];
    const names = (D.processes || []).map((p) => p.name);
    return { name, month, i: months.indexOf(month), row: names.indexOf(name), r1: diff[key] || {} };
  }

  // ---------------------------------------------------------------- 그리기
  // opts: { persist: true → root 에 persist 키 「lob」, sample: true → 위 테두리 오른쪽에 샘플 배지, rev: "r1" | "r2"(기본), label }
  function draw(ctx, parent, opts) {
    opts = opts || {};
    const D = ctx.D, S = D.summary || {};
    const months = S.months || D.months || [];
    const rev = opts.rev === "r1" ? "r1" : "r2";
    const bnR2 = S.bn || [], bnR1 = S.bn_r1 || bnR2;
    const bn = rev === "r1" ? bnR1 : bnR2;
    const root = ctx.el("div", "lob", null, parent);
    rect(root, { x: 0, y: 0, w: 0, h: 0 });
    if (opts.persist) ctx.persist(root, "lob");
    const body = ctx.el("div", "lob-body", null, root);

    const pane = rect(ctx.el("div", "panel built", null, body), box);
    const label = rect(ctx.el("div", "lob-lab", "<b>" + (opts.label || "LOB Summary") + "</b>", body), { x: box.x + 16, y: box.y - 18 });
    let right = null, badge = null;
    if (opts.sample) {
      right = ctx.el("div", "lob-lab", null, body);
      badge = ctx.badge("샘플 데이터", "sample", right);
      right.style.top = (box.y - 18) + "px";
      right.style.left = (box.x + box.w - 16 - right.offsetWidth) + "px";
    }

    const mo = months.map((m, i) => rect(ctx.el("div", "lob-mo", m, body), { x: colX(i) - 60, y: Y.month - 15 }));
    const rl = (t, y, key) => rect(ctx.el("div", "lob-rl" + (key ? " key" : ""), t, body), { x: LABEL_X, y: Math.round(y - 15) });
    const rows = { plan: rl("생산계획", rowMid.plan), bn: rl("B/N 확보율", rowMid.bn, true), mix: rl("제품 비중", rowMid.mix) };

    // 선 · 도넛 · 가는 선은 무대 크기 SVG 하나에(무대 좌표 그대로)
    const svg = ctx.svg("svg", { class: "lob-svg", width: ctx.W, height: ctx.H, viewBox: "0 0 " + ctx.W + " " + ctx.H }, body);
    const x0 = colX(0) - PITCH / 2 + 10, x1 = colX(months.length - 1) + PITCH / 2 - 10;
    const seps = Y.sep.map((y) => ctx.svg("line", { x1: LABEL_X, x2: x1, y1: y, y2: y, style: "stroke:var(--track);stroke-width:1.5" }, svg));
    const lg = ctx.svg("g", null, svg);
    const dens = S["density_억Gb"] || [];
    const pts = dens.map((v, i) => [colX(i), planY(v)]);
    const path = ctx.svg("path", {
      d: "M" + pts.map((p) => p[0] + " " + p[1].toFixed(1)).join(" L"),
      style: "fill:none;stroke:var(--text);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round",
    }, lg);
    const dots = pts.map((p) => ctx.svg("circle", { cx: p[0], cy: p[1].toFixed(1), r: 6, style: "fill:var(--surface);stroke:var(--text);stroke-width:2.5" }, lg));

    // B/N 막대 — 무대 좌표 div(S6 가 이 사각형을 그대로 모눈 칸으로 옮긴다)
    const base = ctx.svg("line", { x1: x0, x2: x1, y1: Y.base + .75, y2: Y.base + .75, style: "stroke:var(--line);stroke-width:1.5" }, svg);
    const bars = bn.map((b, i) => {
      const h = barH(b.rate);
      const r = { x: colX(i) - Y.barW / 2, y: Y.base - h, w: Y.barW, h };
      const el = rect(ctx.el("div", "lob-bar", null, body), r);
      el.style.background = STATUS[b.status] || "var(--die-idle)";
      return { el, rect: r, b, status: b.status };
    });
    // 「부족 N대」(r2 의 부족한 달)와 「최저」(r1 — 부족한 달이 없을 때 가장 낮은 달). 둘 다 만들어 두고 rev 에 맞는 하나만 보인다.
    const si = bnR2.findIndex((b) => b.short > 0);
    const short = si >= 0 ? rect(ctx.el("div", "lob-short", "부족 " + bnR2[si].short + "대", body), { x: colX(si) - 80, y: Y.short - 15 }) : null;
    let li = months.indexOf(S.lowest_r1);
    if (li < 0 && bnR1.length) li = bnR1.reduce((m, b, i) => (b.rate < bnR1[m].rate ? i : m), 0);
    const lowest = li >= 0 ? rect(ctx.el("div", "lob-short low", S.lowest_label || "최저", body), { x: colX(li) - 80, y: Y.short - 15 }) : null;
    const r1short = bnR1.some((b) => b.short > 0);
    if (rev === "r1" && short && !r1short) short.style.opacity = 0;
    if (rev === "r2" && lowest) lowest.style.opacity = 0;

    // 월별 제품 비중 도넛(무채색)
    const mix = S["mix_wafer기준"] || [];
    const donuts = mix.map((shares, i) => {
      const g = ctx.svg("g", null, svg);
      const tot = shares.reduce((a, v) => a + v, 0);
      let a = 0;
      const segs = shares.map((v, k) => {
        const span = v / tot * 360, gap = 2.4;
        const p = ctx.svg("path", {
          d: arc(colX(i), Y.donut, Y.donutR, a + gap / 2, a + span - gap / 2),
          style: "fill:none;stroke:rgba(236,236,239," + INK[k % INK.length] + ");stroke-width:" + Y.donutW,
        }, g);
        a += span;
        return p;
      });
      return { g, segs };
    });

    // 겹(줄지 않는다) — 줄어든 상자의 테두리 · 미니 머리. 서랍 · 칩 · 고리 · 24px 글자는 장면이 부를 때 여기에 생긴다.
    const ov = ctx.el("div", "lob-ov", null, root);
    const frame = rect(ctx.el("div", "lob-frame", null, ov), { x: box.x, y: box.y, w: box.w, h: box.h });
    frame.style.visibility = "hidden";
    frame.style.opacity = 0;
    const MR = rectAt("s5mini");
    let heads = [];
    if (window.Parts) {
      heads = Parts.FLOW.map((f, k) => Parts.flowNode(ctx, k, MR.x + HEAD.dx[k], MR.y + HEAD.dy, HEAD.r, ov));
      heads.forEach((h) => { h.style.opacity = 0; });
    }
    const mtag = rect(ctx.el("div", "lob-lab", "<b>LOB</b>", ov), { x: MR.x + 6, y: MR.y - 18 });
    mtag.style.opacity = 0;

    const lob = {
      root, body, ov, box: pane, label, right, badge, months: mo, rows, seps, svg, line: { g: lg, path, dots }, bars, base, short, lowest, donuts,
      sampleIndex: si, lowestIndex: li, frame, heads, mtag,
      ctx, D, bnR1, bnR2, chip: null, drawer: null, ringO: null, tags: null,
      st: { pos: POS.s3, rev, focus: -1 },
    };
    return lob;
  }

  // 글자 조각 — 줄면 22px 아래가 되어 걷는 것들. on = s3 에서 보여야 하는 것들(rev 를 따른다)
  function texts(lob) {
    return [lob.label, lob.right].concat(lob.months, [lob.rows.plan, lob.rows.bn, lob.rows.mix, lob.short, lob.lowest]).filter(Boolean);
  }
  function textsOn(lob) {
    const sl = lob.st.rev === "r1" && !lob.bnR1.some((b) => b.short > 0) ? lob.lowest : lob.short;
    return [lob.label, lob.right].concat(lob.months, [lob.rows.plan, lob.rows.bn, lob.rows.mix, sl]).filter(Boolean);
  }
  function shapes(lob) {
    return [lob.line.g, lob.base].concat(lob.seps, lob.donuts.map((d) => d.g));
  }
  function frameVars(p) {
    const r = rectAt(p);
    return { left: r.x, top: r.y, width: r.w, height: r.h, borderRadius: Math.max(8, Math.round(14 * P(p).s)) };
  }

  // 앞 장면 끝에 서 있던 그대로 이어받는다. S5 에서 왔으면 미니 → box(0.6), 앞 장면이 없으면(되감기 · 점프 · 인쇄) 0.3초 안에 선다.
  function stand(ctx, tl, lob) {
    const from = ctx.isPersisted("lob") ? ctx.from : null;
    if (from === "s05-static-effect" || from === "s04-static-whatif") {
      tl.set(lob.root, { autoAlpha: 1 }, 0);
      if (from === "s05-static-effect") {
        state(tl, lob, "s5mini", 0);
        go(tl, [lob.mtag].concat(lob.heads), { opacity: 0 }, .05, .2);
        go(tl, lob.frame, { borderColor: tokv("--built-line") }, .05, .3);
      } else {
        state(tl, lob, "s4", 0);
        closeMonth(tl, lob, .05, .25);
        go(tl, lob.bars.map((b) => b.el), { opacity: 1 }, .05, .25);
        go(tl, shapes(lob), { opacity: 1 }, .05, .25);
      }
      const end = move(tl, lob, "s3", .1, .6);
      if (from === "s05-static-effect") go(tl, shapes(lob), { opacity: 1 }, end - .05, .3);
      return end + .3;
    }
    if (ctx.isPersisted("lob")) tl.set(lob.root, { autoAlpha: 1 }, 0);
    else tl.fromTo(lob.root, { autoAlpha: 0 }, { autoAlpha: 1, duration: .3, ease: "power1.out" }, 0);
    // 샘플 배지는 앞 장면(S3)에 없을 수 있어 늘 0.3초에 들인다.
    if (lob.right) tl.fromTo(lob.right, { opacity: 0 }, { opacity: 1, duration: .3 }, 0);
    return .3;
  }

  // S3 용 — 상자 → 월 → 선 → 막대 → 「최저」/「부족 N대」 → 도넛 차례로 선다. 돌려주는 값 = 끝 시각.
  function reveal(tl, lob, at0) {
    at0 = at0 || 0;
    tl.fromTo(lob.root, { autoAlpha: 0 }, { autoAlpha: 1, duration: .01 }, at0);
    tl.fromTo(lob.box, { opacity: 0, scale: .97 }, { opacity: 1, scale: 1, duration: .45, ease: "power3.out" }, at0);
    tl.fromTo([lob.label, lob.right].filter(Boolean), { opacity: 0 }, { opacity: 1, duration: .35 }, at0 + .15);
    tl.fromTo(lob.months, { opacity: 0, y: -6 }, { opacity: 1, y: 0, duration: .3, stagger: .04, ease: "power2.out" }, at0 + .25);
    tl.fromTo([lob.rows.plan, lob.rows.bn, lob.rows.mix].concat(lob.seps), { opacity: 0 }, { opacity: 1, duration: .3, stagger: .06 }, at0 + .3);
    tl.fromTo(lob.line.path, { drawSVG: "0%" }, { drawSVG: "100%", duration: .6, ease: "power1.inOut" }, at0 + .45);
    tl.fromTo(lob.line.dots, { opacity: 0 }, { opacity: 1, duration: .2, stagger: .09 }, at0 + .5);
    tl.fromTo(lob.base, { opacity: 0 }, { opacity: 1, duration: .2 }, at0 + .7);
    lob.bars.forEach((b, i) => {
      tl.fromTo(b.el, { scaleY: 0, transformOrigin: "50% 100%" }, { scaleY: 1, transformOrigin: "50% 100%", duration: .5, ease: "power3.out" }, at0 + .75 + i * .07);
    });
    const sl = textsOn(lob).filter((e) => e === lob.short || e === lob.lowest)[0];
    if (sl) tl.fromTo(sl, { opacity: 0, y: -6 }, { opacity: 1, y: 0, duration: .3, ease: "power2.out" }, at0 + 1.35);
    lob.donuts.forEach((d, i) => {
      tl.fromTo(d.segs, { drawSVG: "0%" }, { drawSVG: "100%", duration: .3, stagger: .05, ease: "power1.out" }, at0 + 1.2 + i * .07);
    });
    return at0 + 1.2 + 5 * .07 + .3 + 5 * .05;
  }

  // ---------------------------------------------------------------- 자리 옮기기(줄이기 · 키우기)
  function move(tl, lob, p, t, dur) {
    p = P(p);
    dur = dur == null ? .6 : dur;
    const from = lob.st.pos;
    const shrink = p.s < .999, wasFull = from.s >= .999;
    let t0 = t;
    if (shrink && wasFull) {
      // 글자 먼저 — 0.635배면 24px 가 15px 가 되어 22px 규칙을 어긴다. 필요한 글자는 겹(ov)에 24px 로 새로 선다.
      go(tl, texts(lob), { opacity: 0 }, t, dur > 0 ? .2 : 0, "power1.in");
      if (dur > 0) t0 = t + .12;
      // 상자 테두리는 frame 이 맡는다(줄어도 1.5px 그대로)
      tl.set(lob.frame, Object.assign({ autoAlpha: 1 }, frameVars(from)), t0);
      tl.set(lob.box, { borderColor: "rgba(236,236,239,0)" }, t0);
    }
    go(tl, lob.body, Object.assign({ transformOrigin: "0px 0px" }, xf(p)), t0, dur, E().io);
    go(tl, lob.frame, frameVars(p), t0, dur, E().io);
    if (!shrink && !wasFull) {
      tl.set(lob.box, { borderColor: tokv("--built-line") }, t0 + dur);
      tl.set(lob.frame, { autoAlpha: 0 }, t0 + dur);
      go(tl, textsOn(lob), { opacity: 1 }, t0 + dur - .05, dur > 0 ? .3 : 0);
    }
    lob.st.pos = p;
    return t0 + dur;
  }

  // ---------------------------------------------------------------- 한 달에 시선 — 다른 달 막대 30% · 선 · 도넛 물러남
  function focusMonth(tl, lob, i, t, dur) {
    dur = dur == null ? .3 : dur;
    go(tl, lob.bars.filter((b, k) => k !== i).map((b) => b.el), { opacity: .3 }, t, dur);
    go(tl, [lob.line.g, lob.base].concat(lob.seps), { opacity: .3 }, t, dur);
    go(tl, lob.donuts.filter((d, k) => k !== i).map((d) => d.g), { opacity: .3 }, t, dur);
    if (lob.donuts[i]) go(tl, lob.donuts[i].g, { opacity: 0 }, t, dur);
    lob.st.focus = i;
  }

  // 막대 i 의 무대 사각형(지금 자리 · rev)
  function barRect(lob, i, rev) {
    const p = lob.st.pos;
    const b = (rev === "r1" ? lob.bnR1 : lob.bnR2)[i] || {};
    const h = barH(b.rate || 0);
    const tl0 = at(p, colX(i) - Y.barW / 2, Y.base - h);
    return { x: tl0.x, y: tl0.y, w: Y.barW * p.s, h: h * p.s };
  }
  // 그 달 공정별 판정 · 확보율(rev) — r1 은 r2 에 r1_차이를 덮어 쓴다
  function monthCells(lob, i, rev) {
    const D = lob.D, hm = (D.home_heatmap && D.home_heatmap.r2) || {}, diff = (D.home_heatmap && D.home_heatmap["r1_차이"]) || {};
    const month = ((D.summary && D.summary.months) || [])[i];
    return (D.processes || []).map((p) => {
      const row = hm[p.name] || {};
      let j = (row["판정"] || [])[i], r = (row["확보율"] || [])[i];
      const d = diff[p.name + "|" + month];
      if (rev === "r1" && d) { j = d["판정"]; r = d["확보율"]; }
      return { name: p.name, judge: j, rate: r == null ? 999 : r };
    });
  }
  const lowRow = (cells) => cells.reduce((m, c, k) => (c.rate < cells[m].rate ? k : m), 0);

  // ---------------------------------------------------------------- 서랍(그 달 공정 8칸)
  function openMonth(tl, lob, i, t, o) {
    o = o || {};
    const dur = o.dur == null ? .5 : o.dur;
    const ctx = lob.ctx, D = lob.D;
    const th = thread(D);
    const names = (D.processes || []).map((p) => p.name);
    const n = names.length;
    const p = lob.st.pos, R = rectAt(p);
    const b = barRect(lob, i, lob.st.rev);
    const x0 = Math.round(b.x + b.w + DRAWER.gap);
    const H = DRAWER.pitch * (n - 1) + DRAWER.ch;
    const top = Math.round(R.y + (R.h - H) / 2);
    const cr = (r) => ({ x: x0, y: top + DRAWER.pitch * r, w: DRAWER.cw, h: DRAWER.ch });
    const slabR = { x: x0 - DRAWER.slabPad, y: top - 8, w: Math.round(R.x + R.w - 14 - (x0 - DRAWER.slabPad)), h: H + 16 };
    const slab = rect(ctx.el("div", "lob-dw", null, lob.ov), slabR);
    const cells = monthCells(lob, i, lob.st.rev);
    const cellEls = cells.map((c, r) => {
      const el = rect(ctx.el("div", "lob-dc", null, lob.ov), cr(r));
      el.style.background = JUDGE[c.judge] || "var(--die-idle)";
      return el;
    });
    // 괄호 — 막대 위 끝 → 그 달 가장 낮은 칸(rev 마다 하나씩, 바뀌면 건너뛴다)
    const svg = ctx.svg("svg", { class: "lob-dsvg", viewBox: "0 0 1920 1080" }, lob.ov);
    const brk = {};
    ["r1", "r2"].forEach((rv) => {
      const br = barRect(lob, i, rv), row = lowRow(monthCells(lob, i, rv));
      const c = cr(row), mx = x0 - 16;
      const d = "M" + (br.x + br.w + 3).toFixed(1) + " " + br.y.toFixed(1) + "H" + mx + "V" + (c.y + c.h / 2) + "H" + (x0 - 3);
      brk[rv] = ctx.svg("path", { d }, svg);
      brk[rv].style.opacity = 0;
    });
    // 줄 이름 — 글자는 하나(이야기의 줄), 나머지는 회색 막대
    const keep = o.label || th.name;
    let label = null;
    const rowEls = names.map((nm, r) => {
      const c = cr(r);
      if (nm === keep) {
        label = rect(ctx.el("div", "lob-dl", nm, lob.ov), { x: x0 + DRAWER.cw + 6, y: c.y });
        return label;
      }
      return rect(ctx.el("span", "lob-db", null, lob.ov), { x: x0 + DRAWER.cw + 14, y: c.y + 10, w: DBAR[r] || 60 });
    });
    // 막대 밑 24px 글자 — 「12월」 · 「부족 N대」(r2 에서 붙는다)
    const mno = parseInt(String(((D.summary && D.summary.months) || [])[i] || "").split(".")[1], 10);
    const baseY = at(p, 0, Y.base).y;
    const cx = b.x + b.w / 2;
    const mtag = rect(ctx.el("div", "lob-tag", mno + "월", lob.ov), { x: Math.round(cx - 80), y: Math.round(baseY + 8) });
    const sb = lob.bnR2[i] || {};
    const stag = rect(ctx.el("div", "lob-tag short", "부족 " + (sb.short || 0) + "대", lob.ov), { x: Math.round(cx - 80), y: Math.round(baseY + 40) });
    const all = [slab].concat(cellEls, rowEls);
    tl.set(all.concat([mtag, stag]), { opacity: 0 }, 0);
    // 미끄러져 나온다 — 판이 왼쪽(막대 쪽)에서 열리고 칸이 위에서부터 선다.
    // fromTo 의 from 에만 있는 속성은 되감은 뒤 다시 재생할 때 다시 들어가지 않는다(GSAP) — 그래서 opacity 를 to 에도 둔다.
    if (dur > 0) {
      tl.fromTo(slab, { opacity: 1, clipPath: "inset(0px 100% 0px 0px round 12px)" },
        { opacity: 1, clipPath: "inset(0px 0% 0px 0px round 12px)", duration: dur * .8, ease: E().out, immediateRender: false }, t);
      tl.fromTo(cellEls, { opacity: 0, x: -14 }, { opacity: 1, x: 0, duration: dur * .5, stagger: dur * .06, ease: E().out, immediateRender: false }, t + dur * .2);
      tl.fromTo(rowEls, { opacity: 0 }, { opacity: 1, duration: dur * .4, stagger: dur * .04, immediateRender: false }, t + dur * .45);
    } else {
      // 판에만 둥근 가림을 준다 — 칸 · 줄 막대에 주면 모서리가 12px 로 깎여 앞 장면 끝(4px)과 모양이 달라진다
      tl.set(all, { opacity: 1, x: 0 }, t);
      tl.set(slab, { clipPath: "inset(0px 0% 0px 0px round 12px)" }, t);
    }
    const drawer = {
      i, slab, cells: cellEls, rows: rowEls, label, svg, brk, mtag, stag, x0, top,
      cellRect: cr, rowMid: (r) => top + DRAWER.pitch * r + DRAWER.ch / 2, thread: names.indexOf(keep), slabRect: slabR,
    };
    lob.drawer = drawer;
    return drawer;
  }
  function bracket(tl, lob, t, dur) {
    const d = lob.drawer;
    if (!d) return;
    const pth = d.brk[lob.st.rev];
    if (dur > 0) tl.fromTo(pth, { opacity: 1, drawSVG: "0%" }, { opacity: 1, drawSVG: "100%", duration: dur, ease: "power1.inOut", immediateRender: false }, t);
    else tl.set(pth, { opacity: 1, drawSVG: "100%" }, t);
    d.bracketOn = true;
  }
  function monthTag(tl, lob, t, dur) {
    const d = lob.drawer;
    if (!d) return;
    if (dur > 0) tl.fromTo(d.mtag, { opacity: 0, y: -6 }, { opacity: 1, y: 0, duration: dur, ease: E().out, immediateRender: false }, t);
    else tl.set(d.mtag, { opacity: 1, y: 0 }, t);
  }
  function closeMonth(tl, lob, t, dur) {
    const d = lob.drawer;
    if (!d) return;
    dur = dur == null ? .3 : dur;
    const parts = d.cells.concat(d.rows, [d.brk.r1, d.brk.r2, d.mtag, d.stag]);
    if (dur > 0) {
      tl.to(parts, { opacity: 0, duration: dur * .5, ease: "power1.in" }, t);
      tl.to(d.slab, { clipPath: "inset(0px 100% 0px 0px round 12px)", duration: dur, ease: E().io }, t + dur * .2);
      tl.set(d.slab, { opacity: 0 }, t + dur * 1.2);
    } else tl.set(parts.concat([d.slab]), { opacity: 0 }, t);
  }

  // ---------------------------------------------------------------- 위 테두리 이름표 칩(s4 자리)
  const CHIP_STATES = ["r1", "r1✎", "r2", "공식버전"];
  const CHIP_ALIAS = { "공식": "공식버전" };              // 10-16 이전 장면 코드가 부르던 이름
  const chipKey = (s) => CHIP_ALIAS[s] || s;
  function chip(ctx, lob) {
    if (lob.chip) return lob.chip;
    const R = rectAt("s4");
    const el = rect(ctx.el("div", "lob-chip", null, lob.ov), { x: R.x + 16, y: R.y - 18, h: 36 });
    const layers = {}, widths = {};
    CHIP_STATES.forEach((s) => {
      const html = s === "r1✎" ? "r1" + (window.Parts ? Parts.ICON.pen : "") : s;
      const sp = ctx.el("span", null, html, el);
      layers[s] = sp;
      widths[s] = Math.ceil(sp.offsetWidth) + 3;
      sp.style.opacity = 0;
    });
    el.style.width = widths.r1 + "px";
    el.style.opacity = 0;
    lob.chip = { el, layers, widths, cur: null };
    return lob.chip;
  }
  function setChip(tl, lob, s, t, dur) {
    const c = lob.chip;
    if (!c) return;
    s = chipKey(s);
