    M.to(qmW, { textShadow: "0 0 0px rgba(210,154,58,0)", duration: .5, ease: "power1.out" }, TLD + .12);
    M.fromTo(e1, { opacity: .9, attr: { rx: 10, ry: 3, "stroke-width": 2.5 } },
      { opacity: 0, attr: { rx: 110, ry: 32, "stroke-width": 1 }, duration: .55, ease: "power2.out", immediateRender: false }, TLD);
    M.fromTo(e2, { opacity: .55, attr: { rx: 6, ry: 2, "stroke-width": 2 } },
      { opacity: 0, attr: { rx: 72, ry: 21, "stroke-width": 1 }, duration: .5, ease: "power2.out", immediateRender: false }, TLD + .08);
    cue(TLD, "drop", { f: 1900, g: .11 });
    cue(TLD, "pop", { f: 392, g: .14 });
    // 다 보인 채 머문다(출렁임이 멎는 4.02–4.25) → 로크업 · 낱말이 걷히고 「?」 만 남는다.
    // 로크업은 0.2초에 다 걷혀(4.45) 질문 첫 낱말(4.46)과 「?」 비행 길목 위에 남지 않는다(10-17 비평 T4)
    const TOUT = 4.25;
    M.to(lock, { opacity: 0, y: -24, duration: .20, ease: "power2.in" }, TOUT);
    M.to(ww, { opacity: 0, y: -20, duration: .25, ease: "power2.in" }, TOUT);
    // 「?」 비행(매치컷) — 질문 「?」 자리로, 크기는 질문 글자에 맞춰
    const TF = 4.27, FD = .46, TL = TF + FD;
    M.set(qmW, { transformOrigin: "50% 50%" }, TF);
    M.to(qmW, { x: DX, duration: FD, ease: IO }, TF);
    M.to(qmW, { y: DY, duration: FD, ease: "power2.inOut" }, TF);
    M.to(qmW, { scale: FS, duration: FD, ease: IO }, TF);
    M.to(qmW, { rotation: -12, duration: FD / 2, ease: "sine.inOut" }, TF);
    M.to(qmW, { rotation: 0, duration: FD / 2, ease: "sine.inOut" }, TF + FD / 2);
    // 비행 쉭 — 대역을 배경 패드(저역 통과 ~1050Hz) 위로 올려 쓸어 묻히지 않게(10-17 비평 T5)
    cue(TF, "whoosh", { d: .42, g: .19, lo: 900, hi: 3000, end: 1500 });
    // 질문 낱말이 「?」 를 맞으러 선다
    qws.forEach((w, i) => M.to(w, { opacity: 1, y: 0, duration: .34, ease: OUT }, 4.46 + i * .06));
    // 착지 — 한 번 부풀고, 다 돌아온 뒤(TL + .18 — 두 「?」 의 크기가 같을 때) 질문의 진짜 「?」 로 바꿔 낀다(0.06초 교차).
    // 부푸는 중에 바꾸면 크기가 다른 「?」 둘이 포개져 두꺼운 이중 「?」 가 두 프레임 보였다(10-17 비평 T3)
    M.to(qmW, { scale: FS * 1.1, duration: .06, ease: "power1.out" }, TL);
    M.to(qmW, { scale: FS, duration: .12, ease: "power1.out" }, TL + .06);
    M.set(qmQ, { opacity: 1 }, TL + .18);
    M.to(qmW, { opacity: 0, duration: .06 }, TL + .18);
    cue(TL, "chime", { f: 988 });
    // 질문 걷힘 — ③ 부제목(6.30)이 들어오기 전에 다 걷힌다(10-18 P71 — 6.30 부터 .45초면 6.30–6.75 에 질문과 부제목 두 글줄을 함께 읽게 됐다).
    // 6.12 부터 .2초 → 6.32 에 다 걷힘(부제목은 6.30 에 0 에서 오르기 시작). 무리 이동 6.35 는 그대로
    M.to(q, { opacity: 0, y: -30, duration: .2, ease: "power2.in" }, 6.12);
    // 로크업 마스크 — 물방울 가운데(960, 508)에서 반지름 R − 110 까지 보이고 R − 40 밖은 가린다. R − 110 ≥ 460(3.04)부터 마스크를 뗀다.
    let mLast = null;
    FLUSH.push(() => {
      const R = RIP.r;
      const m = R - 110 >= 460 ? "" : "radial-gradient(circle at " + RIP.x + "px " + RIP.y + "px, #000 " +
        Math.max(0, R - 110).toFixed(1) + "px, transparent " + Math.max(0, R - 40).toFixed(1) + "px)";
      if (m !== mLast) { lockL.style.maskImage = m; lockL.style.webkitMaskImage = m; mLast = m; }
    });
  }

  // ---------------------------------------------------------------- ② CAMP (첫 판 3.85–6.0) · ③ 손으로 옮겨 담기 (6.0–9.85) · ③b 다시 (9.85–12.28) — ANCH 로 2차 4.95–10.90
  // ③c 로컬에 갇힘(10.90–13.30)과 층 쓸림(13.30)은 2차 시각으로 직접 적는다(맨 끝). 질문 문구는 ①b(sceneTitle)로 옮겼다(10-17 2차).
  function sceneManual() {
    MAP = false;
    const L = layer(4.90, 13.70);                       // 2차 시각
    MAP = true;
    const ctx = mkctx(L);

    // CAMP 상자 · 뚜껑 · DB 원통(상자 뒤에 숨어 있다가 솟는다) · 주차 이름표 — 한 무리로 왼쪽으로 옮겨 ③ 의 원천이 된다
    const grp = el("div", "tz-layer", null, L);
    const db = svg("svg", { class: "tz-db", viewBox: "0 0 170 190" }, grp);
    svg("path", { d: "M5 24 V166 A80 22 0 0 0 165 166 V24 Z" }, db);
    svg("path", { class: "band", d: "M5 72 A80 22 0 0 0 165 72" }, db);
    svg("path", { class: "band", d: "M5 120 A80 22 0 0 0 165 120" }, db);
    svg("ellipse", { cx: 85, cy: 24, rx: 80, ry: 22 }, db);
    const camp = el("div", "tz-camp", "<b>" + TX.camp + "</b>", grp);
    const lid = el("div", "tz-lid", null, grp);
    const wk = place(el("div", "tz-wk", null, grp), 1062, 380, 112, 44);
    const wkA = el("span", null, TX.w42, wk), wkB = el("span", null, TX.w43, wk);
    const ring = place(el("div", "tz-ring", null, grp), 960 - 125, 455 - 125, 250, 250);

    const GO = { x: 960, y: 660 }, GS = .86, GX = -620;
    const P = (x, y) => ({ x: GO.x + (x - GO.x) * GS + GX, y: GO.y + (y - GO.y) * GS });   // 무리를 옮긴 뒤의 무대 좌표
    T.set(grp, { x: 0, scale: 1, transformOrigin: GO.x + "px " + GO.y + "px" }, 0);
    T.set([camp, lid], { opacity: 0, y: 30 }, 0);
    T.set(lid, { rotation: 0, transformOrigin: "0% 100%" }, 0);
    T.set(db, { y: 0, opacity: 0 }, 0);
    T.set(db, { opacity: 1 }, 4.8);                      // 상자가 다 선 뒤에만 — 그 전에는 상자 뒤에 숨을 곳이 없다
    T.set(wk, { opacity: 0, x: -10, borderColor: TOK("--line") }, 0);
    T.set(wkB, { yPercent: 100 }, 0);
    T.set(ring, { opacity: 0, scale: .8 }, 0);
    T.to([camp, lid], { opacity: 1, y: 0, duration: .45, ease: OUT, stagger: .05 }, 3.85);
    // 뚜껑 — 왼쪽 위로 들리며 걷힌다(솟는 원통 · 질문 글자와 겹치지 않게)
    // 시작 값을 적어 둔다 — 뚜껑이 서는 트윈(y)이 끝나기 0.04초 전에 시작해, to 면 시작 y 가 seek 경로마다 달라진다(결정성)
    T.fromTo(lid, { rotation: 0, x: 0, y: 0 }, { rotation: -24, x: -210, y: -46, duration: .4, ease: "back.out(1.4)", immediateRender: false }, 4.55);
    T.to(lid, { opacity: 0, duration: .3, ease: "power1.in" }, 4.75);
    cue(4.6, "clunk");
    T.to(db, { y: -200, duration: .6, ease: OUT }, 4.8);
    cue(4.8, "rise");
    T.to(wk, { opacity: 1, x: 0, duration: .35, ease: OUT }, 5.45);
    T.to(grp, { x: GX, scale: GS, duration: .65, ease: IO }, 6.0);

    // 로컬 엑셀 판(WHY.excelPanel — 덱 S1 과 같은 판 · 격자)
    const XR = { x: 720, y: 330, w: 1000, h: 420 };
    const xl = WHY.excelPanel(ctx, XR);
    // ③c 에서 엑셀 판 · 다시 하기 칩 · Case 카운터가 함께 파일 하나로 접힌다 — 한 층(fold)에 모은다(자리는 모두 무대 좌표 그대로)
    const fold = el("div", "tz-layer", null, L);
    fold.appendChild(xl.el);
    T.set(xl.el, { opacity: 0, y: 20 }, 0);
    T.to(xl.el, { opacity: 1, y: 0, duration: .45, ease: OUT }, 6.25);
    const cellMid = (c, row) => { const r = WHY.gridCell(XR, c, row); return { x: r.x + r.w / 2, y: r.y + r.h / 2, w: r.w }; };

    const SRC = P(960, 440), POP = P(960, 330);          // 칩이 나오는 곳(원통 안) · 솟은 자리(원통 위)
    const names = (LONG.tables16(D).filter((t) => t.stage).map((t) => t.name).slice(0, 4));
    const NAMES = names.length === 4 ? names : TX.chips;
    function chipEl(name, parent) {
      const c = el("div", "tz-chip", esc(name), parent);
      T.set(c, { x: SRC.x, y: SRC.y, xPercent: -50, yPercent: -50, scale: .4, opacity: 0 }, 0);
      return c;
    }
    function barsFor(c, parent) {
      return [1, 2, 3].map((row) => {
        const m = cellMid(c, row), w = 64 + ((c * 37 + row * 53) % 40);
        const b = place(el("div", "tz-cell", null, parent), m.x - w / 2, m.y - 7, w, 14);
        T.set(b, { opacity: 0, scaleX: 0, transformOrigin: "0% 50%" }, 0);
        return b;
      });
    }
    // 칩 하나를 손으로 옮긴다 — 커서가 원통에서 집어(클릭) 칸까지 끌고 와 놓는다(톡) → 그 열에 값이 찬다
    function carry(chip, bars, c, t, d) {
      const m = cellMid(c, 0);
      T.to(chip, { opacity: 1, scale: 1, x: POP.x, y: POP.y, duration: .14, ease: OUT }, t);
      cue(t + .02, "click", { g: .1 });
      T.to(chip, { x: m.x, y: m.y, duration: d * .52, ease: IO }, t + .15);
      CUR.to(m.x + 34, m.y + 14, t + .15, d * .52);
      const tl = t + .15 + d * .52;
      cue(tl, "tok", { f: 700 + c * 40 });
      T.fromTo(chip, { scale: 1.06 }, { scale: 1, duration: .14, ease: "power2.out", immediateRender: false }, tl);
      T.to(bars, { opacity: 1, scaleX: 1, duration: .16, stagger: .035, ease: OUT }, tl + .02);
      CUR.to(POP.x + 34, POP.y + 14, tl + .04, Math.max(.12, d - (tl + .04 - t) - .02));
    }
    const pile = el("div", "tz-layer", null, L);
    const pass1 = NAMES.map((n, c) => ({ chip: chipEl(n, pile), bars: barsFor(c, pile) }));
    CUR.show(POP.x + 34, POP.y + 14, 6.55);
    const T3 = 6.7, STEP = .78;
    pass1.forEach((p, c) => carry(p.chip, p.bars, c, T3 + c * STEP, STEP));

    // 원천이 바뀐다 — 이름표 W42 → W43 · 짧은 경고 펄스
    const TW = 9.85;
    T.to(wkA, { yPercent: -100, duration: .3, ease: IO }, TW);
    T.to(wkB, { yPercent: 0, duration: .3, ease: IO }, TW);
    T.to(wk, { borderColor: TOK("--warn"), duration: .15 }, TW);
    // 바뀌는 순간 이름표가 잠깐 커지고 새 글자는 경고색 — 시선이 엑셀에 가 있어도 보이게
    T.set(wk, { scale: 1, transformOrigin: "50% 50%" }, 0);
    T.set(wkB, { color: TOK("--text") }, 0);
    T.to(wk, { scale: 1.3, duration: .16, ease: "power2.out" }, TW);
    T.to(wk, { scale: 1, duration: .32, ease: "power2.inOut" }, TW + .4);
    T.to(wkB, { color: TOK("--warn"), duration: .15 }, TW + .1);
    T.to(wkB, { color: TOK("--text"), duration: .3 }, 10.7);
    T.fromTo(ring, { opacity: .9, scale: .8 }, { opacity: 0, scale: 1.25, duration: .6, ease: "power2.out", immediateRender: false }, TW + .05);
    cue(TW + .05, "blip");
    // 담던 것을 구겨 버린다
    const GC = { x: XR.x + XR.w / 2, y: XR.y + 40 + (XR.h - 64) / 2 };
    T.set(pile, { scale: 1, rotation: 0, opacity: 1, transformOrigin: GC.x + "px " + GC.y + "px" }, 0);
    T.to(pile, { scale: .06, rotation: 38, opacity: 0, duration: .32, ease: "power2.in" }, 10.3);
    cue(10.3, "crumple");
    const ball = svg("svg", { class: "tz-ball", viewBox: "-35 -35 70 70" }, L);
    const br = rng(77);
    let bd = "";
    for (let k = 0; k < 12; k++) {
      const a = k / 12 * Math.PI * 2, r = (k % 2 ? 22 : 31) + br() * 5;
      bd += (k ? "L" : "M") + (Math.cos(a) * r).toFixed(1) + " " + (Math.sin(a) * r).toFixed(1);
    }
    svg("path", { d: bd + "Z" }, ball);
    svg("path", { d: "M-18 -6 L4 2 L14 -12 M-6 14 L6 4 L20 10", style: "fill:none" }, ball);
    T.set(ball, { x: GC.x - 35, y: GC.y - 35, scale: .3, opacity: 0, rotation: 0, transformOrigin: "50% 50%" }, 0);
    T.to(ball, { scale: 1, opacity: 1, duration: .14, ease: OUT }, 10.52);
    T.to(ball, { y: GC.y - 35 + 150, rotation: 70, opacity: 0, duration: .38, ease: "power2.in" }, 10.68);
    T.to(wk, { borderColor: TOK("--line"), duration: .3 }, 10.7);

    // 케이스마다 같은 노가다 — 다시 하나씩(둘만 보이고) · 「Case 2 · Case 3 …」 카운터가 돈다
    const pass2 = NAMES.slice(0, 2).map((n, c) => ({ chip: chipEl(n, fold), bars: barsFor(c, fold) }));
    const T4 = 10.95, STEP2 = .68;
    pass2.forEach((p, c) => carry(p.chip, p.bars, c, T4 + c * STEP2, STEP2));
    const cs = place(el("div", "tz-case", null, fold), XR.x + XR.w - 170, XR.y - 66);
    const csBox = el("div", "box", null, cs);
    const csN = TX.caseN.map((t) => el("span", null, t, csBox));
    el("span", "dots", "…", cs);
    T.set(cs, { opacity: 0, y: 10 }, 0);
    csN.forEach((s, i) => T.set(s, { yPercent: i ? 100 : 0 }, 0));
    T.to(cs, { opacity: 1, y: 0, duration: .3, ease: OUT }, 10.85);
    [11.55, 11.95, 12.2].forEach((t, i) => {
      T.to(csN[i], { yPercent: -100, duration: .18, ease: IO }, t);
      T.to(csN[i + 1], { yPercent: 0, duration: .18, ease: IO }, t);
    });
    CUR.hide(12.28);

    // ---------------- ③c 로컬에 갇힘(10-17 2차 — 2차 시각으로 직접, 10.90–13.30)
    // 엑셀 판 · 칩 · Case 카운터가 함께 파일 하나로 접혀 「내 PC」 모니터에 들어가고 자물쇠가 「철컥」 → 주인(아는 한 사람)은 왼쪽에서 실선으로 닿고 →
    // 오른쪽 동료 셋은 점선이 모니터 앞에서 막혀 「?」 — 시선이 왼 → 가운데 → 오른으로 한 번 흐르고 「남은 못 닿음」으로 끝나 ④ 「기존 → 개선」으로 잇는다.
    // 기존 구간이라 강조색(청록)을 쓰지 않는다(문제 표지 = --warn, 아는 사람 = --text, 나머지는 흐리게). 무대 글자는 「내 PC」 와 「?」 셋뿐.
    // 새 선은 모두 butt 끝 + 긋기 전 opacity 0 — 길이 0 인 둥근 끝이 점으로 남지 않게(⑥ LOB 점과 같은 실수를 되풀이하지 않는다). 주인 선 끝 점(r 6)은 일부러 넣은 표지다.
    MAP = false;
    const iso = el("div", "tz-layer", null, L);
    const isv = svg("svg", { class: "tz-svg", viewBox: "0 0 1920 1080" }, iso);
    const NSS = "vector-effect=\"non-scaling-stroke\"";
    // 모니터(화면 + 받침) · 화면 가운데 (960, 530)
    const mon = svg("g", null, isv);
    const scr = svg("rect", { x: 770, y: 410, width: 380, height: 240, rx: 16, style: "fill:var(--wafer);stroke:var(--built-line);stroke-width:2.5" }, mon);
    svg("rect", { x: 950, y: 651.5, width: 20, height: 32.5, style: "fill:var(--built-line)" }, mon);
    svg("rect", { x: 895, y: 684, width: 130, height: 9, rx: 4.5, style: "fill:var(--built-line)" }, mon);
    // 파일(Parts.ICON.file 모양 + 표 줄 = 엑셀 파일) 78 × 95
    const file = svg("g", null, isv);
    const fi = svg("g", { transform: "translate(921 482.3) scale(" + (78 / 18).toFixed(4) + ")" }, file);
    fi.innerHTML = "<path d=\"M1.5 1.5h9.5l5.5 5.5v13.5h-15z\" style=\"fill:var(--tip);stroke:var(--text);stroke-width:2.2;stroke-linejoin:round\" " + NSS + "/>" +
      "<path d=\"M11 1.5V7h5.5\" style=\"fill:none;stroke:var(--text);stroke-width:2.2;stroke-linejoin:round\" " + NSS + "/>" +
      "<path d=\"M4 11h10M4 14.5h10M4 18h10M8.5 9v11\" style=\"fill:none;stroke:var(--muted);stroke-width:1.5\" " + NSS + "/>";
    const person = (cx, cy, d, ic) => personNode(isv, cx, cy, d, ic);
    // 주인 — 왼쪽에서 실선으로 닿는다(끝 점은 모니터 왼쪽 테두리)
    const reach = svg("line", { x1: 564, y1: 530, x2: 770, y2: 530, style: "stroke:var(--text);stroke-width:3;stroke-linecap:butt" }, isv);
    const rdot = svg("circle", { cx: 770, cy: 530, r: 6, style: "fill:var(--text)" }, isv);
    const owner = person(520, 530, 88, 52);
    // 동료 셋 — 점선이 모니터 오른쪽 테두리(1150) 76px 앞에서 막힌다
    const DASH = [[1402.6, 374.2, 1221.1, 443.0], [1490, 530, 1226, 530], [1402.6, 685.8, 1221.1, 617.0]].map(([x1, y1, x2, y2]) => ({
      x1, y1, x2, y2, el: svg("line", { x1, y1, x2: x1, y2: y1, style: "stroke:var(--faint);stroke-width:2.5;stroke-dasharray:10 9;stroke-linecap:butt" }, isv),
    }));
    const peers = [[1440, 360], [1530, 530], [1440, 700]].map(([x, y]) => person(x, y, 80, 48));
    // 자물쇠 배지(덱 s01 LOCK_IC) · 「내 PC」 · 「?」 배지 셋
    const lockB = place(el("div", "tz-lockb", "<svg viewBox=\"0 0 22 24\"><path d=\"M3 11h16v11H3z\"/><path d=\"M6.5 11V7.5a4.5 4.5 0 0 1 9 0V11\"/></svg>", iso), 960, 410);
    const pc = place(el("div", "tz-pc", esc(TX.myPC), iso), 960, 728 - 17);
    const qbs = [[1202.4, 450.1], [1206, 530], [1202.4, 609.9]].map(([x, y]) => place(el("div", "tz-qb", esc(TX.qm), iso), x, y));

    // 처음 상태
    M.set(fold, { x: 0, y: 0, scale: 1, opacity: 1, transformOrigin: "1220px 540px" }, 0);
    M.set(file, { opacity: 0, scale: .5, svgOrigin: "960 530" }, 0);
    M.set(mon, { opacity: 0, scale: 1.12, svgOrigin: "960 530" }, 0);
    M.set(scr, { fill: TOK("--wafer") }, 0);
    M.set(pc, { opacity: 0 }, 0);
    M.set(lockB, { opacity: 0, scale: .2 }, 0);
    M.set(owner.g, { opacity: 0, y: 12 }, 0);
    M.set(owner.c, { stroke: TOK("--panel-line"), strokeWidth: 1.5 }, 0);
    M.set(owner.p, { stroke: TOK("--muted") }, 0);
    M.set(reach, { opacity: 0, drawSVG: "0%" }, 0);
    M.set(rdot, { scale: 0, svgOrigin: "770 530" }, 0);
    M.set(peers.map((o) => o.g), { opacity: 0, y: 12 }, 0);
    DASH.forEach((d) => M.set(d.el, { opacity: 0, attr: { x2: d.x1, y2: d.y1 } }, 0));
    M.set(qbs, { opacity: 0, scale: .3 }, 0);
    // 엑셀이 파일로 접혀 모니터 자리로(CAMP 무리는 걷힘). 판은 앞에서 빨리 줄어(power2.out — +0.22 에 0.24배) 파일 크기 가까이 작아진 뒤에야

    const LLX = 580, LLY = 214;

    // 10-18 P68 — 명단 틀 · 다른 띠는 바로 지우지 않고 .22 로 남겨(갈라짐이 「명단에서 나온다」로 읽히게) 띠가 반쯤 날아간 때(첫 착지 − .25)에 지운다.

    const TG = 15.75;

    const FOLDS = refCols.map((c) => LONG.foldBand(T, LLs, c.key, TG + .1, { dur: .35, pack: .3, stagger: .02 }));
    // 띠가 먼저 본 칸 가운데의 16칸 판(이름 6장 + 약식 10장)에 내려앉아 「기준정보 16종」으로 한 번 보인 뒤 왼쪽 시나리오 카드로 접힌다
    const GT = { w: 270, h: 60, gap: 18, cols: 4, y0: 436 };
    const GX0 = 1160 - (GT.cols * GT.w + (GT.cols - 1) * GT.gap) / 2;
    const GXk = (k) => GX0 + (k % GT.cols) * (GT.w + GT.gap);

    const fpx = (e) => parseFloat(getComputedStyle(e).fontSize) || 0;

    const NM_X = (parseFloat(getComputedStyle(gtiles[0]).borderLeftWidth) || 0) + nm0.offsetLeft;   // 칸 왼끝 → 이름 글자 왼끝(테두리 1.5 + 46)
    const HC_CY = LLs.chromeH + LLs.headH / 2;                                               // 띠 윗끝 → 머리글 세로 가운데
    const TFLY = 16.05, FLY_D = .75, FLY_ST = .05;
    const TARR0 = TFLY + FLY_D;                        // 첫 띠가 닿는 때
    let TARR = TARR0;
    refCols.forEach((c, n) => {
      const k = TBN.indexOf(c.table), at = TFLY + n * FLY_ST, arr = at + FLY_D;
      const x = GXk(k) + NM_X - (LLX + c.x);                                  // 머리글 왼끝 = 칸 이름 왼끝
      const y = GYm(k) - HC_CY * NM_S - LLY;                                  // 머리글 가운데 = 칸 가운데
      T.to(c.band, { x, y, scale: NM_S, duration: FLY_D, ease: IO }, at);
      // 값 줄은 띠가 떠나자마자 걷힌다(at + .02 → at + .24, 빨리 옅어지는 power2.out — 접힌 값이 위로 붙는 움직임(foldBand pack, 16.41–)보다 앞서, 날아가는
      // 띠 아래로 값이 끌려가며 따라붙는 그림이 남지 않게). 날아가는 동안은 머리글 낱말만 — 그 낱말이 칸 이름이 된다. 머리글은 칸 이름 색(--text)으로 밝아진다
      const vals = (FOLDS[n] && FOLDS[n].keep || []).map((kp) => kp.el);

      if (c.head) T.to(c.hc, { color: TOK("--text"), duration: .25, ease: "power1.inOut" }, arr - .4);

      const nm = gtiles[k].querySelector("span");

      T.to(c.band, { opacity: 0, duration: .1, ease: "power1.in" }, c.head ? arr - .02 : arr - .1);
      if (n < 3) cue(arr, "tok", { f: [760, 840, 920][n], g: .1 });
      TARR = Math.max(TARR, arr);
    });
    // 흐린 명단 틀 · 다른 띠는 값 줄이 걷히기 시작할 때 함께 걷히고(첫 착지 − .25), 나머지 칸(이름 둘 + 약식 열)은 명단이 다 걷힌 뒤(− .1) 선다 — 반투명 칸 뒤로 명단 글자가 비치지 않게
    T.to(llChrome.concat(otherBands), { opacity: 0, duration: .15, ease: "power1.in" }, TARR0 - .25);

  // ---------------------------------------------------------------- ⑦ 공정별 상세 (첫 판 24.95–29.4 → 2차 25.64–29.89 → 3차 25.02–28.61) · ⑧ 진척 (29.4–33.2 → 29.89–33.51 → 28.61–31.65)
  const ymd = (s) => { const [y, m, d] = s.split("-").map(Number); return Date.UTC(y, m - 1, d) / 864e5; };

    // 당길 호기 — 이름 · 단축 화살표 · 「−N일」이 함께 한 번 커졌다 작아진다(AWB43 이 가장 세게). 마지막 줄의 라벨이 다 선 뒤(28.0)

    // ---------------- ⑧ 진척 — 기준선(회색, 과거) 위로 현재 줄 · 효율 84 → 90 · −28일 → −15일 · 「13일 줄임」 · 12월 부족 → 해소(10-18 P67)
    //   레버 칩이 오르면 칩 왼끝 → AWB43 「현재」 점(●)으로 강조색 실선 곡선이 줄 위로 넘어와 닿고(원인 → 대상), ◀ 이 −28 → −15일로 줄어든다.
    //   선이 걷힌 뒤 「13일 줄임」 이 서고, 그다음 흐린 AWB41 · 44 · 45 의 ◀ 이 ● 쪽으로 걷혀 들어간다(당길 필요가 없어짐 — 날짜 줄도 기존 Qual 만 남긴다).
    //   마지막에 12월 「해소」 — 칸 바탕이 부족색 → 강조색. 한 번에 한 시선(10-18 비평 반영).
    //   (효율 90 이면 소요 40.6 → 12월 공식 확보율 103.4% 로 부족 기준 99.5% 를 넘는다. Qual 당김은 공식 확보율을 바꾸지 않는다 — SPEC 「지킬 것」)
    //   선은 점선이 아니라 실선이다 — 점선은 「다음 단계」 몫(덱 문법)이고, 이 선은 이미 일어난 진척의 원인을 가리킨다.
    const U0 = units[0];
    const NEWDAYS = TX.newDays, NEWT = (function () { const t = new Date((ymd(U0.u.base) - NEWDAYS) * 864e5); return t.toISOString().slice(0, 10); })();
    const xNew = dx(plus1(NEWT));
    // 과거 줄(회색 ◀━○) — 처음엔 현재 줄과 같은 자리에서 보이지 않는다
    const gp = svg("g", null, svg3);
    svg3.insertBefore(gp, U0.g);
    svg("line", { x1: U0.xt.toFixed(1), x2: U0.xb.toFixed(1), y1: U0.cy, y2: U0.cy, style: "stroke:var(--faint);stroke-width:3;stroke-linecap:round" }, gp);
    const ptri = svg("path", { d: "M-9 0 L8 -9 L8 9 Z", style: "fill:var(--faint)" }, gp);
    gsap.set(ptri, { x: U0.xt, y: U0.cy });
    svg("circle", { cx: U0.xb.toFixed(1), cy: U0.cy, r: 7.5, style: "fill:var(--surface);stroke:var(--faint);stroke-width:2.5" }, gp);
    const plab = el("div", "tz-dd old", "−" + U0.u.days + "일", g3);
    place(plab, U0.xt - 18 - 90, U0.cy + 9 - 17, 90);
    plab.style.textAlign = "right";
    const clab = place(el("div", "tz-dd", "−" + NEWDAYS + "일", g3), xNew + 4, U0.cy - 48);
    const UPX = 1330;
    const up = place(el("div", "tz-up", "<svg viewBox=\"0 0 24 24\" fill=\"none\" style=\"stroke:currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 19V5M6 11l6-6 6 6\"/></svg>" + esc(TX.lever), g3), UPX, U0.cy - 24 - 9);
    const cut = place(el("div", "tz-cut", TX.cut, g3), U0.xb + 30, U0.cy - 9 - 20);
    const dt2 = place(el("div", "tz-ud", mmdd(U0.u.base) + " → " + mmdd(NEWT), g3), 144, U0.cy + 4);
    // 칩 → 현재 점 잇는 선(butt 끝 · 긋기 전 투명 — 길이 0 끝 점이 남지 않게). 10-18 비평 반영 — 시간 줄(◀━●)과 같은 높이의 수평선이면 「AWB43 줄이 칩까지
    // 늘어났다」 로 읽혀서, 줄 위로 둥글게 넘어가는 곡선 하나로 바꿨다: 칩 왼끝 위에서 출발해 줄 위(약 38px)를 넘어 ● 의 오른쪽 위로 내려앉는다(끝 4px 앞에서 멈춤).
    // 화살촉은 달지 않는다 — ◀(목표 기여 시작)과 같은 세모로 읽힌다. 방향은 긋는 움직임(칩 → ●)이 말한다.
    const LKY = U0.cy - 9, LK = { sx: UPX + 8, sy: LKY - 20, ex: U0.xb + 7, ey: LKY - 12 };
    const link = svg("path", { d: "M" + LK.sx + " " + LK.sy + " C" + (LK.sx - 40) + " " + (LKY - 52) + " " + (LK.ex + 46) + " " + (LKY - 54) + " " + LK.ex.toFixed(1) + " " + LK.ey,
      style: "fill:none;stroke:var(--accent);stroke-width:1.5;stroke-linecap:butt" }, svg3);
    // 흐린 세 호기 — 당길 필요가 없어지면 날짜 줄은 기존 Qual 하나만(「12.22 → 11.20」 이 남지 않게)
    const rest = units.slice(1);
    const dtKeep = rest.map((o) => place(el("div", "tz-ud", mmdd(o.u.base), g3), 144, o.cy + 4));
    // 12월 상태(머리 줄) — 「부족」 → 「해소」
    const pS = place(el("div", "tz-pill", TX.short, CVG), X0 + DEC * MW + MW / 2 + 6, CV.y + 8);
    pS.style.background = "var(--short)";
    const pO = place(el("div", "tz-pill", TX.solved, CVG), X0 + DEC * MW + MW / 2 + 6, CV.y + 8);
    pO.style.background = "var(--accent)";              // 앱 진척 패널의 「해소」 는 강조색(shortening_progress_panel.py) — 판정색 「확보」(--ok)와 섞지 않는다
    T.set(gp, { opacity: 0, y: 0 }, 0);
    T.set(dt2, { opacity: 0 }, 0);
    T.set(plab, { opacity: 0 }, 0);
    T.set(clab, { opacity: 0, x: 0, y: -9 }, 0);
    T.set(up, { opacity: 0, y: 30 }, 0);
    T.set(cut, { opacity: 0, scale: .85, transformOrigin: "0% 50%" }, 0);
    T.set(link, { opacity: 0, drawSVG: "0%" }, 0);
    T.set(dtKeep, { opacity: 0 }, 0);
    T.set([pS, pO], { opacity: 0 }, 0);
    T.set(mh[DEC], { x: 0 }, 0);
    T.set(U0.line, { attr: { x1: U0.xt } }, 0);
    // 화면 정리 — KPI · ① · ② 가 걷히고 ③ 이 위로(머리는 「진척 비교」로)
    const T8 = 29.4;
    T.to(kpis.concat([g1, g2]), { opacity: 0, duration: .3, ease: "power1.in" }, T8);
    T.to(h1, { opacity: 0, duration: .2 }, T8 + .02);
    T.to(h1b, { opacity: 1, duration: .3 }, T8 + .26);   // 옛 이름이 다 걷힌 뒤(10-17 비평 #5)
    const DY = -194;
    T.set(g3, { y: 0 }, 0);
    T.set(CVG, { y: 0 }, 0);
    T.to(g3, { y: DY, duration: .6, ease: IO }, T8 + .15);
    // 접힌 캔버스(290–742, CVW 로 KDY 만큼 내려 있음)를 머리 아래 빈자리의 세로 가운데로(위 · 아래 여백이 같게 — 고치기 전과 같은 자리)
    const CVT = CV.y + KDY;
    T.to(CVG, { y: Math.round(((H - (CVT + CV.h + DY)) - (CVT - 134)) / 2), duration: .6, ease: IO }, T8 + .15);
    T.to(cv, { height: CV.h + DY, duration: .6, ease: IO }, T8 + .15);
    T.to([band, curCol], { height: "+=" + DY, duration: .6, ease: IO }, T8 + .15);
    T.to(lg1, { opacity: 0, duration: .25 }, T8 + .45);
    T.to(lg2, { opacity: 1, duration: .25 }, T8 + .6);
    T.to(units.slice(1).map((o) => [o.nm, o.dt, o.g, o.lab, o.dia]).flat().filter(Boolean), { opacity: .32, duration: .3 }, T8 + .5);
    T.to(mh[DEC], { x: -40, duration: .3, ease: IO }, T8 + .55);
    T.to(pS, { opacity: 1, duration: .25 }, T8 + .6);
    // 기준선이 갈라진다 — 과거(회색)는 아래로, 현재(진한 선)는 위로
    const TB0 = 29.95;
    T.to(gp, { opacity: 1, y: 9, duration: .35, ease: OUT }, TB0);
    T.to([U0.g], { y: -9, duration: .35, ease: OUT }, TB0);
    T.to(U0.lab, { y: -9, duration: .35, ease: OUT }, TB0);
    T.to(plab, { opacity: 1, duration: .3 }, TB0 + .1);
    // 효율 칩이 오른다(3차 29.33) → 칩 왼끝에서 AWB43 현재 점(●)으로 선이 닿는다(29.58–29.83) → 현재 ◀ 이 −28일 → −15일 로 줄어든다(29.82)
    T.to(up, { opacity: 1, y: 0, duration: .4, ease: OUT }, 30.3);
    cue(30.32, "tick", { f: 1400, g: .09 });
    const TLK = 30.62;
    T.set(link, { opacity: 1 }, TLK);
    T.to(link, { drawSVG: "100%", duration: .31, ease: "power2.out" }, TLK);
    const TS = 30.92, SD = .7;
    T.to(U0.tri, { x: xNew, duration: SD, ease: IO }, TS);
    T.to(U0.line, { attr: { x1: xNew }, duration: SD, ease: IO }, TS);
    T.to(U0.lab, { x: xNew - U0.xt, duration: SD, ease: IO }, TS);
    // 옛 「−28일」 은 움직이는 중에 먼저 걷히고(TS + .4 에 다 걷힘) 새 「−15일」 은 그 뒤에 선다 — 두 글자가 한 자리에서 겹쳐 비치는 프레임이 없게
    T.to(U0.lab, { opacity: 0, duration: .15 }, TS + .25);
    T.to(clab, { opacity: 1, duration: .2 }, TS + .48);
    T.to(U0.dt, { opacity: 0, duration: .15 }, TS + .25);
    T.to(dt2, { opacity: 1, duration: .2 }, TS + .48);
    cue(TS, "down");
    // 「13일 줄임」 — 선은 그보다 먼저 걷혀(TCUT − .15) 알약이 설 때는 없다
    const TCUT = 31.68;
    T.to(link, { opacity: 0, duration: .2, ease: "power1.in" }, TCUT - .15);
    T.to(cut, { opacity: 1, scale: 1, duration: .3, ease: "back.out(1.8)" }, TCUT);
    cue(TCUT + .02, "tick", { f: 1250, g: .09 });
    // 흐린 세 호기 — ◀ 이 ● 쪽으로 걷혀 들어가 ● 밑에서 사라진다(당길 필요 없음). 10-18 비평 반영 — 전에는 AWB43 의 −28 → −15일 이동과 같은 0.4초에 돌아
    // 화살촉 셋이 주 시선과 겨뤘다. 이제 「13일 줄임」 뒤 · 「해소」 앞의 빈 박에 따로 둔다(3차 30.50–30.80 → 해소 30.85):
    // 효율 칩 → 선 → AWB43 −15일 → 13일 줄임 → 나머지 셋 걷힘 → 12월 해소.
    const TR8 = TCUT + .08, RD8 = .38;
    rest.forEach((o, k) => {
      T.to(o.lab, { opacity: 0, duration: .16 }, TR8);
      T.to(o.tri, { x: o.xb, duration: RD8, ease: IO }, TR8);
      T.to(o.line, { attr: { x1: o.xb }, duration: RD8, ease: IO }, TR8);
      T.to(o.tri, { opacity: 0, duration: .14, ease: "power1.in" }, TR8 + RD8 - .14);
      T.to(o.dt, { opacity: 0, duration: .14 }, TR8 + .1);
      T.to(dtKeep[k], { opacity: .32, duration: .2 }, TR8 + .24);
    });
    // 12월 부족 → 해소 — 칸 바탕도 부족색 → 강조색(띠 아래 부족색 줄은 걷힌다)
    T.to(pS, { opacity: 0, duration: .25 }, 32.2);
    T.to(pO, { opacity: 1, duration: .25 }, 32.2);
    T.fromTo(pO, { scale: 1.2 }, { scale: 1, duration: .35, ease: "back.out(2)", immediateRender: false }, 32.2);
    T.to(band, { backgroundColor: TOK("--accent"), opacity: .1, duration: .3 }, 32.2);
    T.to(strip, { opacity: 0, duration: .4 }, 32.2);
    cue(32.2, "bright");
    // AI 장면으로(0.2초 앞당겨 AI 답을 읽을 시간을 늘린다)
    T.to(P, { opacity: 0, duration: .3, ease: "power1.in" }, 33.2);
  }

  // ---------------------------------------------------------------- ⑨ AI (첫 판 33.2–36.85 → 2차 33.51–37.0 → 3차 31.65–34.68) — 점선 AI 층(점선 = 설계, 덱 s11 처럼 꼬리표 없이). 앱 Capa Chatbot 은 LLM 연결 전이다.
  function sceneAI() {
    const L = layer(33.2, 36.95);
    const AIL = { x: 220, y: 240, w: 1480, h: 514 };   // 10-17 — 머리 줄(꼭지 · 부제목) 아래로 44px 내림

    const node = place(el("div", "tz-ai", TX.ai, L), AIL.x + 64, AIL.y);
    // 질문 말풍선 — 글자가 하나씩

    const bt = bub.firstChild, bc = bub.lastChild;
    bt.textContent = TX.ask;
    bub.style.width = (bub.offsetWidth + 2) + "px";
    const chars = [...TX.ask];
    const typ = prop(0, (n) => { const k = Math.round(n); const s = chars.slice(0, k).join(""); if (bt.textContent !== s) bt.textContent = s; });
    // 답 카드(실선 — 앱 Chatbot 답 칸과 같은 윤곽) · 결론 · 할 일 · 근거 칩 셋
    const ANS = { x: AIL.x + 110, y: AIL.y + 140, w: 1260, h: 330 };
    const ans = place(el("div", "tz-ans", null, L), ANS.x, ANS.y, ANS.w, ANS.h);
    const LX = ANS.x + 36, TXX = ANS.x + 170;
    const rowsY = [ANS.y + 30, ANS.y + 124, ANS.y + 226];
    const labs = TX.aL.map((t, i) => place(el("div", "tz-al", t, L), LX, rowsY[i] + 2));
    const a1 = place(el("div", "tz-at", "<span class=\"s\">" + esc(TX.a1[0]) + "</span>" + esc(TX.a1[1]), L), TXX, rowsY[0]);
    const a2 = place(el("div", "tz-at", esc(TX.a2), L), TXX, rowsY[1]);
    a2.style.fontSize = "32px";
    const SW = 300, SG = 22;
    const slots = TX.ev.map((t, i) => place(el("div", "tz-slot", null, L), TXX + i * (SW + SG), rowsY[2], SW, 48));
    const evs = TX.ev.map((t, i) => {
      const c = el("div", "tz-ev", esc(t), L);
      const w = c.offsetWidth;
      const dst = { x: TXX + i * (SW + SG) + (SW - w) / 2, y: rowsY[2] };
      const src = { x: 260 + i * 520, y: 1000 };
      T.set(c, { x: src.x, y: src.y, opacity: 0, scale: .9 }, 0);
      return { c, dst };
    });
    T.set([lay, node, bub, ans].concat(labs, [a1, a2], slots), { opacity: 0 }, 0);
    T.set(lay, { scale: .985, transformOrigin: "50% 50%" }, 0);
    T.set(typ, { v: 0 }, 0);
    T.set(bc, { opacity: 0 }, 0);
    T.set([a1, a2], { y: 10 }, 0);
    T.to(lay, { opacity: 1, scale: 1, duration: .4, ease: OUT }, 33.35);
    T.to(node, { opacity: 1, duration: .3 }, 33.4);
    T.to(bub, { opacity: 1, duration: .2 }, 33.5);
    T.set(bc, { opacity: 1 }, 33.55);
    const TQ = 33.6, TQD = .7;
    for (let k = 1; k <= chars.length; k++) {
      const t = TQ + (k / chars.length) * TQD;
      T.set(typ, { v: k }, t);
      if (k % 3 === 1 && chars[k - 1] !== " ") cue(t, "type", { g: .18, f: 2600 + (k % 5) * 120 });
    }
    T.set(bc, { opacity: 0 }, 34.4);
    T.to(ans, { opacity: 1, duration: .3 }, 34.35);
    T.to(labs[0], { opacity: 1, duration: .25 }, 34.4);
    T.to(a1, { opacity: 1, y: 0, duration: .35, ease: OUT }, 34.42);
    T.to(labs[1], { opacity: 1, duration: .25 }, 34.65);
    T.to(a2, { opacity: 1, y: 0, duration: .35, ease: OUT }, 34.68);
    T.to([labs[2]].concat(slots), { opacity: (i) => (i ? .5 : 1), duration: .25, stagger: .04 }, 34.9);
    // 근거 칩 셋 — 0.2초 간격 · 0.3초 비행, 35.75 에 다 붙는다(마지막 칩도 0.9초 보인다)
    evs.forEach((e, i) => {
      const t = 35.05 + i * .2;
      T.to(e.c, { opacity: 1, duration: .12 }, t);
      T.to(e.c, { x: e.dst.x, y: e.dst.y, scale: 1, duration: .3, ease: IO }, t);
      T.to(slots[i], { opacity: 0, duration: .12 }, t + .26);
      cue(t + .3, "tick", { f: 1100 + i * 150, g: .12 });
    });
    // 퇴장은 다음 질문이 들어오기 전에 끝난다(글자 위에 글자가 겹치지 않게)
    T.set(L, { opacity: 1 }, 0);
    T.to(L, { opacity: 0, duration: .25, ease: "power1.in" }, 36.6);
  }

  // ---------------------------------------------------------------- ⑩ 답 · 다리 · 입장 화면 (3차 시각으로 직접 — 34.68–40.0, 39.43–40.0 정지)
  // ⑩a 34.68 처음 질문이 돌아오고 답 「부족 2대 → 해소」 → 36.00 걷힘.
  // ⑩b 다리(10-17 3차, 사용자 A안): 영상에서 본 화면이 작은 카드 여섯 장으로 한 줄에 모이고(36.15) → 카드마다 차례로 ✓(구현, 36.335 부터 0.065초 간격) —
  //   AI 카드(「Capa Chatbot」)만 ⑨ 처럼 점선으로 남고 ✓ 대신 빈 점선 원(36.66) → 그다음 아래에 문구 「AX 실행관리, 플랫폼 위에 모두 구현됩니다.」(36.72) →
  //   카드가 가운데로 빨려 들고(38.56–38.90) 그 자리에서 앱 심볼이 돋는다. 문구는 원형 펼침이 닿기 전(39.03)에 다 걷힌다.
  // ⑩c 38.90 원형 펼침 → 앱 입장 화면(Capa Web — 제목 = 웹 이름 「S.PKG CAPA」 + 부제 「AX Management」) → 39.43 부터 정지.
  // ✓ 는 「구현」 뜻으로만 쓴다(공정 Capa 상세는 구현됐지만 아직 내보내지 않은 화면이고, 영상 화면은 다시 그린 모션이다). 카드는 글자보다 그림으로 — 각 장면 부품을 작게 다시 그린
  // 축소 그림 + 짧은 이름표(24px, 앱 이름표 원문 · 영상 부제목 낱말). 숫자는 넣지 않는다(샘플 배지는 ⑨ 끝에 꺼진다).
  // 간격 20 — ✓ 원이 카드 오른쪽 밖으로 12px(+ 바탕색 테 4px) 걸쳐도 옆 카드에 닿지 않는다. 이름표 「Capa LOB Summary」(24px 약 234px)도 양옆 14px 남는다
  const FC = { w: 262, h: 224, gap: 20, y: APP.cy - 112 };   // 카드 한 줄 — 가운데 y 508 = 앱 심볼 가운데 → 빨려 든 자리에서 심볼이 돋는다
  FC.x0 = (W - (6 * FC.w + 5 * FC.gap)) / 2;               // 124 — 카드 k 의 왼쪽 = 124 + 282k
  // 축소 그림(SVG 220 × 132, 덱 팔레트 토큰만) — 0 시나리오 등록 · 1 리비전 · 2 Capa LOB Summary · 3 공정 Capa 상세 · 4 진척 비교 · 5 Capa Chatbot
  function miniPic(k) {
    const S = (o) => " style=\"" + o + "\"";

    T.to(map.front, { v: 1.06, duration: .477, ease: "power1.inOut" }, RA + .048);
    T.to(map.svg, { rotation: 3, duration: RD, ease: "power1.out" }, RA);
    cue(RA, "swell", { g: .18, d: 1.2 });
    // 문구 — 열리는 원이 문구 자리에 닿기(약 RA + .14) 전에 다 걷힌다(38.92 부터 .11초 → 39.03). 원이 문구를 잘라 조각이 남거나(전에는 39.067 「AX 실행관리 … 현됩니다.」),
    // 입장 화면 가림막 밑에 「AX 실행관리」 잔상이 부제 「AX Management」 와 함께 보이는 프레임이 없다(3차 비평 V2 · T4 · F11). 38.92–39.03 은 심볼이 터지며 원이 여는 사이 문구만 빠진다
    T.to(fin, { opacity: 0, duration: FOD, ease: "power1.in" }, TFO);
    const te = RA + .153;
    [[logo, 0], [brand, 1], [title, 2], [sub, 3], [load, 4], [actions, 5]].forEach(([e, k]) => {
      T.to(e, { opacity: 1, y: 0, duration: .248, ease: OUT }, te + k * .024);
    });
    T.to(fills, Object.assign({ scaleX: 1, duration: .1336, stagger: .0286, ease: OUT }, F2D), 39.141);
    cue(39.33, "end");
  }

  // ---------------------------------------------------------------- 꼭지 · 부제목(머리 줄 — 덱 ctx.header 자리 · 결, 2차 시각으로 적고 R3 로 3차 시각에)
  // 왼쪽 위(120, 84)에 꼭지 알약 + 그 옆 부제목 한 줄. 꼭지는 색 · 모양으로 가른다:
  //   기존 = 회색 테두리 · 각진 모서리 / 개선 = 강조색 채움 · 둥근 알약 / 개선 · 실행관리 = 개선과 같은 결로 늘어남 / 확산 · AX = 강조색 점선 테두리(점선 = 설계). 처음 보는 사람이 AX 를 모를 수 있어 「확산」을 붙였다(10-17 사용자 결정)
  // ④ 앞 — 화면이 빈 사이 꼭지가 무대 가운데로 커져 와서 「기존」 → 「개선」 음절이 하나씩 뒤집히고(색 · 모양도 함께) 제자리로 돌아간다.
  // 부제목은 한국어 약 6~8자/초로 읽을 만큼 떠 있다(SPEC 「10-17 2차 개선」 절의 머리 줄 표). 「기존」 꼭지는 ① b 질문 장면부터(4.45) 선다.
  function sceneHeader() {
    const O = (t) => A1.at(t);                         // 첫 판 장면 시각 → 2차 시각(3차 시각으로는 T.* 가 R3 로 옮긴다 — 두 번 옮기지 않게 ANCH 만)
    const box = el("div", "tz-hd", null, stage);
    const pill = el("div", "tz-kp", null, box);
    const sy = el("span", "sy", null, pill);
    const nw = [...TX.kNew];
    const sl = [...TX.kOld].map((ch, i) => {
      const c = el("span", "sl", null, sy);
      return { a: el("span", "a", ch, c), b: el("span", "b", nw[i] || "", c) };
    });
    const ex = el("span", "tx", esc(TX.kExec), pill);
    const ax = el("span", "tx ax", esc(TX.kAX), pill);
    const PADX = 20, BW = 2, GAP = 26;
    const wOf = (e) => Math.ceil(e.offsetWidth) + PADX * 2 + BW * 2;
    const wOld = wOf(sy), wExec = wOf(ex), wAX = Math.max(wOf(ax), 88);
    ax.style.left = Math.round((wAX - BW * 2 - ax.offsetWidth) / 2) + "px";
    const st = el("div", "tz-st", null, box);
    const subs = {};
    Object.keys(TX.sub).forEach((k) => { subs[k] = el("span", null, esc(TX.sub[k]), st); });
    const C = { muted: TOK("--muted"), acc: TOK("--accent"), surf: TOK("--surface"), text: TOK("--text") };
    const CLEAR = "rgba(95,184,172,0)", FILL = "rgba(95,184,172,1)";
    T.set(pill, { width: wOld, opacity: 0, x: 0, y: 0, scale: 1, transformOrigin: "50% 50%", borderColor: C.muted, color: C.text,
      backgroundColor: CLEAR, borderRadius: 8, borderStyle: "solid" }, 0);
    T.set(sl.map((o) => o.a), { yPercent: 0 }, 0);
    T.set(sl.map((o) => o.b), { yPercent: 105 }, 0);
    T.set(sy, { opacity: 1 }, 0);
    T.set([ex, ax], { opacity: 0 }, 0);
    T.set(st, { x: wOld + GAP, opacity: 1 }, 0);
    T.set(Object.values(subs), { opacity: 0, y: 12 }, 0);
    let cur = null;
    const hideSub = (t) => { if (cur) T.to(subs[cur], { opacity: 0, y: -8, duration: .22, ease: "power1.in" }, t); cur = null; };
    const show = (k, t) => {
      const lag = cur ? .24 : 0;                       // 옛 부제목이 걷히는 0.22초보다 늦게(10-17 비평 #5)
      hideSub(t);
      T.to(subs[k], { opacity: 1, y: 0, duration: .4, ease: OUT }, t + lag);
      cur = k;
    };
    // ② 기존 — 질문 장면부터(10-17 2차, 사용자 원문 「기존 - 12월 Pre B/D 확보율은?」 순서). 로크업이 다 걷힌(4.45) 뒤 질문 첫 낱말(4.46) 바로 앞에 선다
    //   — 웹 이름 로크업 위에 「기존」 이 함께 보여 브랜드를 「기존」 으로 읽지 않게(10-17 비평 V4)
    const T3 = 4.45;
    T.fromTo(pill, { opacity: 0, x: -14 }, { opacity: 1, x: 0, duration: .35, ease: OUT, immediateRender: false }, T3);
    cue(T3, "tick", { f: 660, g: .07 });
    // ③ 질문이 걷히고 엑셀 판이 서는 때 · DB 가 바뀌는 순간 「처음부터 다시」 · ③c 파일이 갇히는 때 「로컬에 갇혀 …」
    show("manual", 6.30);
    show("redo", 9.05);
    show("iso", 11.10);
    hideSub(13.45);                                     // 쓸림(13.30) 뒤 0.15초 — 그림이 나간 빈 무대에서 마저 읽힌다
    // ④ 꼭지 변신 — 고립 장면이 쓸려 나간 빈 무대에서
    const TF = 13.47, TM = 13.91, TBK = 14.61, SYL = .13;
    T.to(pill, { x: 960 - (120 + wOld / 2), y: 540 - (84 + 28), scale: 3, duration: .40, ease: IO }, TF);
    sl.forEach((o, i) => {
      T.to(o.a, { yPercent: -105, duration: .32, ease: "power3.inOut" }, TM + i * SYL);
      T.to(o.b, { yPercent: 0, duration: .32, ease: "power3.inOut" }, TM + i * SYL);
    });
    T.to(pill, { borderColor: C.acc, backgroundColor: FILL, color: C.surf, borderRadius: 28, duration: .3, ease: "power2.inOut" }, TM);
    T.to(pill, { scale: 3.25, duration: .13, ease: "power2.out" }, TM + .46);
    T.to(pill, { scale: 3, duration: .11, ease: "power2.inOut" }, TM + .59);   // 제자리로 가기(TBK) 전에 끝낸다 — 겹치면 TBK 트윈의 시작 크기가 seek 경로마다 달라진다
    cue(TM, "flip");
    T.to(pill, { x: 0, y: 0, scale: 1, duration: .38, ease: IO }, TBK);
    show("click3", 14.91);
    // ⑤ 리비전 · ⑥ 결합 → LOB
    show("rev", O(18.4));
    show("lob", 21.95);
    // ⑦ 개선 · 실행관리 — 알약이 늘어나며 「· 실행관리」가 드러난다(「개선」 글자는 제자리)
    hideSub(25.62);
    const TE = 25.71;
    T.to(pill, { width: wExec, duration: .45, ease: IO }, TE);
    T.to(sy, { opacity: 0, duration: .12 }, TE);
    T.to(ex, { opacity: 1, duration: .12 }, TE);
    T.to(st, { x: wExec + GAP, duration: .45, ease: IO }, TE);
    cue(TE, "tick", { f: 990, g: .07 });
    show("pcd", TE + .15);
    show("prog", O(29.4));
    // ⑨ 확산 · AX — 점선 알약(점선 = 설계, 덱 S11 결)
    const TA = O(33.2) + .02;
    T.to(pill, { width: wAX, backgroundColor: CLEAR, color: C.acc, duration: .4, ease: IO }, TA);
    T.set(pill, { borderStyle: "dashed" }, TA + .2);
    T.to(ex, { opacity: 0, duration: .15 }, TA);
    T.to(ax, { opacity: 1, duration: .2 }, TA + .15);
    T.to(st, { x: wAX + GAP, duration: .4, ease: IO }, TA);
    cue(TA, "tick", { f: 1180, g: .07 });
    show("ai", TA + .1);
    // ⑩ 답 · 입장 화면 — 꼭지 없이
    const TO = O(36.6);
    hideSub(TO);
    T.to(pill, { opacity: 0, duration: .25, ease: "power1.in" }, TO);
  }

  // ---------------------------------------------------------------- 전역 샘플 배지(숫자가 있는 장면 — LOB 는 자기 배지를 단다, 2차 시각 → R3)
  function sampleBadge() {
    const O = (t) => A1.at(t);                         // 첫 판 시각 → 2차 시각(T.* 가 R3 로 3차 시각에)
    const b = el("span", "badge sample tz-sample", TX.sample, stage);
    T.set(b, { autoAlpha: 0 }, 0);
    T.set(b, { autoAlpha: 1 }, O(15.1));
    T.set(b, { autoAlpha: 0 }, 21.95);
    T.set(b, { autoAlpha: 1 }, 25.64);
    T.set(b, { autoAlpha: 0 }, O(36.85));
  }

  // ---------------------------------------------------------------- 짓기
  function build() {
    const E = Parts.eases();
    IO = E.io; OUT = E.out;
    IN = CustomEase.create("tzIn", ".5,0,.75,0");
    CUR.init();
    sceneSymbol();                                      // 2차 시각
    sceneTitle();                                       // 2차 시각(층 순서: 물방울 < 제목 < CAMP)
    MAP = true; sceneManual(); sceneApp(); MAP = false; // 첫 판 시각 → 2차 시각(층 · ③c 고립 · ⑤ 끝의 결합 앞머리는 2차 시각)
    sceneLob();                                         // 2차 시각 → R3
    MAP = true; scenePcd(); sceneAI(); MAP = false;     // 첫 판 시각 → 2차 → 3차(R3)
    V3 = false; sceneEnd(); V3 = true;                  // 3차 시각으로 직접(⑩ 답 · 다리 · 입장 화면)
    sceneHeader();                                      // 2차 시각 → R3
    sampleBadge();
    stage.appendChild(CUR.el);
    M.set({}, {}, DUR);
    CUES.sort((a, b) => a.t - b.t);
    M.eventCallback("onUpdate", () => { for (const f of FLUSH) f(); });
    // 처음 화면 — 정확히 0 초에는 서지 않는다(T_MIN). 0 초의 set 들이 모두 앞에 놓여 되감아도 풀리지 않는다.
    M.seek(T_MIN, false);
  }

  // ---------------------------------------------------------------- 무대 맞춤 · 재생 · 소리
  function fit() {
    const s = Math.min(innerWidth / W, innerHeight / H);
    stage.style.transform = "scale(" + s + ")";
  }
  let actx = null, mst = null, sess = null, muted = false, audioAt = 0, audioFrom = 0, rate = 1;   // rate = 재생 속도(아래 「재생 속도」)
  let tickAt = 0;                                     // 마지막 gsap 틱의 벽시계(ms) — startAudio 가 그림이 갈 자리를 내다볼 때 쓴다
  function ensureAudio() {
    if (!window.TZSound) return;
    try {
      if (!actx) { actx = new (window.AudioContext || window.webkitAudioContext)(); mst = TZSound.master(actx); }
      if (actx.state === "suspended") actx.resume();
      mst.vol.gain.value = muted ? 0 : .82;
    } catch (e) { actx = null; }
  }
  let tails = [];                                     // 속도 바꿈으로 물러난 세션 — 이미 울리기 시작한 효과음이 제 길이대로 끝나게 둔다. 멈춤 · 되감기 · 새 재생 때 같이 닫는다
  function stopAudio() { tails.forEach((s) => s.stop()); tails = []; if (sess) { sess.stop(); sess = null; } }
  // hand = 속도 바꿈 때만 { at: 넘기는 오디오 시각, lo: 앞 세션 handover 가 돌려준 아래 끝 } — 앞 세션을 닫지 않고 이어받는다
  function startAudio(hand) {
    if (!hand) stopAudio();
    if (!actx) return;
    // 그림은 다음 틱에서 「마지막 틱 이후 흐른 시간 × rate」 만큼 나아간다(이어 재생 · 속도 바꿈 모두 GSAP 이 마지막 틱 자리에서 다시 잇는다).
    // 그래서 소리가 시작되는 audioAt(0.04초 뒤)에 그림이 있을 자리를 audioFrom 으로 잡는다 — 지금 자리(M.time())로 잡으면 그림이 소리보다
    // (한 프레임 + 0.04초) × rate 앞서, 맞춤이 0.05초를 넘었다고 그림을 뒤로 당겼다(속도 바꿀 때 −0.02 ~ −0.04초, 10-17 측정).
    // 아래 끝 lo ~ audioFrom 사이의 큐는 build 가 소리 시작 순간에 몰아 낸다(늦어야 한 프레임 + 0.04초 — 전에는 모든 큐가 그만큼 늦었다).
    // lo = 처음 재생 · 이어 재생은 지금 자리, 속도 바꿈은 앞 세션이 소리 내지 못한 첫 큐(그 앞의 큐는 앞 세션이 이미 냈다 — 두 번 나지 않게).
    const now = M.time(), gap = Math.min(.1, Math.max(0, (performance.now() - tickAt) / 1000));
    audioFrom = Math.min(DUR, now + (gap + .04) * rate);
    audioAt = hand ? hand.at : actx.currentTime + .04;
    sess = TZSound.build(actx, mst.input, CUES, audioFrom, audioAt, rate, hand ? hand.lo : now - .005);
  }
  // 소리와 그림을 맞춘다 — 재생 중 오디오 시계와 0.05초 넘게 벌어지면 타임라인 재생 위치를 오디오 시계로 옮긴다(움직임은 여전히 타임라인 안).
  // 오디오 1초 = 타임라인 rate 초(소리는 build 가 같은 비율로 늘여 예약했다)
  gsap.ticker.add(() => {
    tickAt = performance.now();
    if (!sess || !actx || M.paused()) return;
    const want = audioFrom + (actx.currentTime - audioAt) * rate;
    if (want >= 0 && want < DUR && Math.abs(M.time() - want) > .05) M.time(want);
  });

  // ---------------------------------------------------------------- 재생 속도(1 · 0.75 · 0.5) — 그림은 M.timeScale, 소리는 build 의 rate(피치 그대로 시간만 늘임)
  // 시작 속도 = ?speed= (목록 밖 값은 1) → 기억한 값(localStorage — 없거나 막혀도 1 로 돈다) → 1. 캡처(?capture)는 늘 1 이고 timeScale 을 건드리지 않는다
  // (seek · 내보내기 · renderAudio 는 속도와 무관하다 — seek 은 타임라인 시각 그대로, renderAudio 는 rate 1).
  const RATES = [1, .75, .5], RATE_KEY = "capa-teaser-speed";
  const rateOk = (v) => { const r = v == null || String(v).trim() === "" ? NaN : Number(v); return RATES.indexOf(r) >= 0 ? r : null; };
  const rateText = (r) => r + "×";                   // 1× · 0.75× · 0.5× — 「×」(U+00D7)는 CapaSans 서브셋에 있다
  function rateAtStart() {
    if (CAPTURE) return 1;
    if (QS.has("speed")) return rateOk(QS.get("speed")) || 1;
    try { return rateOk(localStorage.getItem(RATE_KEY)) || 1; } catch (e) { return 1; }
  }
  function markRate() {
    if (!ui) return;
    ui.querySelectorAll(".sp button").forEach((b) => {
      const on = rateOk(b.dataset.rate) === rate;
      b.classList.toggle("on", on);
      b.setAttribute("aria-pressed", on ? "true" : "false");
    });
  }
  function setRate(r, remember) {
    if (CAPTURE) return rate;
    r = rateOk(r) || 1;
    const was = rate;
    rate = r;
    M.timeScale(r);                                   // GSAP 이 재생 위치를 그대로 두고 앞으로의 진행만 바꾼다
    markRate();
    if (remember) { try { localStorage.setItem(RATE_KEY, String(r)); } catch (e) { /* 기억 못 해도 동작한다 */ } }
    // 재생 중이면 그림은 그 자리에서 계속 가고, 소리만 0.04초 뒤(at)부터 새 속도로 이어받는다 — 앞 세션은 at 까지 그대로 울리고,
    // 이미 시작한 효과음은 끝까지 울리며(끊기지도 두 번 나지도 않게), 배경음은 at 부터 교차 페이드한다(sound.js handover)
    if (r !== was && sess && actx && !M.paused()) {
      const at = actx.currentTime + .04, lo = sess.handover(at);
      tails.push(sess);
      sess = null;
      startAudio({ at, lo });
    }
    return rate;
  }
  const ui = document.getElementById("tz-ui"), hud = document.getElementById("tz-hud");
  const playNote = () => (rate === 1 ? "재생" : "재생 · " + rateText(rate));
  function note(text) {
    if (!hud || CAPTURE) return;
    hud.textContent = text;
    gsap.killTweensOf(hud);
    gsap.fromTo(hud, { opacity: 1 }, { opacity: 0, duration: .4, delay: 1.2 });
  }
  function play() {
    if (M.time() >= DUR - .02) M.seek(T_MIN, false);
    if (ui) ui.hidden = true;
    ensureAudio();
    startAudio();
    M.play();
  }
  function pause() { M.pause(); stopAudio(); }
  // 그 시각의 그림 — 뒤로 갈 때는 처음(T_MIN)으로 돌아간 뒤 앞으로 간다. 처음에서 앞으로 가는 길은 하나라 어느 시각이든 같은 그림이 나온다
  // (GSAP 이 거꾸로 되돌릴 때 반쯤 진행 중인 겹친 트윈의 값이 앞으로 갈 때와 몇 픽셀 다를 수 있다).
  function go(t) {
    if (t < M.time() - 1e-6) M.seek(T_MIN, false);
    M.seek(t, false);
  }
  M.eventCallback("onComplete", () => { sess = null; });
  function keys(e) {
    if (CAPTURE) return;
    if (e.code === "Space" || e.key === " ") {
      // 첫 화면 속도 단추에 키보드 포커스가 있으면(Tab) Space 는 그 단추를 누른다 — 고르기만 하고 재생은 하지 않는다(Enter 와 같게)
      if (e.target && e.target.closest && e.target.closest("#tz-ui .sp")) return;
      e.preventDefault();
      if (M.paused() || M.time() >= DUR - .02) { play(); note(playNote()); } else { pause(); note("멈춤"); }
    } else if (e.key === "r" || e.key === "R") {
      pause(); M.seek(T_MIN, false); play(); note("처음부터");
    } else if (e.key === "m" || e.key === "M") {
      muted = !muted;
      if (actx && mst) mst.vol.gain.setTargetAtTime(muted ? 0 : .82, actx.currentTime, .02);
      note(muted ? "소리 꺼짐" : "소리 켜짐");          // 「끔 · 켬」 은 CapaSans 서브셋에 없다(10-17 비평 T8) — 있는 글자로
    } else if ((e.key === "s" || e.key === "S" || e.code === "KeyS") && !e.ctrlKey && !e.metaKey && !e.altKey) {
      // 한글 입력 상태에서도(e.key = 「ㄴ」) 물리 키 S 로 돈다. Ctrl/⌘+S(저장)는 건드리지 않는다
      setRate(RATES[(RATES.indexOf(rate) + 1) % RATES.length], true);
      note("속도 " + rateText(rate));
    }
  }

  // 글꼴 예열 — 무대 글자 전부(TX · 샘플 세계)를 모든 굵기로 한 번 놓고 기다린 뒤 짓는다(글자 폭을 재는 곳이 있다)
  function warmFonts() {
    const text = JSON.stringify(TX) + JSON.stringify(D.long_list || {}) + (D.months || []).join("") + "0123456789.%−→—…·①②③";
    const box = el("div", null, null, document.body);
    box.style.cssText = "position:absolute;left:-99999px;top:0;white-space:nowrap;visibility:hidden";
    [["var(--sans)", 400], ["var(--sans)", 500], ["var(--sans)", 700], ["var(--sans)", 900], ["var(--display)", 800], ["var(--num)", 500], ["var(--num)", 700]].forEach(([f, w]) => {
      const s = el("span", null, null, box);
      s.style.fontFamily = f; s.style.fontWeight = w; s.style.fontStretch = f === "var(--display)" ? "75%" : "100%";
      s.textContent = text;
    });
    const loads = [["400 28px CapaSans"], ["500 28px CapaSans"], ["700 28px CapaSans"], ["900 28px CapaSans"], ["800 28px CapaDisplay"], ["500 28px CapaNumber"], ["700 28px CapaNumber"]]
      .map(([f]) => (document.fonts && document.fonts.load ? document.fonts.load(f, text).catch(() => []) : Promise.resolve()));
    return Promise.all(loads).then(() => (document.fonts ? document.fonts.ready : null)).then(() => { box.remove(); });
  }

  function boot() {
    build();
    fit();
    addEventListener("resize", fit);
    addEventListener("keydown", keys);
    if (T_AT != null) M.seek(clampT(T_AT), false);
    if (CAPTURE) { if (ui) ui.hidden = true; }
    else {
      setRate(rateAtStart(), false);
      if (ui) {
        ui.hidden = false;
        const btn = ui.querySelector(".go");
        // ▶ — 1배속이 아니면 재생하며 속도를 알린다(쿼리 · 기억한 속도로 시작할 때 덮개의 단추 강조만 보고 지나치지 않게. Space 시작과 같은 글귀)
        if (btn) btn.addEventListener("click", () => { play(); if (rate !== 1) note(playNote()); });
        // 속도 단추 — 고르기만 한다(재생은 ▶). 누른 뒤 포커스를 풀어 Space 가 단추를 다시 누르지 않고 재생 키로 가게 한다
        ui.querySelectorAll(".sp button").forEach((b) => b.addEventListener("click", () => { setRate(b.dataset.rate, true); b.blur(); }));
      }
    }
    window.TEASER = {
      duration: DUR,
      ready: true,
      cues: CUES,
      anchJump: ANCH_JUMP,                             // 개발용 — 비어 있어야 한다
      rippleOk: RIPPLE_OK,                             // ① 물방울이 WebGL2 경로인가(false = SVG 대체 그림 — 내보내기는 멈춘다)
      seek(t) { pause(); go(clampT(t)); return M.time(); },
      play,
      pause,
      speed: () => rate,
      setSpeed: (r) => setRate(r, false),
      time: () => M.time(),
      renderAudio() {
        return TZSound.render(CUES, DUR).then((buf) => {
          const w = TZSound.wav(buf);
          window.TEASER.audioInfo = { peak: w.peak, peakDb: 20 * Math.log10(Math.max(1e-9, w.peak)), gain: w.gain, bytes: w.bytes.length };
          return TZSound.b64(w.bytes);
        });
      },
    };
  }

  warmFonts().then(boot, boot);
})();

</script>
</body>
</html>
