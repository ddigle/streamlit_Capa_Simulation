[server]
maxUploadSize = 1024
# `static/` 의 파일을 `app/static/…` 으로 보낸다. 페이지 제목·상자 제목·큰 숫자의 Archivo 부분
# 글꼴(`static/fonts/`, `components/typography.py`)이 여기로 온다 — 사내 PC 는 외부 글꼴 서버에 못 나간다.
# 끄면 그 자리가 시스템 글꼴(Noto Sans KR → 맑은 고딕)로 떨어질 뿐 화면은 그대로 선다.
enableStaticServing = true

# 브라우저 ForwardMsg 캐시. 메타데이터를 뺀 직렬화가 문턱 이상인 요소는 브라우저가 들고 있다가, 같은 것이 다시
# 오면 해시 참조(약 75B)로 받는다 — 서버는 들고 있지 않다. 둘 다 숨은 옵션(문서에 없다)이라 Streamlit 을 올릴 때
# 이름과 동작이 그대로인지 다시 본다.
#
# `maxCachedMessageAge` — 기본 2 는 프래그먼트 회차(사이드바 상자 여닫기)에도 한 살씩 먹어, 상자를 두세 번
# 여닫거나 다른 화면 둘을 거쳐 돌아오면 HOME 의 그림·입장 화면이 지워지고 바뀐 것 없는 HOME 회차가 그림을 통째로
# 다시 받는다(합성 표본 약 1MB). 20 이면 20회차 안에 돌아온 화면은 다시 받지 않는다. 「Cached ForwardMsg MISS」
# 연결 오류 창(새로고침 전까지 본문이 빈다)은 드물어질 뿐 없어지지 않는다 — Streamlit 프런트가 상자 여닫기의
# script_finished 를 앱 전체 회차로 읽어 묵은 요소를 지우는데, 그 회차가 끝나기 전에 화면을 옮기면 방금 보낸 해시
# 목록의 요소가 지워져 서버가 보낸 참조를 못 푼다. 떠난 지 꼭 나이만큼(상자 여닫기도 한 회차로 센다) 된 화면으로
# 옮길 때만 걸린다. 기본값에서는 HOME→다른 화면→상자→HOME 처럼 흔한 꼴이고, 20 이면 꼭 20회차 전에 본 화면이라
# 드물다. 뜨면 F5 로 풀린다.
#
# `minCachedMessageSize` — 기본 10,000B 이면 회차마다 다시 가는 머리 띠 스타일(수 KB)과 HOME 제목 줄·공지 상자
# 스타일(1KB 남짓)이 내용이 그대로여도 늘 통째로 간다. 1,000 이면 셋이 시나리오 이름 길이·저장 상태와 상관없이
# 참조로 가고, 화면마다 rerun 에서 그대로 다시 가던 1~10KB 의 다른 요소(숨은 탭 편집표·입장 요약 등)도 함께
# 참조로 간다. 셋이 이 값 이상인지는 `tests/test_app_header.py` 가 이 줄을 읽어 확인한다.
#
# 대가는 브라우저 탭이 쥐는 캐시(나이 안에 받은 서로 다른 큰 요소의 합 — 조건을 바꿀 때마다 새 판의 그림이 더
# 쌓인다. 합성 표본에서 몇 MB)와 rerun 요청에 실려 올라가는 해시 목록(해시 하나에 약 34B, 수 KB)이다.
#
# 회차 끝 강제 GC 를 끄는 `[runner] postScriptGC = false` 는 두지 않는다. 회차는 빨라지지만 세션을 열고 닫는
# 순환에서 RSS 가 기본값보다 높은 채 머물렀고, 파이썬 자동 gen2 수집이 아무 회차에나 끼었다(합성 표본 30분).
[global]
maxCachedMessageAge = 20
minCachedMessageSize = 1000

[browser]
gatherUsageStats = false

# `base` 를 적지 않는다. 적으면 그 테마로 못박혀 브라우저·OS 설정을 따르지 않는다.
# 아래 `[theme]` 가 밝은 쪽, `[theme.dark]` 가 어두운 쪽이고 파이썬 토큰
# (`design/tokens.py`)이 같은 두 팔레트를 들고 있다 — 둘이 갈라지면 Streamlit 위젯과
# 우리 Figure 의 색이 서로 다른 테마가 된다.
[theme]
primaryColor = "#0F766E"
backgroundColor = "#F7F8FA"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#18181B"
borderColor = "#DDE0E5"
grayColor = "#646973"
dataframeBorderColor = "#DDE0E5"
dataframeHeaderBackgroundColor = "#E4E7EB"
chartCategoricalColors = ["#3F3F46", "#71717A", "#A1A1AA", "#D4D4D8"]
baseRadius = "8px"
buttonRadius = "8px"
showWidgetBorder = true
showSidebarBorder = true
baseFontSize = 14
baseFontWeight = 400
headingFont = "Noto Sans KR, Malgun Gothic, 'Apple SD Gothic Neo', sans-serif"
headingFontSizes = ["30px", "24px", "19px", "16px", "14px", "13px"]
headingFontWeights = [650, 650, 600, 600, 600, 600]
linkUnderline = false
# 색배지(`:green-badge[]` 등)와 알림 상자의 색. Streamlit 기본값은 zinc + teal 팔레트
# 밖이라 14개 화면 중 아홉이 다는 배지가 앱의 첫인상을 밖으로 끌어냈다. 알림 상자는
# `st.success`→green, `st.info`→blue, `st.warning`→**yellow** 를 본다(주황이 아니다).
greenColor = "#0B5A54"
greenBackgroundColor = "#E3EFEE"
blueColor = "#1D4ED8"
blueBackgroundColor = "#E5E9F7"
orangeColor = "#B45309"
orangeBackgroundColor = "#F6EBDC"
# `st.warning` 은 주황이 아니라 **노랑 슬롯**을 본다(Streamlit 의 알림 kind 매핑). 값을 비워
# 두면 팔레트 밖 순노랑으로 떠서, 배지를 정리하며 없앤 문제가 알림 상자에서만 남는다.
# 주황과 같은 값으로 두어 `:orange-badge[]` 와 경고 상자가 같은 뜻·같은 색이 되게 한다.
yellowColor = "#B45309"
yellowBackgroundColor = "#F6EBDC"

[theme.sidebar]
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F7F8FA"
textColor = "#20242B"
borderColor = "#E6E9ED"
primaryColor = "#0F766E"
# 사이드바 상자 머리글은 `components/sidebar_style.py` 가 주입한 CSS 가 정한다(1rem/700).
# 여기 h4 는 본문 쪽에만 남는데, 굵기를 같은 선에 두어 두 경로가 갈려 보이지 않게 한다.
# **이 블록은 토큰 대조 테스트에서 제외돼 있다** — 값이 갈라져도 조용히 통과하므로
# `design/tokens.py` 와 손으로 맞춘다.
headingFontWeights = [650, 650, 600, 700, 600, 600]
# 박스가 여럿 쌓이는 사이드바에서 각진 모서리가 가장 먼저 피로하다. 본문(10px)보다 한
# 단계 부드럽게 둔다.
baseRadius = "10px"

# ---------------------------------------------------------------- 어두운 테마
# 값의 근거는 `src/capa_simulation/design/tokens.py` 의 `_DARK` 에 있다. 여기 적는 것은
# **Streamlit 자신이 그리는 것**(위젯·사이드바·알림)의 색이고, 우리 Figure 는 토큰을 본다.
[theme.dark]
primaryColor = "#2DD4BF"
backgroundColor = "#131316"
secondaryBackgroundColor = "#1C1C21"
textColor = "#E9E9EC"
borderColor = "#35353E"
grayColor = "#9B9BA6"
dataframeBorderColor = "#35353E"
dataframeHeaderBackgroundColor = "#2B2B33"
chartCategoricalColors = ["#D4D4D8", "#A1A1AA", "#71717A", "#52525B"]
# 배지·알림 색. 밝은 쪽과 같은 뜻을 어두운 면에서 읽히게 옮긴다.
greenColor = "#7FD8C9"
greenBackgroundColor = "#17322F"
blueColor = "#9DB8FF"
blueBackgroundColor = "#1B2340"
orangeColor = "#F0B37A"
orangeBackgroundColor = "#33271A"
yellowColor = "#F0B37A"
yellowBackgroundColor = "#33271A"

[theme.dark.sidebar]
backgroundColor = "#1C1C21"
secondaryBackgroundColor = "#131316"
textColor = "#E9E9EC"
borderColor = "#35353E"
primaryColor = "#2DD4BF"
