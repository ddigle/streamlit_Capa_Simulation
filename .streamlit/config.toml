[server]
maxUploadSize = 1024

[browser]
gatherUsageStats = false

[theme]
base = "light"
primaryColor = "#0F766E"
backgroundColor = "#F7F8FA"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#18181B"
borderColor = "#DDE0E5"
grayColor = "#646973"
dataframeBorderColor = "#DDE0E5"
dataframeHeaderBackgroundColor = "#E4E4E7"
chartCategoricalColors = ["#3F3F46", "#71717A", "#A1A1AA", "#D4D4D8"]
baseRadius = "10px"
buttonRadius = "8px"
showWidgetBorder = true
showSidebarBorder = true
baseFontSize = 15
baseFontWeight = 400
headingFontSizes = ["40px", "24px", "20px", "17px", "15px", "13px"]
headingFontWeights = [650, 650, 600, 600, 600, 600]
linkUnderline = false

[theme.sidebar]
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F7F8FA"
textColor = "#20242B"
borderColor = "#E6E9ED"
primaryColor = "#0F766E"
