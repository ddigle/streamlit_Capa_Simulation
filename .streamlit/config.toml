[server]
maxUploadSize = 1024

[browser]
gatherUsageStats = false

# `base` 를 적지 않는다. 적으면 그 테마로 못박혀 브라우저·OS 설정을 따르지 않는다.
# 아래 `[theme]` 가 밝은 쪽, `[theme.dark]` 가 어두운 쪽이고 파이썬 토큰
# (`design/tokens.py`)이 같은 두 팔레트를 들고 있다 — 둘이 갈라지면 Streamlit 위젯과
# 우리 Figure 의 색이 서로 다른 테마가 된다.
[theme]
primaryColor = "#0F766E"
backgroundColor = "#F7F8FA"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#18181B"
borderColor = "#DDE0E5"
grayColor = "#646973"
dataframeBorderColor = "#DDE0E5"
dataframeHeaderBackgroundColor = "#E4E7EB"
chartCategoricalColors = ["#3F3F46", "#71717A", "#A1A1AA", "#D4D4D8"]
baseRadius = "10px"
buttonRadius = "8px"
showWidgetBorder = true
showSidebarBorder = true
baseFontSize = 15
baseFontWeight = 400
headingFont = "Noto Sans KR, Malgun Gothic, 'Apple SD Gothic Neo', sans-serif"
headingFontSizes = ["40px", "24px", "20px", "17px", "15px", "13px"]
headingFontWeights = [650, 650, 600, 600, 600, 600]
linkUnderline = false
# 색배지(`:green-badge[]` 등)와 알림 상자의 색. Streamlit 기본값은 zinc + teal 팔레트
# 밖이라 14개 화면 중 아홉이 다는 배지가 앱의 첫인상을 밖으로 끌어냈다. 알림 상자는
# `st.success`→green, `st.info`→blue, `st.warning`→**yellow** 를 본다(주황이 아니다).
greenColor = "#0B5A54"
greenBackgroundColor = "#E3EFEE"
blueColor = "#1D4ED8"
blueBackgroundColor = "#E5E9F7"
orangeColor = "#B45309"
orangeBackgroundColor = "#F6EBDC"
# `st.warning` 은 주황이 아니라 **노랑 슬롯**을 본다(Streamlit 의 알림 kind 매핑). 값을 비워
# 두면 팔레트 밖 순노랑으로 떠서, 배지를 정리하며 없앤 문제가 알림 상자에서만 남는다.
# 주황과 같은 값으로 두어 `:orange-badge[]` 와 경고 상자가 같은 뜻·같은 색이 되게 한다.
yellowColor = "#B45309"
yellowBackgroundColor = "#F6EBDC"

[theme.sidebar]
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F7F8FA"
textColor = "#20242B"
borderColor = "#E6E9ED"
primaryColor = "#0F766E"
# 사이드바 안에서 크기를 정하는 경로가 둘이었다 — 그룹 제목은 `app.py` 가 주입한
# CSS(1.15rem/700), `시나리오·리비전`·`조회기간` 머리글은 테마의 h4(17px/600). 두 줄이
# 다른 선에 서 있어 위계가 어긋나 보였다. h4 만 굵기를 올려 같은 선에 세운다.
# **이 블록은 토큰 대조 테스트에서 제외돼 있다** — 값이 갈라져도 조용히 통과하므로
# `design/tokens.py` 와 손으로 맞춘다.
headingFontWeights = [650, 650, 600, 700, 600, 600]
# 박스가 여럿 쌓이는 사이드바에서 각진 모서리가 가장 먼저 피로하다. 본문(10px)보다 한
# 단계 부드럽게 둔다.
baseRadius = "12px"

# ---------------------------------------------------------------- 어두운 테마
# 값의 근거는 `src/capa_simulation/design/tokens.py` 의 `_DARK` 에 있다. 여기 적는 것은
# **Streamlit 자신이 그리는 것**(위젯·사이드바·알림)의 색이고, 우리 Figure 는 토큰을 본다.
[theme.dark]
primaryColor = "#2DD4BF"
backgroundColor = "#131316"
secondaryBackgroundColor = "#1C1C21"
textColor = "#E9E9EC"
borderColor = "#35353E"
grayColor = "#9B9BA6"
dataframeBorderColor = "#35353E"
dataframeHeaderBackgroundColor = "#2B2B33"
chartCategoricalColors = ["#D4D4D8", "#A1A1AA", "#71717A", "#52525B"]
# 배지·알림 색. 밝은 쪽과 같은 뜻을 어두운 면에서 읽히게 옮긴다.
greenColor = "#7FD8C9"
greenBackgroundColor = "#17322F"
blueColor = "#9DB8FF"
blueBackgroundColor = "#1B2340"
orangeColor = "#F0B37A"
orangeBackgroundColor = "#33271A"
yellowColor = "#F0B37A"
yellowBackgroundColor = "#33271A"

[theme.dark.sidebar]
backgroundColor = "#1C1C21"
secondaryBackgroundColor = "#131316"
textColor = "#E9E9EC"
borderColor = "#35353E"
primaryColor = "#2DD4BF"
